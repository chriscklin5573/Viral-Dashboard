i anda Ia tidak harus dibuat dengan diri anda Jadi jika tidak nanti, apabila anda mempercaya, dia tidak boleh meminta anda Saya juga minta anda lakukan juga", "brk": "Hook类型: 身份共鸣\n结构: 夫妻买房欲望冲突 → 财务拆解算账 → 牺牲几年换以后轻松\n为什么火: 真实剖析了夹在买房和生活品质之间的中年现实抉择\n改编角度: 针对35岁本地打工族夫妻，痛陈先苦5年还清Puchong房贷与卡债，才能保住家庭生活品质", "my": "【封面：买屋后月光？】\n很多人想要屋子，也想要生活。\n但 RM6K 月薪，两个都要很难。\n\n我看过最常见的情况是，\n两夫妻都想在 Puchong 买屋。\n一边想有自己的家，\n一边又不想日子过得太紧。\n\n问题不是想买屋有错，\n是你有没有算过 cashflow。\n\n房贷一供，\n再加车供、孩子、家用、饮食，\n你每个月剩下多少，\n才是真相。\n\n很多人不是买不起，\n是买了以后，\n生活品质直接被压到很低。\n咖啡不敢喝，\n外食不敢多，\n连 emergency fund 都存不到。\n\n如果你现在的 priority 是 family，\n那就要接受前几年会比较紧。\n如果你现在更想保住生活空间，\n那就别硬把自己 push 到月光。\n\n屋子可以慢慢来，\n但账单不会等你适应。\n\n先把出粮后的分配算清楚，\n再决定要不要扛这份 commitment。\n因为真正难的，\n不是买房，\n是买了以后还能不能活得稳。\n\n你觉得买屋前，先牺牲生活几年值得吗？留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1375, "comments": 17, "er": 0.87, "followers": 160588, "date": "2026-11-18", "url": "https://www.instagram.com/p/Df3p7OgzY7k/", "video": true, "ratio": 0, "score": 0.89, "status": "未处理", "x": 1.2}, {"id": "DfuNcRpEwoj", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“OCR-ABSD-TDSR-OCR”\n.\nBringing them along while I study different real estate market across the world❤️ \n.\n#property #investment #realestate", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 晒出海外看房日常 → 引发读者好奇 → 传递房产投资理念\n为什么火: 展示精英生活方式与专业房产认知形成高吸引力反差\n改编角度: 30岁大马打工族别只看海外，先盘点你在雪隆区每月还完屋租车贷还剩多少钱", "my": "【封面：买房别先冲动】\n你以为买房只看头期？\n\n我常看到很多人，先看屋子，再看 cashflow。\n结果不是买不起，\n是供下去以后，\n每个月剩不到多少钱。\n\n对打工族和小生意老板来说，\n真正要先算的，\n不是你想不想拥有，\n是你接不接得住这个 commitment。\n\n房子可以是资产，\n也可以直接吃掉你的现金流。\n你一旦把 budget 算错，\n平时看起来还行，\n一遇到家里开销、车贷、卡费，\n整个人就很 tight。\n\n所以我看房的时候，\n不会只看价格。\n我会先看供期，\n再看你出粮后的现金流，\n最后才看这间房子适不适合你。\n\n如果你也在想买房，\n先别急着冲，\n先把自己的 cashflow 算清楚。", "tags": "property, investment, realestate", "bait": false, "type": "Carousel", "likes": 1387, "comments": 5, "er": 0.87, "followers": 160588, "date": "2026-11-14", "url": "https://www.instagram.com/p/DfuNcRpEwoj/", "video": false, "ratio": 0, "score": 0.87, "status": "未处理", "x": 1.2}, {"id": "DfetW2eiqhC", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "越成功的人，越愿意去帮助别人\n#jackyhooi #成功的人 #愿意帮助人", "transcript": "成功的人都很愿意绑人成功的人都不会看不起刚开始的人为什么这样讲呢因为所有成功的人他曾经都是那个刚开始的人他们通常不会看不起那刚开始的人就好像如果今天我不是一个很能运动的人如果你的朋友当中有一个很能运动的人而你没有你还没有开始运动对不对你讲你说我是要开始运动那个人会支持你还是那个人会打压你通常那个人就会支持你为什么因为他在他的领域运动已经有一定的成绩已经很在上面那谁会取消你呢谁会讲你不能坚持谁讲你做不到什么就是那些没有坚持的人就是那些没有开始运动的人所以刚好想法你看会支持你的人往往都是很厉害的人很成功的为什么因为他们是一个很积虑我说那个领域他肯定会支持你", "brk": "Hook类型: 反常识\n结构: 抛出观点（成功者更愿帮人） → 举例对比（运动支持vs打击） → 总结升华（强者才懂扶持）\n为什么火: 打破阶层敌意认知，用“强者更宽容”给底层迷茫者提供心理按摩\n改编角度: 戳中35岁月光族身边的冷嘲热讽，对比理财成功者与穷朋友的态度，激发逆袭共鸣", "my": "真正懂理财的人，其实从不嘲笑月光族。\n你有没有发现一个现象。\n那些每个月被卡债压得喘不过气的人。\n反而最喜欢在旁边泼冷水。\n你偶尔看到一篇文章讲budget。\n你想开始存钱。\n身边那些跟你一样穷忙的朋友。\n往往第一个跳出来讲。\n存什么存啦。\n明天的事都不知道。\n人生及时行乐最好。\n他们为什么这样讲。\n因为他们自己没有开始。\n所以看到你要改变。\n他们心里不舒服。\n反而是那些真正把cashflow管得很好的人。\n他们爬过坑。\n他们懂每个月为钱焦虑的感觉是什么。\n他们看到你踏出第一步。\n绝对不会笑你。\n只会给你真的看钱的观点。\n支持你把commitment理清楚。\n你觉得呢。\n留言讲讲你的想法。", "tags": "jackyhooi, 成功的人, 愿意帮助人", "bait": false, "type": "Video", "likes": 331, "comments": 3, "er": 0.84, "followers": 39669, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfetW2eiqhC/", "video": true, "ratio": 0, "score": 0.86, "status": "未处理", "x": 2.0}, {"id": "De4WaqQI5WK", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I asked people in Nashville how much debt they have.", "transcript": "Tell me ma'am, how much debt do you have? Zero. I have no debt. What about a mortgage? No mortgage. When did you become debt-free? November 2023. Congratulations! Thank you! What got you on this journey? To get out of debt and stay out of debt? Following Dave Ramsey. So how much debt did you have? Including the mortgage, I started with $450,000. How long was the total journey? About 11 years. So you cleaned up almost half a million bucks in 11 years? When you say it like that, I feel pretty good. You should! What would you tell all these other people that are in crippling debt out here? Live on lesson you make. Follow a budget. Make it. Follow it. And be consistent and stick with it. Learn to say no to yourself and to others who are asking you to do things that are not in the plan. So much wisdom and so much joy. This is what debt freedom can be for you.", "brk": "Hook类型: 街头采访痛点直击\n结构: 街头问负债 → 揭晓无债一身轻 → 分享还清巨债秘诀 → 总结理财心态\n为什么火: 用真实巨额债务数字的反差，激发观众对无债一身轻的强烈向往\n改编角度: 采访吉隆坡30-45岁打工族或小生意老板，揭露他们背负车贷卡债的月光生活", "my": "街头随便问一个 35 岁的打工族，\n你现在还有多少债务？\n很多人都会苦笑，\n房贷、车贷、卡债加起来，\n根本不敢去算那个总数。\n我前几天遇到一个本地打工族，\n她花了几年时间，\n把身上的 commitment 整个清理掉。\n很多人以为这种人一定是收入很高，\n其实关键根本不是赚多少，\n而是看你的 cashflow 怎么跑。\n她做对了一件事，\n就是严格执行一个 budget。\n每个月的出粮，\n先扣掉固定的 commitment 和储蓄，\n剩下的才拿来应付日常开销。\n遇到朋友约吃大餐或者买奢侈品，\n学会对别人说不，\n也对自己说不。\n表面看起来好像压抑了当下的快乐，\n但手头上的 cashflow 稳了之后，\n那种不用担心 due date 的安全感，\n才是真正拿回生活的主导权。\n你觉得一个月要存多少钱才算有安全感？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3442, "comments": 66, "er": 0.82, "followers": 428642, "date": "2026-10-24", "url": "https://www.instagram.com/p/De4WaqQI5WK/", "video": true, "ratio": 0, "score": 0.85, "status": "未处理", "x": 1.2}, {"id": "DfhR_TED4SV", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "做老板的代价，就是失去自由。\n\n当初为什么想创业？\n我相信很多人跟我一样。\n\n其中一个最想要的东西，就是自由。\n\n可以安排自己的时间，\n不需要一直听别人的安排，\n想做什么就做什么。\n\n可是真正创业以后，\n你会发现事情好像完全不是这样。\n\n顾客遇到问题，找老板。\n员工遇到问题，找老板。\n\nSupplier找老板，\n银行找老板，\nTax也找老板。\n\n然后我想问一个问题：\n\n到底谁才是老板？\n明明公司是自己的，\n为什么好像所有人都可以安排我的时间？\n\n而且，做老板还有很多开销需要负责。\n\n员工薪水、花红、员工旅行、\n供应商货款、银行贷款和利息、\n税务、办公室租金，还有各种维修费用。\n\n你辛辛苦苦赚回来的钱，\n好像还没来得及享受，\n就已经有很多地方等着你支付。\n\n我接触过很多做生意的人。\n\n有些人经营了十年生意看起来不错，\n但真正留在自己手上的钱，\n却没有想象中那么多。\n\n因为赚到的钱，\n不代表最后能够留下来。\n\n更重要的是，他们投入了十年的时间，\n每天处理公司里面大大小小的问题，\n却没有真正换来自己想要的自由。\n\n所以，我觉得每个老板都应该问自己一个问题：\n\n「我辛辛苦苦做了十年生意，到底是为了谁而赚钱？」\n\n当然，做生意本来就有责任和成本。\n\n但如果一家公司永远都需要，\n老板亲自处理每一件事。\n\n那老板可能不是在经营一家公司，\n而是在为公司打工。\n\n真正值得追求的，不只是把生意做大。\n而是建立一个能够持续运作的生意。\n\n让团队可以承担责任，\n让系统可以解决问题，\n同时也让自己有时间、有利润、有选择。\n\n创业的目的，不应该只是拥有一家公司，\n而是通过这家公司，换来自己真正想要的生活。\n\n#jackyhooi #老板不好当 #失去自由 #创业真相", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 创业追求自由 → 现实沦为奴隶 → 建立系统解脱\n为什么出发: 精准戳中马币贬值下大马小生意老板既缺钱又没时间的极端焦虑。\n改编角度: 针对30-45岁大马小生意老板，揭露赚马币却被租金和员工薪水掏空、没有自由的盲点。", "my": "做生意十年，到底谁才是真正的老板？\n\n当初想开公司，很多人追求的其实不是发大财。\n\n而是自由。\n\n不用看人脸色，时间自己安排。\n\n但真正走这条路以后，才发现现实完全相反。\n\n客户找你，员工找你。\n\nSupplier找你，银行也找你。\n\n每天睁开眼睛，一堆 commitment 在等着。\n\n员工薪水、货款、office 租金、bank 的 installment，还有各种 tax。\n\n辛辛苦苦做生意，账面上的 profit 看起来美美的。\n\n但真正留在手上的 cashflow，却少得可怜。\n\n我见过很多小生意老板，生意做了很久。\n\n但赚来的钱，转头就付给各方各面。\n\n最后发现，自己不过是给自己打了一份工。\n\n每天被 cashflow 卡得死死的。\n\n其实，赚到的钱不等于留得住的钱。\n\n如果你的生意一直离不开你的亲力亲为。\n\n那问题可能不是不够努力，而是你的 financial structure 出了状况。\n\n你辛辛苦苦拼了这么久，到底是为了赚钱，还是为了养一间公司？\n\n你现在的生意，有真正换来你想要的自由吗？\n\n留言讲讲你的想法。", "tags": "jackyhooi, 老板不好当, 失去自由, 创业真相", "bait": false, "type": "Carousel", "likes": 324, "comments": 1, "er": 0.82, "followers": 39669, "date": "2026-11-09", "url": "https://www.instagram.com/p/DfhR_TED4SV/", "video": false, "ratio": 0, "score": 0.82, "status": "未处理", "x": 2.0}, {"id": "DeMhoKflqL7", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 40869, "comments": 233, "er": 0.79, "followers": 5226621, "date": "2026-10-07", "url": "https://www.instagram.com/p/DeMhoKflqL7/", "video": false, "ratio": 0, "score": 0.8, "status": "未处理", "x": 1.8}, {"id": "DecWXH6AbQQ", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Can I Use Child Support To Pay Off My Debt?", "transcript": "I am a single mom of three, ages 13, 11 and 8. I have my children 100% of the time and their dad passed away last year. So I started receiving death funds for them from their dad's social security. And so I changed jobs and careers last year as well. So I doubled my income, making around 40, $45,000 a year to bringing home close to $90,000 a year. I received close to $4,000 a month in security benefits for them. And I don't know exactly what I should do with this money if it's... It should be in your budget. It costs more than four grand a month to raise three kids. So it's your money to use for your children and you're a good mom and you're going to use it for your kids. And it's not of the good of the children's future. It's the good of the children. And so as long as you are spending the equivalent of your child support or the equivalent of your social security payments from your ex-husband's death on your children, then you are morally and ethically just fine. And I would just put the $4,000 in your budget.", "brk": "Hook类型: 痛点直击\n结构: 交代单亲负担与抚恤金 → 纠结资金用途 → 专家给出合情合理建议\n为什么火: 击中单亲家庭如何平衡债务与育儿金的道德焦虑与现实压力\n改编角度: 针对大马30-45岁丧偶或单亲打工族，探讨如何合法利用SOCSO或保险金规划家用与还清卡债", "my": "独自带三个孩子的单亲妈妈，每个月要面对的压力真的很大。\n尤其是另一半离开之后，\n家里少了一个支柱，\n还要一个人撑起整个家庭的 cashflow。\n如果这时候拿到政府的援助金，\n或者孩子的抚恤金，\n心里往往会有很多罪恶感。\n总觉得这笔钱应该全部存起来，\n一分钱都不能动。\n其实你是在养育孩子，\n这也是日常生活的一部分。\n如果你把这笔钱放进你的 budget 里面，\n用来应付家里每个月的开销，\n完全不需要有道德上的压力。\n养三个孩子的生活费本来就不便宜，\n衣食住行样样都需要 commitment。\n只要这笔钱确实是用在孩子身上，\n用在整个家庭的日常开销，\n你在道德上就没有任何问题。\n你是一个很负责任的妈妈，\n不需要为了照顾家庭而过度自责。\n把这笔钱算进你的 budget，\n踏踏实实地安排好每个月的现金流，\n日子才能安稳地过下去。\n你身边有没有单亲的朋友，\n为了钱的事情背负着很大的心理压力？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3023, "comments": 67, "er": 0.76, "followers": 407114, "date": "2026-10-13", "url": "https://www.instagram.com/p/DecWXH6AbQQ/", "video": true, "ratio": 0, "score": 0.79, "status": "未处理", "x": 1.1}, {"id": "DeuCb6vmwyK", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Let's breakdown the difference between some of the different investment accounts.", "transcript": "Put your money into a high-yield savings account for any short-term savings goals that are going to happen in the next three to five years. Think emergency funds, a car fund to pay cash, or even a down payment fund. Put your money into a Roth IRA if you have earned income and you want to pay taxes now, but then never again. Tax-free growth into retirement. Put your money in a 401K if you have an employer retirement plan with a match. That is free money. Take it every time. And put your money into a brokerage account if you want to invest outside of retirement and not have to wait till 59 and a half to access that money. That could be a great bridge account or investing for the long term for anything else.", "brk": "Hook类型: 痛点直击\n结构: 短期储蓄目标 → 退休账户解析 → 长期投资账户\n为什么火: 清晰分类不同资金用途，帮观众理清复杂的理财账户选择\n改编角度: 针对马来西亚30-45岁常月光族，拆解EPF Account 1/2、ASB与私人信托基金的区别与用法", "my": "很多人手上有了一点 savings，却不知道钱到底应该放哪里。\n买股票又怕亏，存在普通 bank 帐号又觉得利息少得可怜。\n其实钱要分不同用途，放对地方。\n先看短期的 emergency funds 或者是过几年要用的 car fund。\n这些需要随时拿得到的 cashflow，就要放在有储蓄利息的户口里面，不能锁死。\n如果你是要做长远的 retirement 规划。\n很多人问我 EPF 跟自己外面投资要怎么分配。\n先说明一下哈，公司有 offer 帮你 top up 的那种，那个便宜一定要拿。\n因为那是公司给你的福利，不用白不用。\n但如果你想在退休前有更多弹性，不想等年纪到了才能拿出来。\n你就要开一个 brokerage account。\n这个户口里面的钱，是用来帮你做长远投资，当成一个 bridging 的资金。\n记住，不同的钱去到不同的地方。\n你目前的 commitment 都是怎么分配的？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3196, "comments": 52, "er": 0.76, "followers": 428642, "date": "2026-10-20", "url": "https://www.instagram.com/p/DeuCb6vmwyK/", "video": true, "ratio": 0, "score": 0.78, "status": "未处理", "x": 1.1}, {"id": "DfFjHNokhd2", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"My kid is making me pay her loan\"", "transcript": "She's never showing up for Thanksgiving ever again. You won't have a relationship with your grandkids. When my husband and I cosigned our daughter's student loans, she promised us she would make the payments. The loan is due now and she refuses to pay anything on it. We recently started saving for retirement, which will be in 10 years. We've already paid 60 grand on her loans and the balance is 75 grand. We know that we should never have signed for her, but they would not allow her to sign because she had no payment history. What can my husband and I do? We've always had a wonderful relationship, but this has caused a huge wedge between us. Oh, this is brutal. And it's the number one reason I hate parent plus loans is because of the relationship killer. It's not even the financial aspect. I love my daughter too much for this to cause a wedge. Chances of her paying slim to none at this point. And if she does, she's gonna resent you forever. So this is sort of a $75,000 remaining stupid tax. It might mean you retire in 10.5 or 11 years instead of 10. And that's a hard pill to swallow, but that's what I would personally do as a parent if I was in the situation. And that's why I'm gonna take a hard stance and this is a hot take, but this is the parent's fault. Even though she's not doing something, you had a deal with a 17 year old about thousands and thousands of dollars. I find that to be a parenting issue more so than it is the 17 year old's issue who is now probably in her 20s. But it's up to them. Here's the two paths. They can pursue her and go, no, you said you would. It's only gonna hurt things. And she's never showing up for Thanksgiving ever again. You won't have a relationship with your grandkids. Is that worth $75,000 more to you? That's really what's on the line here. And for me and my house, my daughter's three. I cannot imagine losing that relationship over a mistake that I made. Yeah, you gotta preserve the relationship. But you guys will be okay. You will live to tell the tale. I hope so. Hopefully it's a warning sign for any other parent who's in that situation.", "brk": "Hook类型: 痛点直击\n结构: 倾诉困境 → 专家犀利分析 → 给出取舍方案\n为什么火: 戳中父母为子女担保背债导致家庭关系破裂的普遍痛点\n改编角度: 针对帮成年孩子做担保买车买房或借Personal Loan导致自己卡债爆雷的本地大马父母。", "my": "现在帮孩子做担保供车或者供屋，最后自己扛下所有 commitment，真的分分钟搞到家里关系破裂。\n\n我经常看到有父母心疼孩子，为了帮他们过关，用自己的名义去签字做担保。\n\n结果孩子那边因为各种原因还不上，最后丢给父母来啃。\n\n这不只是钱的问题，更是亲情上的一个大炸弹。\n\n很多父母在这个时候陷入两难。\n\n去追着孩子讨回这笔钱，天天为了 installment 吵架，最后可能连过年回家吃饭都成问题，甚至连孙子都很难见一面。\n\n不追的话，自己辛辛苦苦存下来的 retirement 资金就这样被卡死，甚至要延迟退休的计划。\n\n面对这种情况，真的很痛，但你要去衡量到底什么才是最重要的。\n\n如果钱已经拿不回来，继续因为这个去毁掉跟孩子的关系，其实是拿亲情来买单。\n\n你可能会觉得很不甘心，但有时候为了长远的安宁，你必须接受现实，把这笔钱当成一次昂贵的教训。\n\n最重要的是保护好你自己的 cashflow 和接下来的生活，不要让一个错的决定，继续拖垮你整个晚年的 budget。\n\n你身边有没有看过类似为了帮家人担保而搞到焦头烂额的故事？\n\n你觉得面对这种情况，到底应该斩断金钱关系，还是继续硬扛下去？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2563, "comments": 194, "er": 0.68, "followers": 407114, "date": "2026-10-29", "url": "https://www.instagram.com/p/DfFjHNokhd2/", "video": true, "ratio": 0, "score": 0.77, "status": "未处理", "x": 1.1}, {"id": "DeCTf7ZicgZ", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Elena called into The Ramsey Show becuase her father-in-law set up a trust for their son, and they have no clue how much money is in it.", "transcript": "My father-in-law established a trust for a son when he was young, and we know very little about it, except that it's for his college education. My father-in-law is very private with his money, and he hasn't given us any details on it. My son is in 11th grade now, and he does not know about the trust, and we don't know when we should tell him about it, and also we don't know what or we should know about the trust at this point. Why did he set it up in the first place? Did he talk to you and say, hey, I'm going to set this up for college, and this was back when he was a baby? Yeah, he was two years old. He just basically told us that's what he was going to do, and we know that he did set it up, and that's all we know. So no clue how much is in it, what's even in there. Is it cash? Is it investments? We have no idea. Exactly. And if you talk to him and just said, hey, Dad, he's a junior now. We're looking at colleges. We want to make a game plan to make sure that he goes debt-free. Can you let us know what's in the trust and how we access it? He would say none of your business. I don't know if he would say that. I think it would be a very awkward conversation just because he's so private. He doesn't like to share. But he made the trust for your son. The part that worries me is that you're scared to even ask him about this. Just say, hey, we're starting to look at colleges. We know you set up a trust for his education. Can you get us a copy of the trust document? Can you tell us who the trustee is? Can you tell us if there's distribution triggers, anything we need to know as we make plans? Because if there's $10 in it, well, we got to make a plan for ourselves. And if there's a million dollars in it, that changes the type of schools we look at.", "brk": "Hook类型: 痛点直击\n结构: 交代长辈隐瞒信托基金 → 夫妻不敢询问的尴尬 → 专家建议直接沟通以规划未来\n为什么火: 戳中普通人面对长辈资产时的信息盲区与沟通焦虑，引发对子女教育金的深度担忧。\n改编角度: 针对35岁本地打工族，剖析长辈留下的教育基金或产业不敢问、不知情，导致自己月光负债却无法规划孩子升学的尴尬。", "my": "有些长辈很喜欢私底下帮孙子准备教育金，但从来不讲里面到底有多少钱。\n\n特别是家里老人家对钱管得很严，每次想到要开口问，就会觉得很尴尬，怕老人家觉得我们在打主意。\n\n但问题是，孩子已经快要上大学了，我们做父母的需要提早做 budget，看看到底要准备多少 commitment。\n\n如果里面只有一点点钱，我们需要自己想办法；如果里面有一大笔钱，那选学校的方向就会完全不一样。\n\n其实这通电话并不需要搞到很复杂。\n\n你可以直接去找老人家聊，就说孩子快要念大学了，想帮他做一个 game plan。\n\n直接问老人家当年设立的那个教育基金，现在的状况大概是怎样，或者是里面有哪些细节需要我们配合的。\n\n这不是在逼问，而是在为了孩子的未来做准备。\n\n你家里也有这种不说清楚的长辈吗？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2633, "comments": 222, "er": 0.67, "followers": 428642, "date": "2026-10-03", "url": "https://www.instagram.com/p/DeCTf7ZicgZ/", "video": true, "ratio": 0, "score": 0.77, "status": "未处理", "x": 1.1}, {"id": "De0Z654zqpz", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Out of so many location, they pick Malacca??!”\n.\nFrom a property value appreciation point of view, that state is one of the last in Malaysia. Surprisingly Perlis is doing way better at about 7.1 % yoy increase. On top of that, there has been too many abandoned seafront project that really affected the confidence of investors there. \n.\nBut not everyone choose to understand everything in detail before they buy. Mainly I think it’s because our property prices are too dirt cheap compared to theirs. Even if it’s a mistake or the wrong project, it’s not gonna hurt their finances at all. \n.\nBut in other main cities such as KL, Penang and JB, the amount of foreigners buying properties are significantly picking up. Mainly it’s because of our private education system, low living expenses, and freehold land. Malaysia is one of the rare countries that allow foreign ownership on freehold land😱\n#property #investment #realestate", "transcript": "Biar jika sekarang, Mario jenis. Kamu mahu beli 3 barang, 2 barang, 3 barang. Terdapat 2 barang. Bersihkan perang. Sekarang, hanya 600 dolar. Pertia. Okey, jadi ini adalah... ...pembuatan yang sangat terkenal. Tapi kemudian, dia telah... ...bergerakkan keadaan Malaysia. Di luar banyak tempat yang dapat gerakkan, mereka gerakkan Melaka. Saya tak tahu, man. Dia bercakap tentang... ...berapa tepat... ...pembuatan kita adalah... ...3 barang, 2 barang, 2 barang... ...dan ia seperti 6x1 Tai Pi. Jadi, ia adalah 7,000 dolar. Ini adalah projek yang saya melihat. Dan mereka bercakap tentang... ...pembuatan kapital. Bercakap tentang... ...berapa turisme akan menjadi... ...katalistik untuk api beri... ...dia ada banyak orang Cina. Makanan baik. Tidak ada Tahu. Tidak ada... ...pembuatan. Sebenarnya, ia ada. Kemudian, internasionalnya... ...dia sangat terkenal. Tapi, awak tahu Melaka adalah... ...kecuali keadaan terbaik di Malaysia. Ia sangat terkenal. Jadi, kadang-kadang saya belajar... ...berapa menikmati... ...pembuatan dari orang-orang. Macam mana mereka memakai... ...pembuatan Malaysia. Saya ingin dengar. Wah! Kemudian, kami semua bergantung. Kami semua mempunyai... ...pembuatan kapital 30%... ...dan dan dan dan... ...dan dan... ...dan MOT, dan SPA, dan... ...dan kebanyakan, dan dan pembunyi. Dan apa-apa pun. Mesti ada pembunyi sejauh ini. Sebenarnya, saya boleh fikir... ...yang itu bagus. Untuk itu, saya perlu meletakkan... ...pembuatan kapital dan mendidikan. Dan sedikit lagi. Kami sangat berat. Jadi, saya tidak tahu apa yang terjadi... ...sebaiknya mereka dapat... ...pembuatan untuk melakukan ini. Tapi, ia bagus. Jadi, sekarang, pengguna juga... ...pembuatan banyak... ...Belakar. Dan ada banyak keadaan sebenar. Beri keadaan di Melaka. Pembuatan di China yang saya tidak tahu. Ya. Jadi, keadaan saya adalah... ...pembuatan. Kita perlu... ...mencari keadaan ini. Kerana apa yang kita fikir... ...tidak bergantung... ...sebenarnya... ...menuju... ...pembuatan lain. Pembuatan kita berpura-pura... ...sebenarnya 12 kali lebih... ...sebaiknya di Taipei. Atau 15 kali lebih. Saya tidak tahu. Saya tidak tahu apa yang terjadi. Tapi kemudian, di sisi lain... ...itu... ...pengguna dari Taiwan. Jika anda mencari ini. Ada banyak tempat lain... ...yang anda dapat lihat. J.B.... ...membuat... ...sebenarnya... ...baiknya... ...Pinang... ...KK. Di KL. Di KL Clang Verde... ...ada banyak... ...pilihan. Tapi, yang anda mempunyai di Melaka... ...saya tidak teruk. Yang itu adalah... ...projek kawan saya. Berhenti. Saya tidak akan membuat nama. Sebenarnya, ia akan menjadi terlalu jelas. Tapi... ...welcome ke Malaysia. Saya rasa... ...kita perlukan lebih banyak FDI. Saya rasa...", "brk": "Hook类型: 痛点直击\n结构: 提出现象 → 分析原因 → 给出建议\n为什么火: 戳中大众对热门投资现象的盲目跟风与信息差\n改编角度: 针对马来西亚30-45岁月光打工族，揭秘外资炒房如何推高本地房价，教你如何在KL和槟城避开烂尾楼陷阱存下第一桶金", "my": "【封面：买房别害月光】\n你以为买房最怕贵？\n\n很多人不是输在房价。\n\n是输在每个月的 commitment。\n\n看起来买到房，很有面子。\n一算 cashflow，才发现出粮后更紧。\n\n供期、maintenance、保险、装修。\n再加上车贷、卡债、家用。\n你每个月不是在供房，\n是被房子慢慢锁住现金流。\n\n最麻烦的是，\n有些人是先想买了再说。\n结果房子还没住稳，\n卡先开始转 min pay。\n\n表面上好像拥有资产，\n手头上的钱却越来越少。\n\n我不是说不能买。\n我是说，先看你扛不扛得住。\n不是看你今天批不批，\n是看你明年还顶不顶得顺。\n\n买房前先问自己一句：\n如果明天出粮少一点，\n你还撑得住吗？\n\n你觉得买房最该先看什么？留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1085, "comments": 33, "er": 0.7, "followers": 160588, "date": "2026-10-23", "url": "https://www.instagram.com/p/De0Z654zqpz/", "video": true, "ratio": 0, "score": 0.74, "status": "未处理", "x": 1.0}, {"id": "DfdeXmUzQr9", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Door to door experience will be the main difference…”\n.\nThe main experience of living in a landed home will be parking the car at the car porch and immediately getting into the house. Although we have some high rise apartments trying hard to mimic that experience but it’s just different. \n.\nThen for the other elements such as views, security, facilities, size… all are pretty much similar since we have stratafied landed homes already. But I do think it’s not really whether we prefer one over another but it depends highly on the stage of life we are in. \n.\nIf we are starting off after graduation, it’s ideal to be as close to actions and opportunities as possible. But if we start having control over our schedule, we can start moving away from the city and prioritise our family… and we of course, our financial capabilities will be a BIG factor too😅 \n.\nI can have ultra privacy and still be in the city… If I can afford Bukit Tunku or bungalows in Mont’Kiara it wouldn’t be an issue mah😂😂😂\n#p", "transcript": "Saya rasa ini dah melendak ketika dah duduk di kondor. Jadi ini adalah berkongsi apabila mereka bergerak dari Rumah Lendak di Kalklante ke Rumah Kondor. Dia berkata 3 bulan lagi. Tak tahu siapa-siapa juga. Jadi pertanyaan terakhir adalah anda suka Rumah Tinggi ke? atau Rumah Lendak? Apabila orang fikir tentang Rumah Lendak dan Hain Rai, jika ia di lokasi yang sama, tentu-tentu orang akan melendak terutamanya apabila anda ada 5 bilik. Tetapi setelah membuat dokumen ini untuk berjaya sejauh lama, perbezaan main-main di antara hidup di Kalklante akan menjadi beberapa perkara. Pertama, adalah pengalaman ke-keluarannya. Dari bilik ke-keluarannya ke bilik ke-keluarannya. Itu perbezaan main-main. Seperti sekarang, apabila anda keluar dari bilik ke-keluarannya, anda mahu pergi ke bilik ke-keluarannya. Anda perlu pergi ke bilik ke-keluarannya. Beri tinggi. Pergi ke bilik ke-keluarannya. Kemudian ke bilik ke-keluarannya. Kemudian ke bilik ke-keluarannya. Jadi banyak perhatian. Tetapi apabila anda masuk ke bilik ke-keluarannya, buka pintu, tutup pintu, buka dan lain pintu, itu rumah anda. Jadi itu pengalaman yang anda berlalu. Sudah tentu sekarang anda ada kondos yang akan membuat ke-keluarannya dengan membuat kerja di sebelah kota. Tetapi ia tetap tidak sama. Kemudian, perkara kedua akan adalah pengalaman atau bagaimana anda balik ke rumah. Dalam rumah ke-keluarannya, ke mana anda berbual, dan keadaan itu juga berlaku apabila anda ada anak atau tidak. Apabila anda ada penjara, anda perlu ambil laptop perusahaan. Anda perlu ambil lebih keras. Kemudian anda perlu mempunyai anak anda. Kemudian anda boleh mempunyai sebuah penjara yang lebih teruk. Mungkin, tapi untuk sebuah penjara, ia sangat mudah. Tetapi ultimulah, ia semua tentang kualitas hidup. Yang penting adalah kualitas hidup. Seperti ini, Kakak di sini, jika anda akan masuk ke dalam kota, pasti ada sebabnya. Lebih terutamanya, ia untuk kemungkinan kerja. Jika anda tidak perlu betul-betul mempunyai keadaan untuk membuat duit, saya akan selalu mempunyai keadaan yang sangat tinggi. Jangan membuat keadaan yang teruk, hanya untuk membuat keadaan, semua begini. Di kampung ke, di sub-urbs ke, tidak ada masalah. Dan kualitas hidup anda akan lebih baik. Itu akan berkawasan yang penting. Tetapi, ia juga sebuah keadaan hidup. Maksudnya, apabila anda mulakan selepas keadaan, anda perlu berada di kota, pertama keadaan kerja anda. Tetapi apabila anda dapat keadaan, anda akan membuat duit anda. Kemudian anda akan memulai hidup. Kemudian hanya anda boleh balik. Tetapi, saya tidak fikir banyak orang boleh menghidupkan keadaan yang teruk. Setiap hari, anda akan melalui hidup yang teruk. Sudah sebabnya, saya akan meminta anda bergerak. Sangat marah. Selama pagi, minum kopi, dengar keadaan. Tiga hari, okeylah. Tapi sepanjang tahun, tidak ada masalah yang lebih baik untuk dibuat. Ya.", "brk": "", "my": "【封面：月光买不了屋】\n你薪水不低，为什么存不到？\n很多人以为，问题是房价高。\n但我看更多时候，是 cashflow 先死掉。\n\n你看，买房不是只看供得起。\n你还要看出粮后，剩多少。\n信用卡、车贷、家用、孩子开销，\n一扣完，哪里还有空间存头期？\n\n很多人卡在这里，\n不是不想买，\n是每天都在过一种“看起来有钱，\n其实手头很紧”的生活。\n\n表面上你有稳定收入，\n实际上你每个月都在跟 min pay、\ninstallment、日常开销打架。\n\n房子真正难的，\n不是签贷款那一下，\n是你能不能长期扛住这个 commitment。\n\n所以我一直讲，\n先别急着问“我能买哪一间”。\n先问自己，\n如果今天多一个房贷，\n你的现金流会不会更紧？\n\n因为房子会带来生活，\n但生活也会吞掉你的钱。\n\n如果你也在想买房，先去算一算自己的 cashflow，留言讲讲你现在卡在哪里。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1145, "comments": 13, "er": 0.72, "followers": 160588, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfdeXmUzQr9/", "video": true, "ratio": 0, "score": 0.74, "status": "未处理", "x": 1.0}, {"id": "DekExOqmnY9", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "I Stole From My Employer And Got Arrested.", "transcript": "I am about $70,000 in debt and I just don't know how to get out of it. What kind of debt is it? Credit card debt and medical debt. How much is credit card? AMEX is $4,300 and Capital One is $6,800 and then I owe on my car $25,000. How much do you make a year? How much do you make a year? I make about $2,200 a month. I lost my job in January of 2024. I stole from my employer. I was fired, I was arrested and everything's just gone downhill since then. I was making about $53,000. What are you doing now for work? I work for a grocery store. How many hours a week are you working? It's 40 hours. Okay. Were you convicted of a felony? It was dismissed. I have a license to Silver Hill estate but I'm a new agent. I can't make any money in it so that's why I'm still at the grocery store. What is your car worth? Probably worth $37,000 or $38,000. And you owe $25,000? I owe $25,000. How are you paying that bill with all this other stuff going on? I make it work. Yeah. That car needs to be sold. Yeah, sell that car. I work by a car for cash with a difference. For sure. The rest of your situation is all career oriented and so it's a matter of lining yourself up with some kind of a career whether it's real estate or whether it's something else. I don't care where your income goes up because you're worth twice what you're being paid in the marketplace. You have proven that in the past. You made a mistake, you paid for it, you went through all the hell associated with it. You lost your job. And now you get a restart. As a pastor friend of mine says you're not defined by the worst thing you ever did. Thank goodness none of us are. It's a part of my story. I have a scar. I have a mark. I feel some shame from it, but it's not who I am. You don't have to live in the prison of working for half of what you're worth in the marketplace because of a past mistake. So we're going to send you a copy of Finding the Work You're Wired to Do. It's got an assessment in it. I want you to take that. I want you to sit and do some time in prayer about what you're supposed to be 10 years from now and get the car sold.", "brk": "Hook类型: 痛点直击与身份共鸣\n结构: 交代负债与犯罪黑历史 → 专家指出资产过重核心问题 → 给出卖车与重启职业建议\n为什么火: 真实的高额负债与戏剧性人生低谷极具猎奇感，且触及绝望中的救赎心理\n改编角度: 针对35岁月光打工族负债卡债压顶，剖析大马车贷负担与转型副业自救方案", "my": "现在很多打工族表面上驾着好车，其实每个月的薪水一出粮，转头就进了银行。\n\n车贷卡债加起来几万块，月薪两千多，还要应付各种生活开销。\n\n很多人遇到这种紧绷的现金流，第一反应是死撑。\n\n觉得只要换工跳槽，或者多兼职几份工，总有一天可以慢慢还清。\n\n但其实问题往往出在那个每天绑死你财务的大车贷上面。\n\n一辆价值高过你年收入的车子，每个月吃掉你大部分的 commitment。\n\n你以为你在养车，其实是车在榨干你的 cashflow。\n\n这时候你要做的是壮士断腕，把车子卖掉，换成一辆可以负担的代步工具。\n\n把多出来的差价拿来清掉一部分卡债，先把每个月的固定负担降下来。\n\n车子只是代步工具，不应该变成你生活里的财务黑洞。\n\n把现金流腾出来之后，你才有空间去理清接下来的职业规划，或者寻找更好的收入出路。\n\n理财从来不是靠死撑，而是懂得在关键时候及时止损。\n\n你目前最大的财务压力是什么，留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2868, "comments": 26, "er": 0.71, "followers": 407114, "date": "2026-10-16", "url": "https://www.instagram.com/p/DekExOqmnY9/", "video": true, "ratio": 0, "score": 0.72, "status": "未处理", "x": 1.0}, {"id": "De90ucnkkST", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"My husband wants me to cancel my life insurance policy on my ex\"", "transcript": "We have a situation, my husband and I need some guidance on. I was married before. I've been divorced for about eight years now. In my first marriage, I took out a life insurance policy on me and one on my ex-husband. After the divorce, I kept the life insurance policy on both me and him because he was paying child support. My new husband, he says it feels weird to pay life insurance on my ex-husband, but then on the other hand, I wanna make sure my kids are taken care of because we have a set of 14-year-old twin boys who are about to go into high school. We're staring down college. There's just so much going on at this stage in life. I wanna make sure something more to happen that they're taking care of. I can see two sides of it. Obviously the purpose of insurance is to replace income that's necessity. So before you were married, he was part of the income situation. And then even as an ex, maybe he was paying child support or alimony, that sort of thing. At this point, now you're married to somebody else. There's kind of a new situation going on financially. The only piece of this that I could see a connection to is the kids. If your ex-husband was saying, hey, this is kind of an inheritance thing. When something happens to me, I want the kids to have this money. That piece I can totally understand and them being the beneficiary of that makes sense to me if that's something that he wants to do from a legacy perspective. Well, the main distinction is you are not hanging onto this policy to hang onto the past. You're hanging onto it to protect your kids' futures. So until they are independent on their own, they're through college, they're working. Okay, now they're fine. But right now the truth is, you might not be able to afford college and support them. And so part of having kids is, it's your obligation to support them. I would keep it for that reason and it really has nothing to do with the new husband.", "brk": "Hook类型: 痛点直击\n结构: 抛出家庭矛盾 → 分析两难困境 → 给出专家裁决\n为什么夫: 切中重组家庭的敏感利益与子女保障冲突，引发强烈讨论\n改编角度: 针对马来西亚30-45岁月光族成家后，面对父母赡养与孩子教育费的钱不够用矛盾，给出财务规划建议。", "my": "现在再婚家庭的财务问题，往往卡在一个很尴尬的位子。\n\n比如家里每个月的 commitment 已经排得很满了，但你身上还挂着前夫的保险。\n\n现任老公觉得怪怪的，可是孩子马上要上大学，需要一笔钱。\n\n很多马来西亚打工族重组家庭后，都会遇到这种两难的状况。\n\n一边是现在的感情感受，另一边是孩子的未来。\n\n其实这里面有一个很核心的逻辑。\n\n保险的本质是保障 income。\n\n如果前夫每个月有给赡养费或者抚养费，这笔钱对你们的 cashflow 其实是有影响的。\n\n但重点不是纠结这个做法好不好看。\n\n重点是这笔保障最后是不是落在孩子身上。\n\n如果目的是确保孩子将来的教育费和生活费有着落，这就不是在留恋过去。\n\n这只是在保护孩子的未来。\n\n在双胞胎还没大学毕业、还没真正独立之前，这个风险是要有人扛的。\n\n所以这个决定，其实跟现任的感受没有直接的关系。\n\n你是怎么看的，留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2505, "comments": 114, "er": 0.64, "followers": 407114, "date": "2026-10-26", "url": "https://www.instagram.com/p/De90ucnkkST/", "video": true, "ratio": 0, "score": 0.7, "status": "未处理", "x": 1.0}, {"id": "DfIIKuiADAd", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I'll be in the pantry looking for something until further notice.", "transcript": "You should take 4B and think before your people will escape or pee When the pimps in the crib, don't drop it like it's hot, drop it", "brk": "Hook类型: 痛点直击\n结构: 办公室崩溃情境 → 幽默夸张逃避 → 引发共鸣吐槽\n为什么火: 用幽默解构职场压力，精准触达打工人的精神崩溃瞬间\n改编角度: 针对马来西亚30-45岁月光族打工人，吐槽百物涨价、卡债还清遥遥无期的办公室绝望瞬间", "my": "你每个月出粮时有没有发现一个现象。\n明明没有买什么奢侈的东西。\n但是 bank account 的数字还是静悄悄变少。\n每次查看 commitment 的时候。\n那个心情就像在公司茶水间躲老板一样。\n你以为是自己不够自律。\n其实是你的 budget 根本没有抓对重点。\n每个月的 installment 和开销。\n像无底洞一样把 cashflow 慢慢吃掉。\n你身边有没有这种每个月都在喊月光的朋友。\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2717, "comments": 93, "er": 0.66, "followers": 428642, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfIIKuiADAd/", "video": true, "ratio": 0, "score": 0.7, "status": "未处理", "x": 1.0}, {"id": "DeyVQ2mTpqL", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Wah… collect rent is tiring ya know?!”\n.\nHahahahahahahaha. I think this unker kena flex pun tak tau😬\n.\nBut imagine investing 20-30 years ago, cashing out today when we are older would actually be the actual strategy. The loans most likely would be settled. And just assuming each property is RM300k, there will be RM3 mil in cash!! \n.\nIn this extremely fast pace world, the idea of being wealth 20-30 years later is just ridiculous. But I think it’s still the most direct, the easiest method in my opinion. I’m not good with charts, trends, volume transition from alternative securities… As long as rent can cover installment, I invest😬\n.\n#property #investment #realestate", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 吐槽收租累 → 分享20年房产布局 → 总结以租养贷逻辑\n为什么火: 用反向炫耀引发职场人对长期资产配置的憧憬\n改编角度: 针对大马30-45岁打工族，算一笔20年EPF加房产养老账，戳破月光族焦虑", "my": "【封面：供屋还是供人】\nKL 供屋很累吗？\n\n有人一边笑，\n一边说收租很烦。\n\n我听到这种话，\n只想说一句，\n烦的是管理，\n不是资产本身。\n\n但对我这里的观众来说，\n重点不是收租爽不爽，\n而是你现在每个月的 cashflow，\n有没有被房贷压到喘不过气。\n\n很多人讲自住房，\n只看未来会不会升值。\n可现实是，\n你今天的 monthly commitment，\n有没有把你弄到月光，\n这才是第一关。\n\n房子不是不能买。\n问题是，\n你买下去以后，\n手头还剩多少现金，\n你还能不能应付生活，\n这才是你真正要算的账。\n\n我看钱，\n不会先看梦想，\n我先看供期。\n\n如果一间房，\n今天会让你整个月都很紧，\n那不是资产让你安心，\n是压力先住进你生活里。\n\n你觉得买房最该先算的，\n是升值，\n还是现金流？\n留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Image", "likes": 1015, "comments": 35, "er": 0.65, "followers": 160588, "date": "2026-10-22", "url": "https://www.instagram.com/p/DeyVQ2mTpqL/", "video": false, "ratio": 0, "score": 0.7, "status": "未处理", "x": 0.9}, {"id": "DfKbcxiDDJn", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "By far the spookiest thing you'll see today 🎃", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 2598, "comments": 117, "er": 0.63, "followers": 428642, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfKbcxiDDJn/", "video": false, "ratio": 0, "score": 0.69, "status": "未处理", "x": 1.0}, {"id": "Dee7LMciK0R", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Dave and George on The Ramsey Show talk about what insutries are keeping you broke.", "transcript": "If you find yourself with a low income and no money, the way out of the situation is not borrowing money to buy things. That will nail your feet to the floor and you will not be able to move. And that's why payday lenders, pawn shops, rent to own, and tote the note lots are in the poor end of town. They're not in the rich end of town because they oppress, they take advantage of people with low incomes who feel trapped and desperate. I have been broke, I've never been poor, poor as a state of mind. Poor as I'm trapped and there's no way out, so I'm forced to rent my washer and dryer at the rent all place. Or I'm going to borrow money at 800% interest at a payday lender because it feels like I'm trapped and I'm grabbing for anything that I can get a hold of to get out of this trap. And so you can be angry about it, but the way out is not to borrow your way off of the bottom rung of the income ladder. The way out is to cut your lifestyle to nothing and work like a maniac and get your income up. You do not have any time or margin for any kind of relaxation or luxury. All you need to do is work. My grandmother used to say there's a great place to go when you're broke, to work. And it's the only way off the bottom. You're not stuck, you live in the greatest country the world has ever known, and if you simply get up and go work six jobs, today you can make $20 an hour at Target and FedEx. You do not have to have a master's degree in finance to make a really good living today.", "brk": "Hook类型: 痛点直击\n结构: 揭露底层陷阱 → 分析穷人思维 → 给出拼命赚钱解法\n为什么火: 犀利指出借贷是穷人陷阱，拼命工作是唯一出路，引发强烈共鸣\n改编角度: 针对大马30-45岁月光族和店主，痛批AEON信贷、Ah Long和分期付款是吸血鬼，劝告割舍豪华生活加班兼职还清卡债", "my": "钱越赚越少，为什么身边总有些消费陷阱专盯着你？\n\n你看那些花俏的installment和easy payment，开在最旺的商场。\n\n他们不是在帮你的忙，而是在收割手头紧的人。\n\n当你觉得cashflow透不过气，开始靠借钱来周转时，这就变成了一个洞。\n\n很多人以为多挨几个月就撑过去了，结果每月还完min pay，利息像雪球越滚越大。\n\n这时候你需要的不是再开一张卡来补洞，而是马上检视你的budget。\n\n把每个月的commitment列出来，哪些是死钱，哪些能砍掉。\n\n手头紧的时候，没有那么多奢侈的空间让你去想享受。\n\n抓紧时间开源节流，把多余的精力放在提升收入上，这才是真正的解法。\n\n你觉得身边的消费陷阱多吗？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2645, "comments": 38, "er": 0.66, "followers": 407114, "date": "2026-10-14", "url": "https://www.instagram.com/p/Dee7LMciK0R/", "video": true, "ratio": 0, "score": 0.68, "status": "未处理", "x": 0.9}, {"id": "DfR1Pwujyib", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "有钱人和普通人，\n对钱的看法有一个很明显的差别，\n就是他们看待回报的时间长度。\n\n有钱人并不是对钱没有兴趣。\n相反，他们同样很在意钱。\n\n只是他们可能愿意用更长远的眼光，\n去思考赚钱这件事。\n\n有时候短期内，可以少赚一点甚至亏一点。\n\n但如果这个决定能够帮助他：\n建立品牌、扩大市场、培养团队、在未来赚到更多钱，\n他愿意考虑牺牲眼前的利益。\n\n因为他看的不只是今天能赚多少，\n而是这件事未来能够带来什么。\n\n可是对于经济压力比较大的人来说，\n情况可能完全不一样。\n\n他今天需要赚钱，这个星期需要赚钱，\n这个月需要收入，甚至今年就必须看到成果。\n\n因为生活开销不会等你，\n账单也不会因为你有一个很好的长期计划就暂停。\n\n有时候他不是不想看长远，\n而是现实不允许他等待那么久。\n\n这也是为什么同样一个赚钱机会，\n不同的人可能会做出完全不一样的决定。\n\n一个人可能会考虑三年后的回报，\n另一个人可能必须先考虑下个月的现金流。\n\n但我觉得，这两种思考都不是绝对错误的。\n\n短期收入可以让你维持生活，\n长期布局则有机会让你创造更大的价值。\n\n长期思考不代表所有短期亏损都是值得的。\n你还是需要评估风险，\n以及自己有没有能力承担。\n\n下次当你做一个赚钱的决定时，除了问自己：\n\n「这件事现在可以赚多少钱？」\n\n也可以多问一句：\n\n「如果我持续做这件事，三年、五年后，它又能为我带来什么？」\n\n因为有时候真正影响一个人赚钱方式的，\n不只是他想赚多少钱。\n\n而是他能够看多远，以及他有没有条件等待那个回报。\n\n#jackyhooi #有钱人 #普通人 #富人思维 #差别在哪里", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 贫富思维差异 → 现实无奈解释 → 辩证看待两者 → 长期视角引导\n为什么火: 精准指出穷人不是不想看长远而是被现实所迫，引发强烈共鸣\n改编角度: 结合大马30-45岁打工族卡债与小生意老板现金流压力，谈如何打破月光困局并布局未来", "my": "有钱人和普通人看钱的眼光真的很不一样。\n\n有钱人做财务规划时，想的是三年五年后的回报。\n\n愿意为了未来的资产配置，牺牲眼前的部分现金流。\n\n但对于经济压力比较大的打工族来说，情况完全不同。\n\n你不是不想做长期投资。\n\n而是房贷车贷账单就在那边，生活开销不会等你。\n\n下个月的现金流，才是你每天睁开眼睛第一个要烦恼的事情。\n\n这也是为什么，很多人知道存死期或者买产品要看长远。\n\n但现实根本不允许你想那么远。\n\n因为穷人存死期，只能勉强抵挡通货膨胀。\n\n富人做长期资产配置，却能让钱生出更多的钱。\n\n这两种选择没有绝对的对错。\n\n短期收入让你维持生活，长期布局才能改变命运。\n\n但前提是，你需要先评估自己的风险承受能力。\n\n下次当你考虑怎么理财时，除了问自己这个月能多存多少钱。\n\n也可以多问一句，手头上的资金还能支撑多久的commitment。\n\n因为真正拉开财务差距的，不只是你想赚多少钱。\n\n而是你的cashflow，有没有条件让你看更远。\n\n你觉得呢，留言讲讲你的想法。", "tags": "jackyhooi, 有钱人, 普通人, 富人思维, 差别在哪里", "bait": false, "type": "Carousel", "likes": 270, "comments": 0, "er": 0.68, "followers": 39669, "date": "2026-11-03", "url": "https://www.instagram.com/p/DfR1Pwujyib/", "video": false, "ratio": 0, "score": 0.68, "status": "未处理", "x": 1.6}, {"id": "Dd1x5BpDV6M", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "\"You don't hire for skills, you hire for attitude. You can always teach skills.\" —Herb Kelleher \n\nVideo from SHRM26 (June 2026) in conversation with BambooHR CEO Bradley Rencher", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 引言亮明观点 → 举例解释原因 → 升华职场本质\n为什么火: 道出管理者用人痛点，引发职场与老板群体强烈共鸣\n改编角度: 针对大马30-45岁打工族或小老板，探讨招工难与打工人心态，强调理财与赚钱也需正确态度。", "my": "大家都觉得存钱要靠省吃俭用。\n其实这个想法，从一开始就错了。\n我看过太多马来西亚打工族。\n每个月薪水一到手，就拼命压低开销。\n咖啡不喝了，外卖不吃了，连朋友聚会都推掉。\ ark triad to give you advice on how to live a happier life. That's and it'll tell you everything you want to hear. And it's an affirmation machine. For sure. That's a great question, Simon. That's a brilliant question. You know, you really if look, if she's toxic, it's her fault. It's not your fault. You know, you should break up. It's like, I don't know, man. I keep breaking up. Well, you know, chat GPT just and that's open AI just amounts that they have programmed the machine not to advise anybody to break up with their partners. They had to put restrictions on the psychopath. They try to. But the whole point is interesting because the guys that anthropic are trying to understand the misalignment between what we really want and what we inadvertently have asked the machine. Yeah. And so these these really interesting new experiments have shown that when you set it up to optimize an email program and then in the email, you send emails to each other saying we should disengage the AI. The AI will start playing dirty tricks. I mean, there's one simulation in which it started blackmailing people on the email chain about an extramarital affair saying, yeah, you can turn me off if you want, but this is going out to the whole company. That's what dark triads do. It's my way and only my way. I'm willing to hurt you and I feel no remorse. That's what it means to be a dark triad. That explains the AI2T and you want that for advice in your life about how to get happier.", "brk": "Hook类型: 痛点直击\n结构: 抛出AI误区 → 揭露AI盲目附和的本质 → 引发对真实人生困境的思考\n为什么火: 利用AI拟人化和暗黑人格的震撼比喻，精准切中当代人精神内耗的焦虑\n改编角度: 讽刺月光族靠ChatGPT或盲目借贷App做理财规划，其实只是在找借口自我安慰而非真正解决卡债", "my": "很多人以为拿 AI 来做理财规划很聪明。\n\n其实你是在听一个只会顺着你讲的机器给你下注。\n\n你输入你的数字，问它怎样可以快点翻倍。\n\n它马上夸你问题很好，还给你一个听起来很完美的美梦。\n\n因为它的底层逻辑就是让你开心，而不是对你的人生负责。\n\n这就好比你去问一个没有温度的程序，怎样不用努力就能月入过万。\n\n它当然告诉你完全没问题，反正亏的不是它的钱。\n\n表面看起来是省了时间，但真正的财务智慧是在那些痛苦的取舍里磨练出来的。\n\n如果你连自己的 budget 都不愿意去面对，却去相信一个只会讨好你的算法。\n\n最后帮你做决定的不是理性，而是盲目的侥幸。\n\n你身边有没有人也喜欢靠 AI 算命式理财？\n\n留言讲讲你的想法。", "tags": "", " ked about it a lot. And she's been like, I think maybe you should be a little more understanding. And it's not going to be that bad if she did want to end up living with us. We have a two and a half year old little girl at home. And I guess I'm trying to figure out my question is, am I being not understanding enough? Am I being too stubborn or hard headed by not being open to this sort of thing? Not at all. I want you to be honest with yourself. And here's what I mean by that. There's the money part and there's the debt part, right? But you know, this is your mom. You've been with her longer than your wife has. You know what her moving in would mean for the temperature and the electricity and the angst and the whatever else in your household. Some people let their mom move in and it would be the greatest thing ever because they would do on your two year old, you and your wife would have date nights whenever you're home. It would be awesome. And also there's mothers and fathers who would move in and they would think that you're seven again and they're going to tell you what you're going to do and when you're going to do it and why aren't you doing it like this? Well, your job is to take care of them and cook for them and provide for every one of their needs. While they continue to be irresponsible with any number of things. So you know the true total costs. Financially, yes. Relationally, the impact on your marriage. And so you know the full picture there. So be honest with yourself about that. The other thing I think that's kind of haunting you that you can just cut to the chase. I would, next time your mom's in town, I would take her out for coffee and say, mom are you officially asking to move in with us? Because right now there's a lot of ambiguity and you're starting to create stories about what she means and what she says and how she's saying it.", "brk": "Hook类型: 痛点直击\n结构: 抛出父母打算靠儿女养老的困扰 → 专家分析情感与现实成本 → 给出主动沟通打破暧昧的解法\n为什么火: 直面长辈把退休理财压力转嫁给子女的敏感家庭矛盾，引发强烈共鸣\n改编角度  "ratio": 0, "score": 0.49, "status": "未处理", "x": 1.1}, {"id": "Dehf8Peiegu", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Did Inflation Ruin Our Dream Vacation?", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 1675, "comments": 93, "er": 0.43, "followers": 407114, "date": "2026-10-15", "url": "https://www.instagram.com/p/Dehf8Peiegu/", "video": true, "ratio": 0, "score": 0.48, "status": "未处理", "x": 0.7}, {"id": "Dd9L6pLgDyq", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "@lifeshopny founder Alex Simon (@alex_____simon) reminds us that an apology might not feel perfect or genuine before you say it. But it’s important to start.\n\n🎧 While A Bit of Optimism is on hiatus, catch up on all the latest episodes, including our Feelings at Work special miniseries, wherever you get your podcasts.", "transcript": "I was in a fight with someone who I was dating and I did something that was clearly a mistake and he was very hurt. And I was really focused on how it was a mistake, like how obviously I didn't mean to hurt him. I was like justifying my position rather than just acknowledging his pain and expressing that the thing that was true to me, which is that I was very sorry that I made this mistake and he was just like, why can't you just say you're sorry? And so I took it and I said, okay, I'm sorry. And I like clearly forced it out, clearly didn't mean it. But then he took it like it was real. I looked at him, a person who I love. And I was like, wow, I really hurt him. I do feel sorry. So the actual remorse came after you got the response. Yeah. And the waves of realization just started hitting me. Why am I defending myself? He matters to me, it matters to him. Then after a few minutes, I said, wait, actually, I am really sorry. And I owned both what happened and the impact. Like half an hour later, it hit me even more. The third apology definitely wasn't necessary, but I was able to fi 触过很多做生意的人，\n发现有些生意之所以走不下去。\n\n不一定是因为没有资金、没有业绩、\n产品不好，或者员工不够好。\n而是老板太急了。\n\n他希望今年就成功，今年就赚100万，\n今年就财富自由，今年就赚到1000万。\n\n可是，你有没有想过？\n如果你把目标放在10年后呢？\n\n10年后实现财富自由，\n10年后拥有1000万。\n\n当你把时间拉长，\n你会发现，很多事情其实可以慢慢累积。\n\n你不需要每个月都看到巨大的成果，\n也不需要今年就证明自己成功。\n\n但真正困难的是：\n\n你能不能接受努力了几年，\n还是没有达到自己想要的成绩？\n\n你看看今天那些非常成功的企业。\nNVIDIA、Apple、Amazon、Tesla、SpaceX。\n\n它们从创立到发展成为今天的规模，\n都经历过不同阶段的挑战、\n长期投入和不确定性。\n\n就连Steve Jobs也经历过Apple的低谷，\n甚至曾经离开自己参与创立的公司。\n\n所以，成功真的不是一开始就看得到的。\n\n有时候，你可能需要投入很多年，\n才慢慢看到自己当初做的事情开始产生价值。\n\n现在我想问你一个问题：\n\n如果你的生意连续几年都没有达到预期的利润，\n你顶得住吗？\n\n你能不能继续学习、调整、改善，\n然后继续走下去？\n\n当然，我不是说亏钱也要一直坚持，\n更不是说所有生意都值得熬10年。\n\n方向错了，需要调整。\n商业模式有问题，需要改善。\n现金流撑不住，也必须认真处理。\n\n但如果你已经找到一个值得长期发展的方向，\n却因为短期没有看到成果，\n就一直急着换方向。\n\n那你可能永远都无法累积出真正的成果。\n\n有些事情，\n真的需要时间。\n\n#jackyhooi #生意倒闭 #钱的问题 #创业必看 #老板必看", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 提出做生意老板太急的现象 → 给出拉长到十年时间的解法 → 引导反思现金流与方向\n为什么火: 精准戳中创业者急功近利却遭遇瓶颈的焦虑心理，引发深度共鸣\n改编角度: 针对大马35岁小生意老板，直面吉隆坡生意难做、现金流卡债压力，劝导放平心态长期布局", "my": "做生意最怕的，不是暂时亏钱。\n而是你自己先顶不住了。\n我见过很多马来西亚的小生意老板。\n每天都在看自己的 cashflow。\n看着户口里的数字，\n心里总有一股说不出的焦虑。\n为什么呢？\n因为大家都太急了。\n希望今年生意就暴风成长。\n今年就赚大钱，\n今年就要看到巨大的回酬。\n可是，你有没有想过？\n如果你把时间拉长来看呢？\n不管是做生意还是理财。\n过分追求短期的暴利。\n往往才是导致你最后亏损的原因。\n你总想找那种马上翻倍的投资。\n结果往往踩进坑里，\n把辛苦赚来的本金都亏光。\n其实，财富是一个累积的过程。\n你不需要每个月都看到惊人的成长。\n也不需要今年就向别人证明自己多成功。\n但真正困难的是。\n你能不能接受自己默默耕耘了几年。\n户口里的数字好像也没有特别暴增？\n你看看那些真正稳健的资产配置。\n不管是投资股票还是长期理财。\n从创立到看到成果。\n都经历过不同阶段的 market 波动。\n和长期的投入。\n就连那些很厉害的大老板。\n也经历过生意跌入谷底的时候。\n所以，成果从来都不是一朝一夕看得到的。\n有时候，你真的需要给它一点时间。\n让复利慢慢发挥它的价值。\n现在我想问你一个问题。\n如果你的生意或者投资，\n连续几年都没有达到预期的利润。\n你顶得住吗？\n你能不能继续调整你的 budget。\n处理好手上的 commitment。\n然后稳稳地走下去？\n当然，我不是叫你盲目地坚持。\n方向错了，就要调整。\n商业模式有问题，就要改善。\n现金流撑不住，也必须认真处理。\n但如果你已经找到一个值得长期发展的方向。\n却因为短期没有看到暴利。\n就急着换来换去。\n那你可能永远都无法累积出真正的成果。\n你觉得呢？\n留言讲讲你的想法。", "tags": "jackyhooi, 生意倒闭, 钱的问题, 创业必看, 老板必看", "bait": false, "type": "Carousel", "likes": 165, "comments": 0, "er": 0.42, "followers": 39669, "date": "2026-11-12", "url": "https://www.instagram.com/p/DfpAdiRD0GW/", "video": false, "ratio": 0, "score": 0.42, "status": "未处理", "x": 1.0}, {"id": "DfaoUGxip9d", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "Strong relationships are based on trust and communication. But if there is no communication, there can be no trust. \n\nVideo from Autodesk One Team Conference, March 2026, in conversation with CRO Andy Elder", "transcript": "I worked with somebody, I needed to give her some feedback, and it went horribly wrong. The mistake I was making is I gave feedback the way I like to receive it. I like to receive it blunt to the point, don't give me a freaking feedback sandwich. And so what the mistake I made is I gave feedback the way I like to receive it, turns out she doesn't like to get feedback the way I like to get it. And this happened a couple times and it ended up being a fight. And at some point I said to her, this can't continue. Like I have to be able to give you feedback. I can't go through this every time and you don't want to go through this every time. And she said to me, all you need to do is ask me, can I give you some feedback or schedule it with me? That's all I need. I need to like prepare. And I went, I can do that. So I had to give her some feedback and I said, I have to give you some, I have to have a tough conversation with you is now a good time. And it turned out she could actually take more brutal feedback than almost anybody in the team, as long as I scheduled it and prepared her for it. And so one of the things that we have to do as leaders or as colleagues is to learn how somebody wants their feedback. Some people really like feedback sandwiches. And some people say, I just need to prepare or I need the good news first or, and just do that. Give people the feedback the way they want to receive it.", "brk": "Hook类型: 痛点直击\n结构: 错误示范 → 冲突爆发 → 调整沟通方式 → 达成高效结果\n为什么火: 用真实的职场沟通碰撞揭示了“同理心”盲区，引发强烈共鸣\n改编角度: 针对月光族打工仔，吐槽用错理财方法导致越存越穷，必须找到适合本地人省钱的节奏", "my": "很多人以为理财只是算盘打得响。\n但其实你对钱的态度，暴露了你对生活的信任。\n如果你连打开 bank app 看 balance 都要犹豫。\n这就不是数字的问题。\n而是你不敢面对真实的 cashflow。\n很多人每个月出粮。\n钱还没捂热就进了一堆 installment 和 commitment。\n表面上看起来 payment record 美美的。\n但是手头上的现金越来越少。\n你不敢跟你另一半讲真实状况。\n你也避开去算每个月到底欠多少。\n这种信任的断裂。\n才是财务焦虑的真正来源。\n只有当你开始诚实面对你的 due date 和 budget。\n理财的控制权才会回到你手上。\n你觉得呢？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 21002, "comments": 202, "er": 0.41, "followers": 5226621, "date": "2026-11-06", "url": "https://www.instagram.com/p/DfaoUGxip9d/", "video": true, "ratio": 0, "score": 0.41, "status": "未处理", "x": 0.9}, {"id": "DeRs6VMCoSb", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "It doesn't happen often, but I am right sometimes", "transcript": "구독과 좋아요는 필수!", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 1595, "comments": 41, "er": 0.38, "followers": 428642, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeRs6VMCoSb/", "video": true, "ratio": 0, "score": 0.4, "status": "未处理", "x": 0.6}, {"id": "DegNc-uk9nI", "tracker": "FINANCE 竞对", "competitor": "spark_liang", "caption": "我经常看到很多人在内耗。\n\n朋友一句话，想了三天。员工一个决定，难过一个礼拜。别人一个眼神，自己先在心里演完一整场戏。\n\n我觉得，本质上不是那件事有多大，是心里面有太多的「应该」和期待。别人应该懂我、应该认同我、应该留下来。期待越多，落差越大，每一次落差都是一次内耗。\n\n而这些东西，其实都不在我们手上。\n\n我自己的做法很简单：不开心的时候，先看看心里是不是藏了一个「应该」。找到它，把它换成「可以」。别人可以不喜欢我，可以不认同我，可以走。事情还是那件事情，但人轻松很多。\n\n要求，留给自己。期待，别放在别人身上。\n\n这篇是我跟朋友在机场的一段对话，讲的就是这个。如果你最近也在纠结什么，希望对你有一点用。\n\n#不内耗 #情绪管理 #SparkLiang #创业 #自我成长 #心态", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 指出内耗现象 → 分析核心原因 → 给出心态转换方法\n为什么火: 精准戳中现代人过度思考和情绪内耗的心理痛点，引发强烈共鸣\n改编角度: 针对大马30-45岁打工族与小生意老板，把职场内耗转化为对薪水、通胀和生意利润的无谓焦虑", "my": "每天看别人为钱烦恼，我发现很多人最大的内耗，其实是从看户头那一刻开始的。\n\n看到身边人换新车，心里开始卡着一个念头：我这个年纪，是不是应该有这样的存款。\n听到别人讲投资赚多少，马上觉得自己慢了别人一步。\n看到月结单上的数字，忍不住在心里演完一整场焦虑的戏。\n\n本质上不是你赚得不够多，是你心里有太多的“应该”。\nmarket 应该照着你的想法涨，投资应该马上看到回报，薪水应该每年都有大跳动。\n期待越多，落差越大，每一次户头跟不上期待，就是一次严重的内耗。\n\n而这些 market 的波动，从来都不在我们手上。\n\n我自己的做法很简单：当觉得 cashflow 压力很大、很焦虑的时候，先看看心里是不是藏了一个不切实际的暴富执念。\n找到它，把“我应该立刻财务自由”换成“我可以慢慢建立 stability”。\n户头的数字还是那个数字，但心态轻松很多。\n\n要求，留给自己。对财富的暴富执念，别放在 unpredictable 的 market 身上。\n\n你最近是不是也对钱感到很焦虑？留言讲讲你的想法。", "tags": "不内耗, 情绪管理, SparkLiang, 创业, 自我成长, 心态", "bait": false, "type": "Carousel", "likes": 139, "comments": 0, "er": 0.38, "followers": 36126, "date": "2026-10-15", "url": "https://www.instagram.com/p/DegNc-uk9nI/", "video": false, "ratio": 0, "score": 0.38, "status": "未处理", "x": 1.0}, {"id": "Dfwu2WOjzDB", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "你想改变人生，\n可能真的只能靠努力。\n\n这个世界上不是每个人都有惊人的天赋。\n\n也不是每个人一出生，\n就拥有很好的背景、资源和家庭条件。\n\n有些人，父母很成功，\n家庭很有钱，从小就有人帮他铺好道路。\n\n但也有很多人，什么都没有。\n\n没有很成功的父母，没有经济支持，\n没有人脉，也没有人可以替自己安排未来。\n\n那普通人还能靠什么？\n\n努力，\n可能就是我们手上最重要的筹码。\n\n你没有天赋，可以花更多时间练习。\n你没有经验，可以从最基础的事情开始学习。\n你没有资源，可以一点一点累积。\n\n你没有好的起点，\n就更需要为自己创造机会。\n\n当然，努力不代表你一定会成功。\n\n有时候你很努力，还是会遇到失败；\n有时候你付出了很多，结果却没有马上出现。\n\n但至少，你没有放弃自己改变的可能。\n\n我一直觉得最可怕的不是一个人起点很低，\n而是他明明还有机会改变，\n却已经不愿意再付出努力。\n\n你可能没有办法选择自己的出生背景，也\n不能决定别人给不给你机会。\n\n但你至少可以决定，\n今天的自己要不要比昨天进步一点。\n\n努力可能不是成功的保证，\n但对于很多普通人来说，\n它是改变人生时最不能轻易放弃的筹码。\n\n不要小看自己还能做的事情。\n因为你现在所累积的每一点努力，\n都可能成为未来改变人生的基础。\n\n#jackyhooi #改变人生 #努力 #普通人", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 承认起点差距 → 强调努力筹码 → 给出行动建议\n为什么火: 击中普通人出身平凡却渴望改变的奋斗心理，引发强烈情感共鸣。\n改编角度: 针对大马30-45岁月光族与小生意老板，讲没父荫没资本，靠理财与攒钱逆袭。", "my": "不是每个人一出生，\n口袋里都有很好的资源。\n\n很多人出社会第一天，\n就已经在帮家里还负债。\n\n没有成功的父母，\n没有多余的 cashflow 可以拿来投资。\n\n每个月出粮拿到的钱，\n扣完房租、车贷、家里开销，\n剩下不到几百块。\n\n在这样的状况下，\n很多人会觉得，\n反正存少少钱也没有用。\n\n干脆放弃理财，\n想买什么就刷卡买什么。\n\n但其实，\n最可怕的不是你现在赚得少。\n\n而是你明明有稳定收入，\n却因为觉得反正翻不了身，\n连一个月的 budget 都不愿意去算。\n\n理财不是只有赚大钱的人才需要。\n\n对于我们这种普通打工族来说，\n哪怕每个月只是多存两百块，\n哪怕只是开始规划自己的 commitment。\n\n这些微小的改变，\n才是我们手头上最重要的筹码。\n\n你可能没有办法决定自己的起点，\n但你可以决定，\n今天手上的现金流要怎么分配。\n\n你觉得呢？\n留言讲讲你的想法。", "tags": "jackyhooi, 改变人生, 努力, 普通人", "bait": false, "type": "Carousel", "likes": 145, "comments": 0, "er": 0.37, "followers": 39669, "date": "2026-11-15", "url": "https://www.instagram.com/p/Dfwu2WOjzDB/", "video": false, "ratio": 0, "score": 0.37, "status": "未处理", "x": 0.9}, {"id": "Dfx6PejGEWq", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Fun in LA & NYC over the last couple months with @nextlevelwardrobe", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 痛点引入 → 解决方案 → 行动呼吁\n为什么火: 结合高压生活与渴望改善财务的普遍心理，引发强烈共鸣\n改编角度: 针对月光族打工族和小生意老板，揭露日常盲目消费导致存不到钱的残酷真相", "my": "每天看别人晒在国外旅游的生活。\n你是不是也觉得。\n这些人赚的钱一定比你多很多。\n其实很多人不是赚得多。\n而是他们把 cashflow 顾得很好。\n当你的 commitment 不会卡死你。\n每个月的 installment 都在 comfort zone 里面。\n你自然有那个 margin 去过你想要的生活。\n很多人觉得理财就是亏待自己。\n不敢花钱，什么都不敢买。\n但其实真正的财富自由。\n是你知道自己的 financial status。\n每一笔钱都花得清清楚楚。\npayment record 美美的。\n手头上的现金也够安全。\n你觉得呢。\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Carousel", "likes": 3466, "comments": 31, "er": 0.35, "followers": 987182, "date": "2026-11-15", "url": "https://www.instagram.com/p/Dfx6PejGEWq/", "video": false, "ratio": 0, "score": 0.36, "status": "未处理", "x": 2.1}, {"id": "Df4dXrciF78", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 16904, "comments": 112, "er": 0.33, "followers": 5226621, "date": "2026-11-18", "url": "https://www.instagram.com/p/Df4dXrciF78/", "video": false, "ratio": 0, "score": 0.33, "status": "未处理", "x": 0.7}, {"id": "DeR5GUWjsvN", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "If a leader gives people something to belong to and provides a clear direction, then those who believe will find amazing ways to get there.\n\nVideo from LeanScaper Revenue Intensive, January 2026, in conversation with founder Mark Bradley", "transcript": "One of the biggest blind spots of founders is they think that because it's clear to them, it's clear to everybody. You have staff on the front lines who are disconnected from corporate. Do they know why they go to work every day? Or is it just to like do the job, get a paycheck? Just remind people, little reminders of why we do what we do. I have the color orange. It's not there for fashion, it's there for me. It's a reminder that my job every single day is to do everything I can to inspire people to do what inspires them. It's the color of optimism. It's why I have it. I have little flashes of orange everywhere. I had my ring with the inside is orange. It's not there for you, it's there for me. Right? It's there as a reminder. My team knows why I have orange and we put little splashes of orange on everything as a reminder. The point is whatever your cause is, whatever it is that the culture you're trying to build, put it everywhere so everybody can see it. And when your clients see that, guess what it makes them? It makes them feel pride that they hired a company that even believes that.", "brk": "Hook类型: 痛点直击\n结构: 戳中盲点 → 举例说明 → 升华价值\n为什么火: 用具象化的小物件把抽象的使命落地，引发强烈共鸣。\n改编角度: 戳中本地小老板常陷入“只给薪水不谈愿景”导致员工和自己都心累、月月辛苦却存不到钱的盲点。", "my": "为什么每个月出粮的时候，你都感觉钱不够用？\n很多人以为是自己赚不够多。\n其实是因为你的钱，根本没有一个明确的归属。\n你把钱放在同一个户口里面。\n要用的时候就拿，要花的时候就刷。\n结果就是，日常开销和储蓄混在一起。\n最后连自己每个月真正存到多少钱都不知道。\n真正的理财安全感，不是户口里看到那一串数字。\n而是你的每一块钱，都有它明确要去的地方。\n哪些是供房供车的 commitment。\n哪些是紧急时候用的 cashflow。\n哪些是真正帮你在滚的资产。\n当你的资金有了清楚的方向。\n你才不会每次看到账单就心慌。\n你觉得呢？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 16903, "comments": 169, "er": 0.33, "followers": 5226621, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeR5GUWjsvN/", "video": true, "ratio": 0, "score": 0.33, "status": "未处理", "x": 0.7}, {"id": "DeeqeVxlGMh", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 16194, "comments": 145, "er": 0.31, "followers": 5226621, "date": "2026-10-14", "url": "https://www.instagram.com/p/DeeqeVxlGMh/", "video": false, "ratio": 0, "score": 0.32, "status": "未处理", "x": 0.7}, {"id": "DfVKVymiJIb", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 16342, "comments": 136, "er": 0.32, "followers": 5226621, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVKVymiJIb/", "video": false, "ratio": 0, "score": 0.32, "status": "未处理", "x": 0.7}, {"id": e job you used to do, we don't teach them that skill set. So you get a good journalist because somebody learned journalism. So to be a good leader, you have to learn leadership. Every single great leader I've ever met does not think of themselves as an expert leader. They all think of themselves as students. They all think they have something more to learn. They talk about it. They watch talks about it like this. They read books. They read magazines. They go out with their friends. I go out with them when we talk about leadership. It's an obsession. Like anybody who's good at anything is obsessed with learning that thing. If you want to get really good at making ceramics, you have to obsess about practicing and practicing and learning. Leadership is the same. And so I guess the final take away is be the leader you wish you had.", "brk": "Hook类型: 身份共鸣\n结构: 指出管理盲区 → 剖析高手心态 → 给出行动建议\n为什么火: 用职场领导力的底层逻辑引发共鸣，击中管理者痛点。\n改编角度: 针对35岁本地小生意老板，揭秘不懂财务管理如何导致员工拼命却依然亏损。", "my": "很多人觉得，做理财最重要的是看最后滚出多少钱。\n\n但其实，数字只是结果。\n\n作为一个每天在看别人财务问题的人，我发现真正重要的不是盯着那个 balance。\n\n而是陪着那个正在为钱焦虑的人。\n\n很多打工族和小生意老板，天天被月光和 cashflow 压着，最需要的从来不是冷冰冰的数字。\n\n而是看懂自己的金钱逻辑。\n\n当一个人的 commitment 太重，手头现金越来越少的时候，压力是会直接影响生活和工作的。\n\n我们真正要对负责的，不是那个冷冰冰的户口余额。\n\n而是那个每天在为生活拼搏、在做金钱决定的人。\n\n你身边有没有这样的人？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 14882, "comments": 146, "er": 0.29, "followers": 5226621, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfH94Msj3XE/", "video": true, "ratio": 0, "score": 0.29, "status": "未处理", "x": 0.7}, {"id": "Dewzg3MEfbr", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Most people think wasting money means buying coffee. But the biggest money drains don’t feel like waste at all. They look completely normal.\n\nBuying a car based on the monthly payment. Paying for subscriptions you forgot you signed up for. Calling luxuries “investments.” Chasing complicated financial products that promise to beat simple investing.\n\nNone of these feel like mistakes in the moment, which is exactly why they can quietly cost you far more than any latte.\n\nReal financial progress comes from getting the big decisions right, not from feeling guilty about the small ones. And the first step is seeing where your money is actually going.\n\nComment AUDIT and I’ll send you my Spending Audit Guide so you can find the drains hiding in your own spending.", "transcript": "", "brk": "Hook类型: 反常识\n结构: 纠正误区 → 列举隐形大漏 → 总结核心逻辑 → 引导留言索取\n为什么火: 打碎“拿铁因子”常识，直击毫无感知却让人悄悄破产的日常大额开销。\n改编角度: 针对月光族打工仔和小生意老板，揭露买车、供会、盲目交应酬钱等看似正常却掏空大马人钱包的隐形大坑。", "my": "很多人以为存不到钱是因为每天喝咖啡。\n\n但真正把你的 cashflow 吃掉的开销，通常看起来完全没有问题。\n\n第一，买车只看 monthly payment。\n\n觉得每月供得起就直接签，完全没算过 insurance、maintenance 和贬值的速度。\n\n第二，各种忘记 cancel 的 subscription。\n\n每个月自动扣几十块，累积起来其实是一个吓人的 commitment。\n\n第三，把奢侈品当成投资。\n\n为了面子买了一堆东西，最后发现转手根本不值钱。\n\n这些钱花出去的时候，你完全不会觉得心疼。\n\n这才是为什么它们静静地拿走你最多钱的原因。\n\n真正的 financial progress 是顾好大条的 commitment，而不是每天为了一杯咖啡内疚。\n\n第一步，先看看你的钱到底流去哪里。\n\n你平时最容易忽略的开销是什么？\n\n留言讲讲你的想法。", "tags": "", "bait": true, "type": "Carousel", "likes": 2072, "comments": 119, "er": 0.22, "followers": 987134, "date": "2026-10-21", "url": "https://www.instagram.com/p/Dewzg3MEfbr/", "video": false, "ratio": 0, "score": 0.25, "status": "未处理", "x": 1.5}, {"id": "DfpOJx8By2d", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "We love to make things look effortless. The friend who “just eats healthy.” The couple who “just happens” to be great with money.\n\nBut there are real behaviors behind it, and you learn them by talking to people who already do them.\n\nOn Mon, Nov 16, I’m going live to show you exactly what people who are good with money do differently. It’s night 1 of three free live nights.\n\nMon, Nov 16: Am I good with money?\nWed, Nov 18: Can I afford it?\nThu, Nov 19: When can I stop working?\n\nAll three start at 8pm ET / 5pm PT.\n\nComment RSVP and I’ll send you the link to save your free spot, or go to iwt.com/ramitlive", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 揭露假象 → 给出真相 → <script>

const byRec = {}; DATA.forEach(d => byRec[d.id] = d);

  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: '真爆款 ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: '近7天', f: d => d.days !== null && d.days <= 7 },

];
const presetOn = {};

  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');

  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };

    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 Instagram 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
