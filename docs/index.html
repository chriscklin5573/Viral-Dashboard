<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FINANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>FINANCE<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

, all right, the first thing is, is we have to be in agreement about who we're going to be as a couple and how we're going to handle discussions about things that matter in our lives. And that isn't you go over and have these discussions with your dad and then you come back and tell me what I'm going to do. That's not going to work. I'm not going to do that. The first thing that bothers me more than anything else is these side discussions that don't involve you. So what's going to end up happening is if we don't get back on the same page, you're going to be the evil person that kept her from getting a home while her daddy tried to help her. So the best advice we ever got as parents of grown children is that when you walk her down the aisle, you're done. You got to step back because you have been the man in her life, her whole life. And you've got to step back or her husband can never take the position of being the primary man in her life. That's quite the opposite of I'm going to stay involved and I'm going to coach my daughter without my son-in-law's involvement on how I want to end up owning the house that they live in.", "brk": "Hook类型: 痛点直击\n结构: 抛出长辈附带条件的巨额赠予 → 专家犀利指出婚姻边界问题 → 给出拒绝赠予与重塑夫妻关系的具体话术\n为什么火: 精准踩中华人家庭常见的“长辈资助买房却干涉婚姻”这一强冲突痛点，引发强烈共鸣与讨论。\n改编角度: 针对华人买房常遇“父母出首付要加名字”的现象，从保护夫妻独立财务主权切入进行本地化改编。", "my": "父母帮你出首付买房，条件是屋契要写他的名字。\n\n先说明一下哈，我不是叫你不要拿家里的钱。\n\n但你要想清楚，这笔钱拿了之后，你的婚姻和财务自主权到底还在不在你手上。\n\n很多人结了婚，买第一间屋子时，长辈突然拿出一大笔钱说要帮忙。\n\n听起来是好意，但转头却跟你讲，屋契要放他们的名字，或者每个月的installment要怎么还，甚至连家里的大小事都要插手管。\n\n表面上是帮你减轻负担，实际上是用钱来买你生活的控制权。\n\n结果是什么？\n\n你另一半变成夹心饼干，一边是爸妈的期待，一边是你们两夫妻的共识。\n\n最后吵到最后，屋子还没买成，感情先破裂。\n\n如果今天你遇到这种状况，最重要的一点是，你们夫妻两人的立场一定要一致。\n\n钱是小事，但如果为了拿这笔钱，牺牲了你们在家里做决定的权利，那这个代价太大了。\n\n婚姻是你们两个人的事，不是两家人合伙开公司。\n\n你觉得如果换作是你，你会接受长辈这种带条件的资助吗？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 6023, "comments": 106, "er": 1.51, "followers": 407114, "date": "2026-10-01", "url": "https://www.instagram.com/p/Dd9qzZojUqx/", "video": true, "ratio": 0, "score": 1.56, "status": " ng to be able to come because we don't want to sit here in that. And you know what? They went, thank God, somebody said it out loud. We always were thinking the same thing. They weren't even broke and they were just glad to draw names. I personally don't think you're cheap. I think forced generosity where I'm giving you something and I'm expecting something in return. That is not the spirit of giving to begin with. So if you've had that conversation and they are resentful of you, then you can't carry that.", "brk": "Hook类型: 痛点直击+身份共鸣\n结构: 抛出送礼矛盾 → 分享个人破产经历 → 给出解决方案 → 专家观点背书\n为什么火: 戳中华人过年人情消费压力大不敢说出口的痛点，引发强烈共鸣\n改编角度: 针对华人过节送礼或随礼压力，主打“勇敢拒绝无效社交和面子消费”", "my": "华人过年送礼和包红包，是不是让你压力很大？\n\n每年一到这个时候，家里亲戚朋友聚在一起。\n\n表面上热热闹闹，实际上大家都在比较今年送什么牌子的礼盒。\n\n红包要包多少才够大方，才不会被人在背后讲。\n\n为了这些面子消费，很多人出粮没多久，手头上的 cashflow 就直接见底。\n\n其实好几次我都想开口讲，大家可不可以不要送来送去。\n\n但又怕别人觉得自己小气，或者不够得体。\n\n这种被迫的慷慨，根本不是真正的情谊。\n\n如果你的财务状况已经在吃紧，真的不用为了别人的期待去打肿脸充胖子。\n\n真正关心你的人，看重的是你这个人，而不是你送的礼物有多贵。\n\n今年过年，试着把这些无效的人情负担放下。\n\n你身边有没有人也是这样，为了过年送礼压力很大？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 4333, "comments": 98, "er": 1.09, "followers": 407114, "date": "2026-11-16", "url": "https://www.instagram.com/p/Df0VstwEmQf/", "video": true, "ratio": 0, "score": 1.14, "status": "未处理", "x": 1.6}, {"id": "Ddoy-5zjIi0", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "I feel guilty cutting off my ex.", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 3513, "comments": 270, "er": 0.93, "followers": 407114, "date": "2026-09-23", "url": "https://www.instagram.com/p/Ddoy-5zjIi0/", "video": true, "ratio": 0, "score": 1.06, "status": "未处理", "x": 1.5}, {"id": "DfCpuf4l7Uj", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Even better, if you have dry beans and rice, you scoop it into their bags! Think smarter not harder people.", "transcript": "Love's talking to the moon", "brk": "Hook类型: 幽默反讽\n结构: 荒谬省钱建议 → 制造反差感 → 引发评论互动\n为什么火: 用极度夸张的极端省钱梗调侃 为他们是一个很积虑我说那个领域他肯定会支持你", "brk": "Hook类型: 身份共鸣\n结构: 抛出观点 → 运动类比 → 对比反差 → 总结升华\n为什么火: 颠覆大众对成功者冷漠的偏见，提供情绪价值。\n改编角度: 谈谈为什么真正懂理财的富人从不嘲笑穷人，反而更愿意分享经验。", "my": "真正懂理财的人，其实从不嘲笑月光族。\n你有没有发现一个现象。\n那些每个月被卡债压得喘不过气的人。\n反而最喜欢在旁边泼冷水。\n你偶尔看到一篇文章讲budget。\n你想开始存钱。\n身边那些跟你一样穷忙的朋友。\n往往第一个跳出来讲。\n存什么存啦。\n明天的事都不知道。\n人生及时行乐最好。\n他们为什么这样讲。\n因为他们自己没有开始。\n所以看到你要改变。\n他们心里不舒服。\n反而是那些真正把cashflow管得很好的人。\n他们爬过坑。\n他们懂每个月为钱焦虑的感觉是什么。\n他们看到你踏出第一步。\n绝对不会笑你。\n只会给你真的看钱的观点。\n支持你把commitment理清楚。\n你觉得呢。\n留言讲讲你的想法。", "tags": "jackyhooi, 成功的人, 愿意帮助人", "bait": false, "type": "Video", "likes": 331, "comments": 3, "er": 0.84, "followers": 39669, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfetW2eiqhC/", "video": true, "ratio": 0, "score": 0.86, "status": "未处理", "x": 2.0}, {"id": "De4WaqQI5WK", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I asked people in Nashville how much debt they have.", "transcript": "Tell me ma'am, how much debt do you have? Zero. I have no debt. What about a mortgage? No mortgage. When did you become debt-free? November 2023. Congratulations! Thank you! What got you on this journey? To get out of debt and stay out of debt? Following Dave Ramsey. So how much debt did you have? Including the mortgage, I started with $450,000. How long was the total journey? About 11 years. So you cleaned up almost half a million bucks in 11 years? When you say it like that, I feel pretty good. You should! What would you tell all these other people that are in crippling debt out here? Live on lesson you make. Follow a budget. Make it. Follow it. And be consistent and stick with it. Learn to say no to yourself and to others who are asking you to do things that are not in the plan. So much wisdom and so much joy. This is what debt freedom can be for you.", "brk": "Hook类型: 街头采访/数字承诺\n结构: 街头提问无负债者 → 揭晓45万巨债清零过程 → 给出具体省钱方法论\n为什么火: 巨额负债11年清零的巨大反差与真实案例，精准激发普通人的希望与共鸣\n改编角度: 采访华人素人如何用3年存下首付或提前还清房贷，输出可复制的理财心法", "my": "街头随便问一个 35 岁的打工族，\n你现在还有多少债务？\n很多人都会苦笑，\n房贷、车贷、卡债加起来，\n根本不敢去算那个总数。\n我前几天遇到一个本地打工族，\n她花了几年时间，\n把身上的 commitment 整个清理掉。\n很多人以为这种人一定是收入很高，\n其实关键根本不是赚多少，\n而是看你的 cashflow 怎么跑。\n她做对了一件事，\n就是严格执行一个 budget。\n每个月的出粮，\n先扣掉固定的 commitment 和储蓄，\n剩下的才拿来应付日常开销。\n遇到朋友约吃大餐或者买奢侈品，\n学会对别人说不，\n也对自己说不。\n表面看起来好像压抑了当下的快乐，\n但手头上的 cashflow 稳了之后，\n那种不用担心 due date 的安全感，\n才是真正拿回生活的主导权。\n你觉得一个月要存多少钱才算有安全感？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3442, "comments": 66, "er": 0.82, "followers": 428642, "date": "2026-10-24", "url": "https://www.instagram.com/p/De4WaqQI5WK/", "video": true, "ratio": 0, "score": 0.85, "status": "未处理", "x": 1.2}, {"id": "DfhR_TED4SV", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "做老板的代价，就是失去自由。\n\n当初为什么想创业？\n我相信很多人跟我一样。\n\n其中一个最想要的东西，就是自由。\n\n可以安排自己的时间，\n不需要一直听别人的安排，\n想做什么就做什么。\n\n可是真正创业以后，\n你会发现事情好像完全不是这样。\n\n顾客遇到问题，找老板。\n员工遇到问题，找老板。\n\nSupplier找老板，\n银行找老板，\nTax也找老板。\n\n然后我想问一个问题：\n\n到底谁才是老板？\n明明公司是自己的，\n为什么好像所有人都可以安排我的时间？\n\n而且，做老板还有很多开销需要负责。\n\n员工薪水、花红、员工旅行、\n供应商货款、银行贷款和利息、\n税务、办公室租金，还有各种维修费用。\n\n你辛辛苦苦赚回来的钱，\n好像还没来得及享受，\n就已经有很多地方等着你支付。\n\n我接触过很多做生意的人。\n\n有些人经营了十年生意看起来不错，\n但真正留在自己手上的钱，\n却没有想象中那么多。\n\n因为赚到的钱，\n不代表最后能够留下来。\n\n更重要的是，他们投入了十年的时间，\n每天处理公司里面大大小小的问题，\n却没有真正换来自己想要的自由。\n\n所以，我觉得每个老板都应该问自己一个问题：\n\n「我辛辛苦苦做了十年生意，到底是为了谁而赚钱？」\n\n当然，做生意本来就有责任和成本。\n\n但如果一家公司永远都需要，\n老板亲自处理每一件事。\n\n那老板可能不是在经营一家公司，\n而是在为公司打工。\n\n真正值得追求的，不只是把生意做大。\n而是建立一个能够持续运作的生意。\n\n让团队可以承担责任，\n让系统可以解决问题，\n同时也让自己有时间、有利润、有选择。\n\n创业的目的，不应该只是拥有一家公司，\n而是通过这家公司，换来自己真正想要的生活。\n\n#jackyhooi #老板不好当 #失去自由 #创业真相", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 追求自由(A) → 琐事缠身(B) → 财务拷问(C)\n为什么火: 精准戳中中小企业主“创业十年却沦为高级打工仔”的痛点与无奈。\n改编角度: 结合老板的现金流困境，切入如何通过商业贷款或税务规划把利润真正留在手里。", "my": "做生意十年，到底谁才是真正的老板？\n\n当初想开公司，很多人追求的其实不是发大财。\n\n而是自由。\n\n不用看人脸色，时间自己安排。\n\n但真正走这条路以后，才发现现实完全相反。\n\n客户找你，员工找你。\n\nSupplier找你，银行也找你。\n\n每天睁开眼睛，一堆 commitment 在等着。\n\n员工薪水、货款、office 租金、bank 的 installment，还有各种 tax。\n\n辛辛苦苦做生意，账面上的 profit 看起来美美的。\n\n但真正留在手上的 cashflow，却少得可怜。\n\n我见过很多小生意老板，生意做了很久。\n\n但赚来的钱，转头就付给各方各面。\n\n最后发现，自己不过是给自己打了一份工。\n\n每天被 cashflow 卡得死死的。\n\n其实，赚到的钱不等于留得住的钱。\n\n如果你的生意一直离不开你的亲力亲为。\n\n那问题可能不是不够努力，而是你的 financial structure 出了状况。\n\n你辛辛苦苦拼了这么久，到底是为了赚钱，还是为了养一间公司？\n\n你现在的生意，有真正换来你想要的自由吗？\n\n留言讲讲你的想法。", "tags": "jackyhooi, 老板不好当, 失去自由, 创业真相", "bait": false, "type": "Carousel", "likes": 324, "comments": 1, "er": 0.82, "followers": 39669, "date": "2026-11-09", "url": "https://www.instagram.com/p/DfhR_TED4SV/", "video": false, "ratio": 0, "score": 0.82, "status": "未处理", "x": 2.0}, {"id": "DeMhoKflqL7", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 40869, "comments": 233, "er": 0.79, "followers": 5226621, "date": "2026-10-07", "url": "https://www.instagram.com/p/DeMhoKflqL7/", "video": false, "ratio": 0, "score": 0.8, "status": "未处理", "x": 1.8}, {"id": "DecWXH6AbQQ", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Can I Use Child Support To Pay Off My Debt?", "transcript": "I am a single mom of three, ages 13, 11 and 8. I have my children 100% of the time and their dad passed away last year. So I started receiving death funds for them from their dad's social security. And so I changed jobs and careers last year as well. So I doubled my income, making around 40, $45,000 a year to bringing home close to $90,000 a year. I received close to $4,000 a month in security benefits for them. And I don't know exactly what I should do with this money if it's... It should be in your budget. It costs more than four grand a month to raise three kids. So it's your money to use for your children and you're a good mom and you're going to use it for your kids. And it's not of the good of the children's future. It's the good of the children. And so as long as you are spending the equivalent of your child support or the equivalent of your social security payments from your ex-husband's death on your children, then you are morally and ethically just fine. And I would just put the $4,000 in your budget.", "brk": "Hook类型: 痛点直击\n结构: 单亲妈妈求助 → 专家肯定心理压力 → 给出财务合规建议\n为什么火: 解决单亲家庭抚恤金使用的道德焦虑，触动情感共鸣\n改编角度: 针对华人单亲家庭，探讨如何合理规划政府福利与负债偿还", "my": "独自带三个孩子的单亲妈妈，每个月要面对的压力真的很大。\n尤其是另一半离开之后，\n家里少了一个支柱，\n还要一个人撑起整个家庭的 cashflow。\n如果这时候拿到政府的援助金，\n或者孩子的抚恤金，\n心里往往会有很多罪恶感。\n总觉得这笔钱应该全部存起来，\n一分钱都不能动。\n其实你是在养育孩子，\n这也是日常生活的一部分。\n如果你把这笔钱放进你的 budget 里面，\n用来应付家里每个月的开销，\n完全不需要有道德上的压力。\n养三个孩子的生活费本来就不便宜，\n衣食住行样样都需要 commitment。\n只要这笔钱确实是用在孩子身上，\n用在整个家庭的日常开销，\n你在道德上就没有任何问题。\n你是一个很负责任的妈妈，\n不需要为了照顾家庭而过度自责。\n把这笔钱算进你的 budget，\n踏踏实实地安排好每个月的现金流，\n日子才能安稳地过下去。\n你身边有没有单亲的朋友，\n为了钱的事情背负着很大的心理压力？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3023, "comments": 67, "er": 0.76, "followers": 407114, "date": "2026-10-13", "url": "https://www.instagram.com/p/DecWXH6AbQQ/", "video": true, "ratio": 0, "score": 0.79, "status": "未处理", "x": 1.1}, {"id": "DeuCb6vmwyK", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Let's breakdown the difference between some of the different investment accounts.", "transcript": "Put your money into a high-yield savings account for any short-term savings goals that are going to happen in the next three to five years. Think emergency funds, a car fund to pay cash, or even a down payment fund. Put your money into a Roth IRA if you have earned income and you want to pay taxes now, but then never again. Tax-free growth into retirement. Put your money in a 401K if you have an employer retirement plan with a match. That is free money. Take it every time. And put your money into a brokerage account if you want to invest outside of retirement and not have to wait till 59 and a half to access that money. That could be a great bridge account or investing for the long term for anything else.", "brk": "Hook类型: 痛点直击\n结构: 明确目标分类 → 对比账户优势 → 给出行动建议\n为什么火: 用极简逻辑拆解复杂金融账户，给观众即时决策指导\n改编角度: 结合华人海外资产配置，对比中美退休账户与储蓄卡玩法", "my": "很多人手上有了一点 savings，却不知道钱到底应该放哪里。\n买股票又怕亏，存在普通 bank 帐号又觉得利息少得可怜。\n其实钱要分不同用途，放对地方。\n先看短期的 emergency funds 或者是过几年要用的 car fund。\n这些需要随时拿得到的 cashflow，就要放在有储蓄利息的户口里面，不能锁死。\n如果你是要做长远的 retirement 规划。\n很多人问我 EPF 跟自己外面投资要怎么分配。\n先说明一下哈，公司有 offer 帮你 top up 的那种，那个便宜一定要拿。\n因为那是公司给你的福利，不用白不用。\n但如果你想在退休前有更多弹性，不想等年纪到了才能拿出来。\n你就要开一个 brokerage account。\n这个户口里面的钱，是用来帮你做长远投资，当成一个 bridging 的资金。\n记住，不同的钱去到不同的地方。\n你目前的 commitment 都是怎么分配的？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3196, "comments": 52, "er": 0.76, "followers": 428642, "date": "2026-10-20", "url": "https://www.instagram.com/p/DeuCb6vmwyK/", "video": true, "ratio": 0, "score": 0.78, "status": "未处理", "x": 1.1}, {"id": "DeCTf7ZicgZ", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Elena called into The Ramsey Show becuase her father-in-law set up a trust for their son, and they have no clue how much money is in it.", "transcript": "My father-in-law established a trust for a son when he was young, and we know very little about it, except that it's for his college education. My father-in-law is very private with his money, and he hasn't given us any details on it. My son is in 11th grade now, and he does not know about the trust, and we don't know when we should tell him about it, and also we don't know what or we should know about the trust at this point. Why did he set it up in the first place? Did he talk to you and say, hey, I'm going to set this up for college, and this was back when he was a baby? Yeah, he was two years old. He just basically told us that's what he was going to do, and we know that he did set it up, and that's all we know. So no clue how much is in it, what's even in there. Is it cash? Is it investments? We have no idea. Exactly. And if you talk to him and just said, hey, Dad, he's a junior now. We're looking at colleges. We want to make a game plan to make sure that he goes debt-free. Can you let us know what's in the trust and how we access it? He would say none of your business. I don't know if he would say that. I think it would be a very awkward conversation just because he's so private. He doesn't like to share. But he made the trust for your son. The part that worries me is that you're scared to even ask him about this. Just say, hey, we're starting to look at colleges. We know you set up a trust for his education. Can you get us a copy of the trust document? Can you tell us who the trustee is? Can you tell us if there's distribution triggers, anything we need to know as we make plans? Because if there's $10 in it, well, we got to make a plan for ourselves. And if there's a million dollars in it, that changes the type of schools we look at.", "brk": "Hook类型: 痛点直击\n结构: 描述长辈神秘信托 → 分析沟通顾虑 → 给出直接询问的话术建议\n为什么火: 戳中华人家庭常见的代际财务沟通尴尬与教育金焦虑\n改编角度: 针对华人父母，教粉丝如何跟长辈开口了解给孙辈留的教育基金或资产", "my": "有些长辈很喜欢私底下帮孙子准备教育金，但从来不讲里面到底有多少钱。\n\n特别是家里老人家对钱管得很严，每次想到要开口问，就会觉得很尴尬，怕老人家觉得我们在打主意。\n\n但问题是，孩子已经快要上大学了，我们做父母的需要提早做 budget，看看到底要准备多少 commitment。\n\n如果里面只有一点点钱，我们需要自己想办法；如果里面有一大笔钱，那选学校的方向就会完全不一样。\n\n其实这通电话并不需要搞到很复杂。\n\n你可以直接去找老人家聊，就说孩子快要念大学了，想帮他做一个 game plan。\n\n直接问老人家当年设立的那个教育基金，现在的状况大概是怎样，或者是里面有哪些细节需要我们配合的。\n\n这不是在逼问，而是在为了孩子的未来做准备。\n\n你家里也有这种不说清楚的长辈吗？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2633, "comments": 222, "er": 0.67, "followers": 428642, "date": "2026-10-03", "url": "https://www.instagram.com/p/DeCTf7ZicgZ/", "video": true, "ratio": 0, "score": 0.77, "status": "未处理", "x": 1.1}, {"id": "DfFjHNokhd2", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"My kid is making me pay her loan\"", "transcript": "She's never showing up for Thanksgiving ever again. You won't have a relationship with your grandkids. When my husband and I cosigned our daughter's student loans, she promised us she would make the payments. The loan is due now and she refuses to pay anything on it. We recently started saving for retirement, which will be in 10 years. We've already paid 60 grand on her loans and the balance is 75 grand. We know that we should never have signed for her, but they would not allow her to sign because she had no payment history. What can my husband and I do? We've always had a wonderful relationship, but this has caused a huge wedge between us. Oh, this is brutal. And it's the number one reason I hate parent plus loans is because of the relationship killer. It's not even the financial aspect. I love my daughter too much for this to cause a wedge. Chances of her paying slim to none at this point. And if she does, she's gonna resent you forever. So this is sort of a $75,000 remaining stupid tax. It might mean you retire in 10.5 or 11 years instead of 10. And that's a hard pill to swallow, but that's what I would personally do as a parent if I was in the situation. And that's why I'm gonna take a hard stance and this is a hot take, but this is the parent's fault. Even though she's not doing something, you had a deal with a 17 year old about thousands and thousands of dollars. I find that to be a parenting issue more so than it is the 17 year old's issue who is now probably in her 20s. But it's up to them. Here's the two paths. They can pursue her and go, no, you said you would. It's only gonna hurt things. And she's never showing up for Thanksgiving ever again. You won't have a relationship with your grandkids. Is that worth $75,000 more to you? That's really what's on the line here. And for me and my house, my daughter's three. I cannot imagine losing that relationship over a mistake that I made. Yeah, you gotta preserve the relationship. But you guys will be okay. You will live to tell the tale. I hope so. Hopefully it's a warning sign for any other parent who's in that situation.", "brk": "Hook类型: 痛点直击与家庭矛盾\n结构: 倾诉困境 → 专家犀利剖析 → 给出艰难抉择与最终建议\n为什么火: 深度揭露父母为子女担保贷款引发的家庭情感危机，极具共鸣与争议。\n改编角度: 聚焦华人家庭的房贷或教育金担保，探讨金钱如何伤害亲情及如何止损。", "my": "现在帮孩子做担保供车或者供屋，最后自己扛下所有 commitment，真的分分钟搞到家里关系破裂。\n\n我经常看到有父母心疼孩子，为了帮他们过关，用自己的名义去签字做担保。\n\n结果孩子那边因为各种原因还不上，最后丢给父母来啃。\n\n这不只是钱的问题，更是亲情上的一个大炸弹。\n\n很多父母在这个时候陷入两难。\n\n去追着孩子讨回这笔钱，天天为了 installment 吵架，最后可能连过年回家吃饭都成问题，甚至连孙子都很难见一面。\n\n不追的话，自己辛辛苦苦存下来的 retirement 资金就这样被卡死，甚至要延迟退休的计划。\n\n面对这种情况，真的很痛，但你要去衡量到底什么才是最重要的。\n\n如果钱已经拿不回来，继续因为这个去毁掉跟孩子的关系，其实是拿亲情来买单。\n\n你可能会觉得很不甘心，但有时候为了长远的安宁，你必须接受现实，把这笔钱当成一次昂贵的教训。\n\n最重要的是保护好你自己的 cashflow 和接下来的生活，不要让一个错的决定，继续拖垮你整个晚年的 budget。\n\n你身边有没有看过类似为了帮家人担保而搞到焦头烂额的故事？\n\n你觉得面对这种情况，到底应该斩断金钱关系，还是继续硬扛下去？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2563, "comments": 194, "er": 0.68, "followers": 407114, "date": "2026-10-29", "url": "https://www.instagram.com/p/DfFjHNokhd2/", "video": true, "ratio": 0, "score": 0.77, "status": "未处理", "x": 1.1}, {"id": "DfdeXmUzQr9", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Door to door experience will be the main difference…”\n.\nThe main experience of living in a landed home will be parking the car at the car porch and immediately getting into the house. Although we have some high rise apartments trying hard to mimic that experience but it’s just different. \n.\nThen for the other elements such as views, security, facilities, size… all are pretty much similar since we have stratafied landed homes already. But I do think it’s not really whether we prefer one over another but it depends highly on the stage of life we are in. \n.\nIf we are starting off after graduation, it’s ideal to be as close to actions and opportunities as possible. But if we start having control over our schedule, we can start moving away from the city and prioritise our family… and we of course, our financial capabilities will be a BIG factor too😅 \n.\nI can have ultra privacy and still be in the city… If I can afford Bukit Tunku or bungalows in Mont’Kiara it wouldn’t be an issue mah😂😂😂\n#p", "transcript": "", "brk": "", "my": "", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1145, "comments": 13, "er": 0.72, "followers": 160588, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfdeXmUzQr9/", "video": true, "ratio": 0, "score": 0.74, "status": "未处理", "x": 1.0}, {"id": "De0Z654zqpz", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Out of so many location, they pick Malacca??!”\n.\nFrom a property value appreciation point of view, that state is one of the last in Malaysia. Surprisingly Perlis is doing way better at about 7.1 % yoy increase. On top of that, there has been too many abandoned seafront project that really affected the confidence of investors there. \n.\nBut not everyone choose to understand everything in detail before they buy. Mainly I think it’s because our property prices are too dirt cheap compared to theirs. Even if it’s a mistake or the wrong project, it’s not gonna hurt their finances at all. \n.\nBut in other main cities such as KL, Penang and JB, the amount of foreigners buying properties are significantly picking up. Mainly it’s because of our private education system, low living expenses, and freehold land. Malaysia is one of the rare countries that allow foreign ownership on freehold land😱\n#property #investment #realestate", "transcript": "", "brk": "", "my": "", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1085, "comments": 33, "er": 0.7, "followers": 160588, "date": "2026-10-23", "url": "https://www.instagram.com/p/De0Z654zqpz/", "video": true, "ratio": 0, "score": 0.74, "status": "未处理", "x": 1.0}, {"id": "DekExOqmnY9", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "I Stole From My Employer And Got Arrested.", "transcript": "I am about $70,000 in debt and I just don't know how to get out of it. What kind of debt is it? Credit card debt and medical debt. How much is credit card? AMEX is $4,300 and Capital One is $6,800 and then I owe on my car $25,000. How much do you make a year? How much do you make a year? I make about $2,200 a month. I lost my job in January of 2024. I stole from my employer. I was fired, I was arrested and everything's just gone downhill since then. I was making about $53,000. What are you doing now for work? I work for a grocery store. How many hours a week are you working? It's 40 hours. Okay. Were you convicted of a felony? It was dismissed. I have a license to Silver Hill estate but I'm a new agent. I can't make any money in it so that's why I'm still at the grocery store. What is your car worth? Probably worth $37,000 or $38,000. And you owe $25,000? I owe $25,000. How are you paying that bill with all this other stuff going on? I make it work. Yeah. That car needs to be sold. Yeah, sell that car. I work by a car for cash with a difference. For sure. The rest of your situation is all career oriented and so it's a matter of lining yourself up with some kind of a career whether it's real estate or whether it's something else. I don't care where your income goes up because you're worth twice what you're being paid in the marketplace. You have proven that in the past. You made a mistake, you paid for it, you went through all the hell associated with it. You lost your job. And now you get a restart. As a pastor friend of mine says you're not defined by the worst thing you ever did. Thank goodness none of us are. It's a part of my story. I have a scar. I have a mark. I feel some shame from it, but it's not who I am. You don't have to live in the prison of working for half of what you're worth in the marketplace because of a past mistake. So we're going to send you a copy of Finding the Work You're Wired to Do. It's got an assessment in it. I want you to take that. I want you to sit and do some time in prayer about what you're supposed to be 10 years from now and get the car sold.", "brk": "Hook类型: 痛点直击+丑闻自爆\n结构: 自白困境 → 盘点债务 → 专家诊断 → 给出解法\n为什么火: 戏剧性人生低谷结合严厉而充满同理心的财务指导\n改编角度: 聚焦华人背负车贷与卡债的窘境，强调卖车止损与重塑职业规划", "my": "现在很多打工族表面上驾着好车，其实每个月的薪水一出粮，转头就进了银行。\n\n车贷卡债加起来几万块，月薪两千多，还要应付各种生活开销。\n\n很多人遇到这种紧绷的现金流，第一反应是死撑。\n\n觉得只要换工跳槽，或者多兼职几份工，总有一天可以慢慢还清。\n\n但其实问题往往出在那个每天绑死你财务的大车贷上面。\n\n一辆价值高过你年收入的车子，每个月吃掉你大部分的 commitment。\n\n你以为你在养车，其实是车在榨干你的 cashflow。\n\n这时候你要做的是壮士断腕，把车子卖掉，换成一辆可以负担的代步工具。\n\n把多出来的差价拿来清掉一部分卡债，先把每个月的固定负担降下来。\n\n车子只是代步工具，不应该变成你生活里的财务黑洞。\n\n把现金流腾出来之后，你才有空间去理清接下来的职业规划，或者寻找更好的收入出路。\n\n理财从来不是靠死撑，而是懂得在关键时候及时止损。\n\n你目前最大的财务压力是什么，留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2868, "comments": 26, "er": 0.71, "followers": 407114, "date": "2026-10-16", "url": "https://www.instagram.com/p/DekExOqmnY9/", "video": true, "ratio": 0, "score": 0.72, "status": "未处理", "x": 1.0}, {"id": "De90ucnkkST", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"My husband wants me to cancel my life insurance policy on my ex\"", "transcript": "We have a situation, my husband and I need some guidance on. I was married before. I've been divorced for about eight years now. In my first marriage, I took out a life insurance policy on me and one on my ex-husband. After the divorce, I kept the life insurance policy on both me and him because he was paying child support. My new husband, he says it feels weird to pay life insurance on my ex-husband, but then on the other hand, I wanna make sure my kids are taken care of because we have a set of 14-year-old twin boys who are about to go into high school. We're staring down college. There's just so much going on at this stage in life. I wanna make sure something more to happen that they're taking care of. I can see two sides of it. Obviously the purpose of insurance is to replace income that's necessity. So before you were married, he was part of the income situation. And then even as an ex, maybe he was paying child support or alimony, that sort of thing. At this point, now you're married to somebody else. There's kind of a new situation going on financially. The only piece of this that I could see a connection to is the kids. If your ex-husband was saying, hey, this is kind of an inheritance thing. When something happens to me, I want the kids to have this money. That piece I can totally understand and them being the beneficiary of that makes sense to me if that's something that he wants to do from a legacy perspective. Well, the main distinction is you are not hanging onto this policy to hang onto the past. You're hanging onto it to protect your kids' futures. So until they are independent on their own, they're through college, they're working. Okay, now they're fine. But right now the truth is, you might not be able to afford college and support them. And so part of having kids is, it's your obligation to support them. I would keep it for that reason and it really has nothing to do with the new husband.", "brk": "Hook类型: 痛点直击\n结构: 矛盾背景导入 → 专家抛出核心逻辑 → 给出最终决断与理由\n为什么火: 精准切中重组家庭的利益纠葛与子女抚养痛点，引发强烈共鸣与争议\n改编角度: 结合华人重组家庭，探讨前夫抚养费与现任感受的资产配置方案", "my": "现在再婚家庭的财务问题，往往卡在一个很尴尬的位子。\n\n比如家里每个月的 commitment 已经排得很满了，但你身上还挂着前夫的保险。\n\n现任老公觉得怪怪的，可是孩子马上要上大学，需要一笔钱。\n\n很多马来西亚打工族重组家庭后，都会遇到这种两难的状况。\n\n一边是现在的感情感受，另一边是孩子的未来。\n\n其实这里面有一个很核心的逻辑。\n\n保险的本质是保障 income。\n\n如果前夫每个月有给赡养费或者抚养费，这笔钱对你们的 cashflow 其实是有影响的。\n\n但重点不是纠结这个做法好不好看。\n\n重点是这笔保障最后是不是落在孩子身上。\n\n如果目的是确保孩子将来的教育费和生活费有着落，这就不是在留恋过去。\n\n这只是在保护孩子的未来。\n\n在双胞胎还没大学毕业、还没真正独立之前，这个风险是要有人扛的。\n\n所以这个决定，其实跟现任的感受没有直接的关系。\n\n你是怎么看的，留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2505, "comments": 114, "er": 0.64, "followers": 407114, "date": "2026-10-26", "url": "https://www.instagram.com/p/De90ucnkkST/", "video": true, "ratio": 0, "score": 0.7, "status": "未处理", "x": 1.0}, {"id": "DfIIKuiADAd", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I'll be in the pantry looking for something until further notice.", "transcript": "You should take 4B and think before your people will escape or pee When the pimps in the crib, don't drop it like it's hot, drop it", "brk": "Hook类型: 幽默悬念\n结构: 搞笑场景引入 → 荒诞无厘头口播 → 戛然而止\n为什么火: 用玩梗和幽默反差制造了意料之外的喜剧效果\n改编角度: 结合华人房贷或理财痛点，用幽默段子引出财务规划的重要性", "my": "你每个月出粮时有没有发现一个现象。\n明明没有买什么奢侈的东西。\n但是 bank account 的数字还是静悄悄变少。\n每次查看 commitment 的时候。\n那个心情就像在公司茶水间躲老板一样。\n你以为是自己不够自律。\n其实是你的 budget 根本没有抓对重点。\n每个月的 installment 和开销。\n像无底洞一样把 cashflow 慢慢吃掉。\n你身边有没有这种每个月都在喊月光的朋友。\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2717, "comments": 93, "er": 0.66, "followers": 428642, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfIIKuiADAd/", "video": true, "ratio": 0, "score": 0.7, "status": "未处理", "x": 1.0}, {"id": "DeyVQ2mTpqL", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Wah… collect rent is tiring ya know?!”\n.\nHahahahahahahaha. I think this unker kena flex pun tak tau😬\n.\nBut imagine investing 20-30 years ago, cashing out today when we are older would actually be the actual strategy. The loans most likely would be settled. And just assuming each property is RM300k, there will be RM3 mil in cash!! \n.\nIn this extremely fast pace world, the idea of being wealth 20-30 years later is just ridiculous. But I think it’s still the most direct, the easiest method in my opinion. I’m not good with charts, trends, volume transition from alternative securities… As long as rent can cover installment, I invest😬\n.\n#property #investment #realestate", "transcript": "", "brk": "", "my": "", "tags": "property, investment, realestate", "bait": false, "type": "Image", "likes": 1015, "comments": 35, "er": 0.65, "followers": 160588, "date": "2026-10-22", "url": "https://www.instagram.com/p/DeyVQ2mTpqL/", "video": false, "ratio": 0, "score": 0.7, "status": "未处理", "x": 0.9}, {"id": "DfKbcxiDDJn", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "By far the spookiest thing you'll see today 🎃", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 2598, "comments": 117, "er": 0.63, "followers": 428642, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfKbcxiDDJn/", "video": false, "ratio": 0, "score": 0.69, "status": "未处理", "x": 1.0}, {"id": "Dee7LMciK0R", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Dave and George on The Ramsey Show talk about what insutries are keeping you broke.", "transcript": "If you find yourself with a low income and no money, the way out of the situation is not borrowing money to buy things. That will nail your feet to the floor and you will not be able to move. And that's why payday lenders, pawn shops, rent to own, and tote the note lots are in the poor end of town. They're not in the rich end of town because they oppress, they take advantage of people with low incomes who feel trapped and desperate. I have been broke, I've never been poor, poor as a state of mind. Poor as I'm trapped and there's no way out, so I'm forced to rent my washer and dryer at the rent all place. Or I'm going to borrow money at 800% interest at a payday lender because it feels like I'm trapped and I'm grabbing for anything that I can get a hold of to get out of this trap. And so you can be angry about it, but the way out is not to borrow your way off of the bottom rung of the income ladder. The way out is to cut your lifestyle to nothing and work like a maniac and get your income up. You do not have any time or margin for any kind of relaxation or luxury. All you need to do is work. My grandmother used to say there's a great place to go when you're broke, to work. And it's the only way off the bottom. You're not stuck, you live in the greatest country the world has ever known, and if you simply get up and go work six jobs, today you can make $20 an hour at Target and FedEx. You do not have to have a master's degree in finance to make a really good living today.", "brk": "Hook类型: 痛点直击\n结构: 揭露底层陷阱 → 剖析穷人思维 → 给出拼命工作解法\n为什么火: 犀利指出捕食穷人的金融陷阱，提供反直觉的极端奋斗解法引发共鸣\n改编角度: 结合华人海外打工痛点，批判高息贷款或买车套路，号召极端攒钱与副业", "my": "钱越赚越少，为什么身边总有些消费陷阱专盯着你？\n\n你看那些花俏的installment和easy payment，开在最旺的商场。\n\n他们不是在帮你的忙，而是在收割手头紧的人。\n\n当你觉得cashflow透不过气，开始靠借钱来周转时，这就变成了一个洞。\n\n很多人以为多挨几个月就撑过去了，结果每月还完min pay，利息像雪球越滚越大。\n\n这时候你需要的不是再开一张卡来补洞，而是马上检视你的budget。\n\n把每个月的commitment列出来，哪些是死钱，哪些能砍掉。\n\n手头紧的时候，没有那么多奢侈的空间让你去想享受。\n\n抓紧时间开源节流，把多余的精力放在提升收入上，这才是真正的解法。\n\n你觉得身边的消费陷阱多吗？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2645, "comments": 38, "er": 0.66, "followers": 407114, "date": "2026-10-14", "url": "https://www.instagram.com/p/Dee7LMciK0R/", "video": true, "ratio": 0, "score": 0.68, "status": "未处理", "x": 0.9}, {"id": "DfR1Pwujyib", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "有钱人和普通人，\n对钱的看法有一个很明显的差别，\n就是他们看待回报的时间长度。\n\n有钱人并不是对钱没有兴趣。\n相反，他们同样很在意钱。\n\n只是他们可能愿意用更长远的眼光，\n去思考赚钱这件事。\n\n有时候短期内，可以少赚一点甚至亏一点。\n\n但如果这个决定能够帮助他：\n建立品牌、扩大市场、培养团队、在未来赚到更多钱，\n他愿意考虑牺牲眼前的利益。\n\n因为他看的不只是今天能赚多少，\n而是这件事未来能够带来什么。\n\n可是对于经济压力比较大的人来说，\n情况可能完全不一样。\n\n他今天需要赚钱，这个星期需要赚钱，\n这个月需要收入，甚至今年就必须看到成果。\n\n因为生活开销不会等你，\n账单也不会因为你有一个很好的长期计划就暂停。\n\n有时候他不是不想看长远，\n而是现实不允许他等待那么久。\n\n这也是为什么同样一个赚钱机会，\n不同的人可能会做出完全不一样的决定。\n\n一个人可能会考虑三年后的回报，\n另一个人可能必须先考虑下个月的现金流。\n\n但我觉得，这两种思考都不是绝对错误的。\n\n短期收入可以让你维持生活，\n长期布局则有机会让你创造更大的价值。\n\n长期思考不代表所有短期亏损都是值得的。\n你还是需要评估风险，\n以及自己有没有能力承担。\n\n下次当你做一个赚钱的决定时，除了问自己：\n\n「这件事现在可以赚多少钱？」\n\n也可以多问一句：\n\n「如果我持续做这件事，三年、五年后，它又能为我带来什么？」\n\n因为有时候真正影响一个人赚钱方式的，\n不只是他想赚多少钱。\n\n而是他能够看多远，以及他有没有条件等待那个回报。\n\n#jackyhooi #有钱人 #普通人 #富人思维 #差别在哪里", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 现象对比 → 根源剖析 → 总结升华\n为什么火: 精准戳中普通人受限于生存压力无法做长期规划的现实痛点\n改编角度: 结合理财规划，对比穷人存死期与富人做长期资产配置的底层逻辑差异", "my": "有钱人和普通人看钱的眼光真的很不一样。\n\n有钱人做财务规划时，想的是三年五年后的回报。\n\n愿意为了未来的资产配置，牺牲眼前的部分现金流。\n\n但对于经济压力比较大的打工族来说，情况完全不同。\n\n你不是不想做长期投资。\n\n而是房贷车贷账单就在那边，生活开销不会等你。\n\n下个月的现金流，才是你每天睁开眼睛第一个要烦恼的事情。\n\n这也是为什么，很多人知道存死期或者买产品要看长远。\n\n但现实根本不允许你想那么远。\n\n因为穷人存死期，只能勉强抵挡通货膨胀。\n\n富人做长期资产配置，却能让钱生出更多的钱。\n\n这两种选择没有绝对的对错。\n\n短期收入让你维持生活，长期布局才能改变命运。\n\n但前提是，你需要先评估自己的风险承受能力。\n\n下次当你考虑怎么理财时，除了问自己这个月能多存多少钱。\n\n也可以多问一句，手头上的资金还能支撑多久的commitment。\n\n因为真正拉开财务差距的，不只是你想赚多少钱。\n\n而是你的cashflow，有没有条件让你看更远。\n\n你觉得呢，留言讲讲你的想法。", "tags": "jackyhooi, 有钱人, 普通人, 富人思维, 差别在哪里", "bait": false, "type": "Carousel", "likes": 270, "comments": 0, "er": 0.68, "followers": 39669, "date": "2026-11-03", "url": "https://www.instagram.com/p/DfR1Pwujyib/", "video": false, "ratio": 0, "score": 0.68, "status": "未处理", "x": 1.6}, {"id": "Dd1x5BpDV6M", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "\"You don't hire for skills, you hire for attitude. You can always teach skills.\" —Herb Kelleher \n\nVideo from SHRM26 (June 2026) in conversation with BambooHR CEO Bradley Rencher", "transcript": "", "brk": "Hook类型: 观点颠覆/反常识\n结构: 抛出名言反常识观点 → 行业大咖对话印证 → 给出底层管理逻辑\n为什么火: 反传统招聘认知，引发职场人和管理者强烈共鸣与讨论\n改编角度: 谈理财或赚钱时打破常规认知，如“穷人存技能，富人存资产”。", "my": "大家都觉得存钱要靠省吃俭用。\n其实这个想法，从一开始就错了。\n我看过太多马来西亚打工族。\n每个月薪水一到手，就拼命压低开销。\n咖啡不喝了，外卖不吃了，连朋友聚会都推掉。\n好像只要把消费压到最低，财务自由就会自动来找你。\n但这只是在跟自己的欲望打消耗战。\n真正拉开人与人距离的。\n从来不是你省下了多少钱。\n而是你懂不懂得建立你的资产。\n穷人把精力全部花在算计每一分钱。\n富人把注意力放在增加手上的 asset。\n当你每天都在为省下那十块钱焦虑时。\n你其实已经失去了看清金钱逻辑的精力。\n我们要存的不是死板的现金。\n而是能够自己生出 cashflow 的 commitment。\n手头上的 cashflow 变健康了。\n你才不会一遇到突发状况就手忙脚乱。\n表面看起来你每天都在记账。\n但如果手头上的现金越来越少。\n那只是在用勤奋掩盖财务上的盲点。\n你看身边那些真正把日子过得舒服的人。\n他们不一定赚得比你多多少。\n但他们懂得让钱去工作。\n你觉得呢。\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 33651, "comments": 314, "er": 0.65, "followers": 5226621, "date": "2026-09-28", "url": "https://www.instagram.com/p/Dd1x5BpDV6M/", "video": true, "ratio": 0, "score": 0.66, "status": "未处理", "x": 1.5}, {"id": "DfQtWwjzbhn", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“It’s okay to live life a little sometimes…”\n.\nThis was a very meaningful conversation with a young couple in Penang last week. Each of them owns a property but however I felt certain inferiority within. \n.\nAnyway the main question was about whether to buy more. If I were younger, I would tell them to go all out!! Work harder and invest more!! But after going through the process myself, I told them that it’s okay to just chill and live life a little more. \n.\nUltimately we invest in properties for cashflow, for capital appreciation, and it can also be a home. But it shouldn’t be an obsession for us to burn out our entire life just to own it. And that’s the irony within our community. People who are winning are feeling left out… \n.\nYou guys deserve a pat on the back👏🏼👏🏼👏🏼 \n#property #investment #realestate", "transcript": "", "brk": "", "my": "", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": hing I think that's kind of haunting you that you can just cut to the chase. I would, next time your mom's in town, I would take her out for coffee and say, mom are you officially asking to move in with us? Because right now there's a lot of ambiguity and you're starting to create stories about what she means and what she says and how she's saying it.", "brk": "Hook类型: 痛点直击\n结构: 倾诉困惑 → 剖析隐性成本 → 给出行动建议\n为什么火: 切中成年子女面对父母财务依赖与家庭边界的普遍焦虑。\n改编角度: 探讨要不要帮父母还清信用卡/债务，剖析财务救助背后的家庭关系代价。", "my": "现在，很多父母欠了一堆卡债，或者退休了没钱，开始有意无意暗示想靠你接济。\n\n你心里开始纠结。\n\n帮还是不帮？\n\n很多人觉得，父母养大我们不容易，帮他们还卡债是孝顺。\n\n但你有没有想过，这背后真正的代价是什么？\n\n钱的方面，可能只是每个月多出一笔 commitment。\n\n更深的问题是，如果父母的消费习惯没有改变，你今天帮他们 settle 了，明天他们可能继续刷卡。\n\n这就好像一个无底洞。\n\n你不仅是在帮他们还钱，你是在为他们的金钱观念买单。\n\n久而久之，你的 cashflow 会被拖垮，甚至影响到你自己的小家庭。\n\n所以，面对这种情况，最重要是诚实面对自己。\n\n不要用盲目的孝顺来掩盖事实。\n\n下一次，当家里人再提起钱的事，或者暗示你帮忙时。\n\n不要含糊其辞，直接坐下来跟他们聊清楚。\n\n了解他们目前的财务状况到底卡在哪里，而不是一味地给钱。\n\n你觉得呢？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 1906, "comments": 45, "er": 0.48, "followers": 407114, "date": "2026-11-11", "url": "https://www.instagram.com/p/DfnJA-0Ifvc/", "video": true, "ratio": 0, "score": 0.5, "status": "未处理", "x": 0.7}, {"id": "DewQK7wikqM", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 25050, "comments": 139, "er": 0.48, "followers": 5226621, "date": "2026-10-21", "url": "https://www.instagram.com/p/DewQK7wikqM/", "video": false, "ratio": 0, "score": 0.49, "status": "未处理", "x": 1.1}, {"id": "Ddt3A4pkRhQ", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "My parents fell for a ponzi scheme and lost $200,000.", "transcript": "Recently, my parents got scammed out of a lot of money, a couple hundred thousand dollars of their savings. No way to get it back. My wife and I, we've been extremely blessed. We make about $55,000 a month. We have a home in Arizona that we owe $180,000 on. We've been paying it off quickly. not feel perfect or genuine before you say it. But it’s important to start.\n\n🎧 While A Bit of Optimism is on hiatus, catch up on all the latest episodes, including our Feelings at Work special miniseries, wherever you get your podcasts.", "transcript": "I was in a fight with someone who I was dating and I did something that was clearly a mistake and he was very hurt. And I was really focused on how it was a mistake, like how obviously I didn't mean to hurt him. I was like justifying my position rather than just acknowledging his pain and expressing that the thing that was true to me, which is that I was very sorry that I made this mistake and he was just like, why can't you just say you're sorry? And so I took it and I said, okay, I'm sorry. And I like clearly forced it out, clearly didn't mean it. But then he took it like it was real. I looked at him, a person who I love. And I was like, wow, I really hurt him. I do feel sorry. So the actual remorse came after you got the response. Yeah. And the waves of realization just started hitting me. Why am I defending myself? He matters to me, it matters to him. Then after a few minutes, I said, wait, actually, I am really sorry. And I owned both what happened and the impact. Like half an hour later, it hit me even more. The third apology definitely wasn't necessary, but I was able to find genuine regret in me. The point of an effective apology is it does in fact relieve tension. And if somebody gives a false sorry, they will walk away from that situation, still angry, still seething, which means they have not apologized or taken accountability sufficiently to relieve their own guilt. And so the value of an effective apology allows the apologizer to also let go of the hurt and the tension and the guilt. And it's not just a gift to the other person. It is a gift to you.", "brk": "Hook类型: 痛点直击\n结构: 争吵防御 → 勉强道歉 → 产生共情 → 真正释怀\n为什么火: 颠覆传统“先有诚意再道歉”认知，揭示了行动先于情绪的心理真相。\n改编角度: 谈钱也一样：别等财务自由才开始理财，先迈出第一步，安全感和复利会在行动后真正发生。", "my": "很多人总 hat's life. The fact that they're not calling you and letting you know in keeping you apprised. If here's what's going on, here's this and here's the start date. The fact they're not communicating with you well, that would be an insight for me as to how they might do business once you get to be working there. And I would ask for something in writing that employment starts by August one or August 15th. Like there's something in writing saying, yes, I am going to be employed here. And if they can't give you that and I hate to say it, what a bummer, but, and I might communicate that to them. Yeah, but it might be a dream job in a nightmare situation. Right job, wrong company, maybe. Yeah, maybe. Yes. That's a great point. That's a great way of looking at it.", "brk": "Hook类型: 痛点直击\n结构: 描述口头承诺待业痛点 → 专家指出沟通红旗与风险 → 给出限期书面合同的实操建议\n为什么火: 切中求职者被“口头Offer”无限期搁置的焦虑，借恋爱比喻引发强烈共鸣。\n改编角度: 针对华人求职理财群体，拆解“口头Offer/兼职等通知”的隐形成本与资金压力。", "my": "面试了一家公司，对方口头说要请你，但让你等了一个半月还没下文。\n\n天天靠做 side gig 维持生活，这种日子真的很折腾，现金流随时会断。\n\n如果一家公司真的想要你，他们会主动跟进。\n\n一直不闻不问，其实已经暴露出他们做事的方式。\n\n就算最后真的入职了，这样的工作环境大概率也是个 nightmare。\n\n不要再傻傻等下去了。\n\n把你的 expectation 放清楚，要求对方给出一个 black and white 的书面 confirmation。\n\n如果没有办法做到，就要懂得及时止损。\n\n你身边有没有人也一直在等一个没有下文的 offer？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 1849, "comments": 22, "er": 0.46, "followers": 407114, "date": "2026-10-12", "url": "https://www.instagram.com/p/DeZxQwZFM8j/", "video": true, "ratio": 0, "score": 0.47, "status": "未处理", "x": 0.7}, {"id": "DfPoAMMiltJ", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I asked people how much debt they have.", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 1873, "comments": 30, "er": 0.44, "followers": 428642, "date": "2026-11-02", "url": "https://www.instagram.com/p/DfPoAMMiltJ/", "video": true, "ratio": 0, "score": 0.46, "status": "未处理", "x": 0.7}, {"id": "De3Iwhsz-3u", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Why didn’t they do it leh?! What a waste…”\n.\nMy favourite aspect of visiting projects would be the decipher the level of execution against the original design intent. For this project, the rooftop experience felt off because the team didn’t install glass handrails since the view was the main selling point. First reaction would be : ‘Developer wanna cut cost lah!!’\n.\nBut as we travel around the facilities deck on a lower floor, the treatments were luxurious. Therefore the roof deck treatment was a result of bursting the initial construction budget, and this is common for projects construction within the lockdown period. Construction materials cost went up 25-32% within that period😱 \n.\nWell I think it’s already a major achievement that the project is completed rather than many others that were abandoned:/\n#property #investment #realestate", "transcript": "", "brk": "", "my": "", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 674, "comments": 15, "er": 0.43, "followers": 160588, "date": "2026-10-24", "url": "https://www.instagram.com/p/De3Iwhsz-3u/", "video": true, "ratio": 0, "score": 0.45, "status": "未处理", "x": 0.6}, {"id": "DfJdxNnk8Ea", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“A rare property deal found…!!”\n.\n#property #investment #realestate", "transcript": "", "brk": "", "my": "", "tags": "property, investment, realestate", "bait": false, "type": "Carousel", "likes": 673, "comments": 16, "er": 0.43, "followers": 160588, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfJdxNnk8Ea/", "video": false, "ratio": 0, "score": 0.45, "status": "未处理", "x": 0.6}, {"id": "DfKOP5uIKeQ", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Happy Halloween. Are you the house handing out full-size candy bars?\n\nA Rich Life doesn’t have to mean private jets. Sometimes it’s the small things that make you smile every time: popcorn at the movies, groceries without checking every price, one more day of 钱就变脸。\n一个要存钱。\n一个要享受当下。\n每次讨论 budget。\n气氛都像在谈判。\n老公讲。\n这个 gadget 顶多两千块。\n买下来工作更有动力。\n老婆直接反问。\n家里已经有多少个类似的东西。\n你每次讲有动力。\n最后都是丢在角落生灰尘。\n老公开始讲道理。\n人生短短几十年。\n对对自己好一点有什么错。\n老婆讲。\n对对自己好是没错。\n但是我们的 cashflow。\n已经每个月都快见底了。\n你懂不懂什么是 commitment。\n老公静静不出声。\n两边僵持不下。\n其实很多家庭都是这样。\n一个人看数字。\n一个人看感觉。\n没有谁对谁错。\n只是站的角度不同。\n你家里也有这种财政部部长吗。\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 1672, "comments": 61, "er": 0.4, "followers": 428642, "date": "2026-11-13", "url": "https://www.instagram.com/p/Dfr8N8VmdHR/", "video": true, "ratio": 0, "score": 0.43, "status": "未处理", "x": 0.6}, {"id": "DfpAdiRD0GW", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "做生意最怕的，可能不是亏钱。\n而是你自己先顶不住了。\n\n我接触过很多做生意的人，\n发现有些生意之所以走不下去。\n\n不一定是因为没有资金、没有业绩、\n产品不好，或者员工不够好。\n而是老板太急了。\n\n他希望今年就成功，今年就赚100万，\n今年就财富自由，今年就赚到1000万。\n\n可是，你有没有想过？\n如果你把目标放在10年后呢？\n\n10年后实现财富自由，\n10年后拥有1000万。\n\n当你把时间拉长，\n你会发现，很多事情其实可以慢慢累积。\n\n你不需要每个月都看到巨大的成果，\n也不需要今年就证明自己成功。\n\n但真正困难的是：\n\n你能不能接受努力了几年，\n还是没有达到自己想要的成绩？\n\n你看看今天那些非常成功的企业。\nNVIDIA、Apple、Amazon、Tesla、SpaceX。\n\n它们从创立到发展成为今天的规模，\n都经历过不同阶段的挑战、\n长期投入和不确定性。\n\n就连Steve Jobs也经历过Apple的低谷，\n甚至曾经离开自己参与创立的公司。\n\n所以，成功真的不是一开始就看得到的。\n\n有时候，你可能需要投入很多年，\n才慢慢看到自己当初做的事情开始产生价值。\n\n现在我想问你一个问题：\n\n如果你的生意连续几年都没有达到预期的利润，\n你顶得住吗？\n\n你能不能继续学习、调整、改善，\n然后继续走下去？\n\n当然，我不是说亏钱也要一直坚持，\n更不是说所有生意都值得熬10年。\n\n方向错了，需要调整。\n商业模式有问题，需要改善。\n现金流撑不住，也必须认真处理。\n\n但如果你已经找到一个值得长期发展的方向，\n却因为短期没有看到成果，\n就一直急着换方向。\n\n那你可能永远都无法累积出真正的成果。\n\n有些事情，\n真的需要时间。\n\n#jackyhooi #生意倒闭 #钱的问题 #创业必看 #老板必看", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 戳中老板太急的痛点 → 提出10年长期主义的视角 → 举例巨头与乔布斯的低谷 → 引导反思与正确坚持\n为什么火: 精准共鸣华人创业者急功近利的焦虑，提供心理释压与长期主义的心态赋能\n改编角度: 结合理财或资产配置，探讨为什么过分追求短期暴利往往导致亏损，倡导长期复利心态", "my": "做生意最怕的，不是暂时亏钱。\n而是你自己先顶不住了。\n我见过很多马来西亚的小生意老板。\n每天都在看自己的 cashflow。\n看着户口里的数字，\n心里总有一股说不出的焦虑。\n为什么呢？\n因为大家都太急了。\n希望今年生意就暴风成长。\n今年就赚大钱，\n今年就要看到巨大的回酬。\n可是，你有没有想过？\n如果你把时间拉长来看呢？\n不管是做生意还是理财。\n过分追求短期的暴利。\n往往才是导致你最后亏损的原因。\n你总想找那种马上翻倍的投资。\n结果往往踩进坑里，\n把辛苦赚来的本金都亏光。\n其实，财富是一个累积的过程。\n你不需要每个月都看到惊人的成长。\n也不需要今年就向别人证明自己多成功。\n但真正困难的是。\n你能不能接受自己默默耕耘了几年。\n户口里的数字好像也没有特别暴增？\n你看看那些真正稳健的资产配置。\n不管是投资股票还是长期理财。\n从创立到看到成果。\n都经历过不同阶段的 market 波动。\n和长期的投入。\n就连那些很厉害的大老板。\n也经历过生意跌入谷底的时候。\n所以，成果从来都不是一朝一夕看得到的。\n有时候，你真的需要给它一点时间。\n让复利慢慢发挥它的价值。\n现在我想问你一个问题。\n如果你的生意或者投资，\n连续几年都没有达到预期的利润。\n你顶得住吗？\n你能不能继续调整你的 budget。\n处理好手上的 commitment。\n然后稳稳地走下去？\n当然，我不是叫你盲目地坚持。\n方向错了，就要调整。\n商业模式有问题，就要改善。\n现金流撑不住，也必须认真处理。\n但如果你已经找到一个值得长期发展的方向。\n却因为短期没有看到暴利。\n就急着换来换去。\n那你可能永远都无法累积出真正的成果。\n你觉得呢？\n留言讲讲你的想法。", "tags": "jackyhooi, 生意倒闭, 钱的问题, 创业必看, 老板必看", "bait": false, "type": "Carousel", "likes": 165, "comments": 0, "er": 0.42, "followers": 39669, "date": "2026-11-12", "url": "https://www.instagram.com/p/DfpAdiRD0GW/", "video": false, "ratio": 0, "score": 0.42, "status": "未处理", "x": 1.0}, {"id": "DfaoUGxip9d", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "Strong relationships are based on trust and communication. But if there is no communication, there can be no trust. \n\nVideo from Autodesk One Team Conference, March 2026, in conversation with CRO Andy Elder", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 提出信任痛点 → 阐述沟通逻辑 → 得出核心结论\n为什么火: 借用名人职场权威背书，直击人际关系本质，引发广泛共鸣。\n改编角度: 结合华人职场或理财社群痛点，探讨“信任与财富管理”的关系。", "my": "很多人以为理财只是算盘打得响。\n但其实你对钱的态度，暴露了你对生活的信任。\n如果你连打开 bank app 看 balance 都要犹豫。\n这就不是数字的问题。\n而是你不敢面对真实的 cashflow。\n很多人每个月出粮。\n钱还没捂热就进了一堆 installment 和 commitment。\n表面上看起来 payment record 美美的。\n但是手头上的现金越来越少。\n你不敢跟你另一半讲真实状况。\n你也避开去算每个月到底欠多少。\n这种信任的断裂。\n才是财务焦虑的真正来源。\n只有当你开始诚实面对你的 due date 和 budget。\n理财的控制权才会回到你手上。\n你觉得呢？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 21002, "comments": 202, "er": 0.41, "followers": 5226621, "date": "2026-11-06", "url": "https://www.instagram.com/p/DfaoUGxip9d/", "video": true, "ratio": 0, "score": 0.41, "status": "未处理", "x": 0.9}, {"id": "DeRs6VMCoSb", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "It doesn't happen often, but I am right sometimes", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 1595, "comments": 41, "er": 0.38, "followers": 428642, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeRs6VMCoSb/", "video": true, "ratio": 0, "score": 0.4, "status": "未处理", "x": 0.6}, {"id": "DegNc-uk9nI", "tracker": "FINANCE 竞对", "competitor": "spark_liang", "caption": "我经常看到很多人在内耗。\n\n朋友一句话，想了三天。员工一个决定，难过一个礼拜。别人一个眼神，自己先在心里演完一整场戏。\n\n我觉得，本质上不是那件事有多大，是心里面有太多的「应该」和期待。别人应该懂我、应该认同我、应该留下来。期待越多，落差越大，每一次落差都是一次内耗。\n\n而这些东西，其实都不在我们手上。\n\n我自己的做法很简单：不开心的时候，先看看心里是不是藏了一个「应该」。找到它，把它换成「可以」。别人可以不喜欢我，可以不认同我，可以走。事情还是那件事情，但人轻松很多。\n\n要求，留给自己。期待，别放在别人身上。\n\n这篇是我跟朋友在机场的一段对话，讲的就是这个。如果你最近也在纠结什么，希望对你有一点用。\n\n#不内耗 #情绪管理 #SparkLiang #创业 #自我成长 #心态", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 描述内耗场景 → 点破本质原因 → 给出心法解法 → 升华结语\n为什么火: 精准捕捉当代人过度思考的心理痛点，提供低成本的认知切换解法。\n改编角度: 针对理财焦虑，将“对别人的期待”转化为“对市场的预期”，教人放下暴富执念。", "my": "每天看别人为钱烦恼，我发现很多人最大的内耗，其实是从看户头那一刻开始的。\n\n看到身边人换新车，心里开始卡着一个念头：我这个年纪，是不是应该有这样的存款。\n听到别人讲投资赚多少，马上觉得自己慢了别人一步。\n看到月结单上的数字，忍不住在心里演完一整场焦虑的戏。\n\n本质上不是你赚得不够多，是你心里有太多的“应该”。\nmarket 应该照着你的想法涨，投资应该马上看到回报，薪水应该每年都有大跳动。\n期待越多，落差越大，每一次户头跟不上期待，就是一次严重的内耗。\n\n而这些 market 的波动，从来都不在我们手上。\n\n我自己的做法很简单：当觉得 cashflow 压力很大、很焦虑的时候，先看看心里是不是藏了一个不切实际的暴富执念。\n找到它，把“我应该立刻财务自由”换成“我可以慢慢建立 stability”。\n户头的数字还是那个数字，但心态轻松很多。\n\n要求，留给自己。对财富的暴富执念，别放在 unpredictable 的 market 身上。\n\n你最近是不是也对钱感到很焦虑？留言讲讲你的想法。", "tags": "不内耗, 情绪管理, SparkLiang, 创业, 自我成长, 心态", "bait": false, "type": "Carousel", "likes": 139, "comments": 0, "er": 0.38, "followers": 36126, "date": "2026-10-15", "url": "https://www.instagram.com/p/DegNc-uk9nI/", "video": false, "ratio": 0, "score": 0.38, "status": "未处理", "x": 1.0}, {"id": "Dfwu2WOjzDB", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "你想改变人生，\n可能真的只能靠努力。\n\n这个世界上不是每个人都有惊人的天赋。\n\n也不是每个人一出生，\n就拥有很好的背景、资源和家庭条件。\n\n有些人，父母很成功，\n家庭很有钱，从小就有人帮他铺好道路。\n\n但也有很多人，什么都没有。\n\n没有很成功的父母，没有经济支持，\n没有人脉，也没有人可以替自己安排未来。\n\n那普通人还能靠什么？\n\n努力，\n可能就是我们手上最重要的筹码。\n\n你没有天赋，可以花更多时间练习。\n你没有经验，可以从最基础的事情开始学习。\n你没有资源，可以一点一点累积。\n\n你没有好的起点，\n就更需要为自己创造机会。\n\n当然，努力不代表你一定会成功。\n\n有时候你很努力，还是会遇到失败；\n有时候你付出了很多，结果却没有马上出现。\n\n但至少，你没有放弃自己改变的可能。\n\n我一直觉得最可怕的不是一个人起点很低，\n而是他明明还有机会改变，\n却已经不愿意再付出努力。\n\n你可能没有办法选择自己的出生背景，也\n不能决定别人给不给你机会。\n\n但你至少可以决定，\n今天的自己要不要比昨天进步一点。\n\n努力可能不是成功的保证，\n但对于很多普通人来说，\n它是改变人生时最不能轻易放弃的筹码。\n\n不要小看自己还能做的事情。\n因为你现在所累积的每一点努力，\n都可能成为未来改变人生的基础。\n\n#jackyhooi #改变人生 #努力 #普通人", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 承认出身差距 → 指出普通人唯有努力 → 直面努力不一定成功 → 呼吁拒绝放弃积累\n为什么火: 精准击中普通人阶层焦虑，用克制而真诚的文字输出情绪价值，引发强烈共鸣与转发。\n改编角度: 结合理财痛点，探讨普通人如何靠“微小存钱习惯”或“基础理财配置”实现资产缓慢但确定的翻盘。", "my": "不是每个人一出生，\n口袋里都有很好的资源。\n\n很多人出社会第一天，\n就已经在帮家里还负债。\n\n没有成功的父母，\n没有多余的 cashflow 可以拿来投资。\n\n每个月出粮拿到的钱，\n扣完房租、车贷、家里开销，\n剩下不到几百块。\n\n在这样的状况下，\n很多人会觉得，\n反正存少少钱也没有用。\n\n干脆放弃理财，\n想买什么就刷卡买什么。\n\n但其实，\n最可怕的不是你现在赚得少。\n\n而是你明明有稳定收入，\n却因为觉得反正翻不了身，\n连一个月的 budget 都不愿意去算。\n\n理财不是只有赚大钱的人才需要。\n\n对于我们这种普通打工族来说，\n哪怕每个月只是多存两百块，\n哪怕只是开始规划自己的 commitment。\n\n这些微小的改变，\n才是我们手头上最重要的筹码。\n\n你可能没有办法决定自己的起点，\n但你可以决定，\n今天手上的现金流要怎么分配。\n\n你觉得呢？\n留言讲讲你的想法。", "tags": "jackyhooi, 改变人生, 努力, 普通人", "bait": false, "type": "Carousel", "likes": 145, "comments": 0, "er": 0.37, "followers": 39669, "date": "2026-11-15", "url": "https://www.instagram.com/p/Dfwu2WOjzDB/", "video": false, "ratio": 0, "score": 0.37, "status": "未处理", "x": 0.9}, {"id": "Dfx6PejGEWq", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Fun in LA & NYC over the last couple months with @nextlevelwardrobe", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 展示高端生活方式 → 揭示背后专业形象提升 → 引导关注\n为什么火: 视觉反差强烈，精准切中精英阶层的品质生活向往\n改编角度: 对标展示理财带来的生活自由，用消费升级场景激发财富焦虑与渴望", "my": "每天看别人晒在国外旅游的生活。\n你是不是也觉得。\n这些人赚的钱一定比你多很多。\n其实很多人不是赚得多。\n而是他们把 cashflow 顾得很好。\n当你的 commitment 不会卡死你。\n每个月的 installment 都在 comfort zone 里面。\n你自然有那个 margin 去过你想要的生活。\n很多人觉得理财就是亏待自己。\n不敢花钱，什么都不敢买。\n但其实真正的财富自由。\n是你知道自己的 financial status。\n每一笔钱都花得清清楚楚。\npayment record 美美的。\n手头上的现金也够安全。\n你觉得呢。\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Carousel", "likes": 3466, "comments": 31, "er": 0.35, "followers": 987182, "date": "2026-11-15", "url": "https://www.instagram.com/p/Dfx6PejGEWq/", "video": false, "ratio": 0, "score": 0.36, "status": "未 ssment、维修费、管理费，还有一堆买房时经纪根本不会跟你讲的 maintenance。\n\n这不代表买房是个错误的决定。\n\n对很多马来西亚人来说，拥有一间自己的家是人生目标。\n\n但这应该是一个根据实际数字做出的决定。\n\n而不是因为长辈一直跟你讲，租房等于把钱丢进水沟里。\n\n你身边的朋友是不是也一直在催你赶快买屋子？\n\n你觉得在现在的市道，买房还是必需品吗？\n\n留言讲讲你的想法。", "tags": "", "bait": true, "type": "Carousel", "likes": 2274, "comments": 219, "er": 0.25, "followers": 987182, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVQ_9UFHKJ/", "video": false, "ratio": 0, "score": 0.3, "status": "未处理", "x": 1.8}, {"id": "DeCOgOIiJtA", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "Swipe for more inspiration. 💡", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 14757, "comments": 94, "er": 0.28, "followers": 5225716, "date": "2026-10-03", "url": "https://www.instagram.com/p/DeCOgOIiJtA/", "video": false, "ratio": 0, "score": 0.29, "status": "未处理", "x": 0.7}, {"id": "DfH94Msj3XE", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "As leaders, we are not responsible for the results. As leaders, we are responsible for the people who are responsible for the results. \n\nVideo from Globo (November 2025) in conversation with journalist Rodrigo Carvalho", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 抛出反常识观点 → 重新定义领导责任 → 升华管理本质\n为什么火: 颠覆传统结果导向认知，戳中职场管理痛点引发共鸣与转发。\n改编角度: 结合华人职场焦虑，把“领导责任”转化为“理财顾问/老板如何对客户资产负责”。", "my": "很多人觉得，做理财最重要的是看最后滚出多少钱。\n\n但其实，数字只是结果。\n\n作为一个每天在看别人财务问题的人，我发现真正重要的不是盯着那个 balance。\n\n而是陪着那个正在为钱焦虑的人。\n\n很多打工族和小生意老板，天天被月光和 cashflow 压着，最需要的从来不是冷冰冰的数字。\n\n而是看懂自己的金钱逻辑。\n\n当一个人的 commitment 太重，手头现金越来越少的时候，压力是会直接影响生活和工作的。\n\n我们真正要对负责的，不是那个冷冰冰的户口余额。\n\n而是那个每天在为生活拼搏、在做金钱决定的人。\n\n你身边有没有这样的人？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 14882, "comments": 146, "er": 0.29, "followers": 5226621, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfH94Msj3XE/", "video": true, "ratio": 0, "score": 0.29, "status": "未处理", "x": 0.7}, {"id": "DfpOJx8By2d", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "We love to ma 每个月算到完。\n连买件衣服都觉得有罪恶感。\n结果几年下来。\n户口里的数字还是没有起色。\n华人长辈从小教我们。\n要买房不要租房。\n要拼命存钱不要花钱。\n这些传统观念不一定是错的。\n但它忽略了一个重点。\n你的 cashflow 如果整天卡在那些让你喘不过气的地方。\n你根本没有心力去做真正能累积 wealth 的大决定。\n真正管用的理财。\n不是一味地压抑自己。\n而是有一个清楚的 budget。\n把钱花在你真正热爱的事情上面。\n同时毫不手软地砍掉那些对你来讲不重要开销。\n过程中完全不用感到内疚。\n你觉得华人家庭最常听到哪一个过时的金钱观念。\n留言讲讲你的想法。", "tags": "", "bait": true, "type": "Carousel", "likes": 1019, "comments": 22, "er": 0.11, "followers": 987182, "date": "2026-11-01", "url": "https://www.instagram.com/p/DfM-PkOlEVV/", "video": false, "ratio": 0, "score": 0.11, "status": "未处理", "x": 0.6}, {"id": "Df2vUJUh_u6", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "If your answer to “Can I afford it?” doesn’t have a number, you don’t know.\n\nWednesday at 8pm ET / 5pm PT, I’m going live to show you how to know if you can afford something, and I’ll run the calculations in front of you. A vacation, a car, a house, even a mattress.\n\nStill to come in my free live series:\n\nNight 2 · Wed, Nov 18: Can I afford it?\nNight 3 · Thu, Nov 19: When can I stop working?\n\nComment RSVP and I’ll send you the link to save your free spot, or go to iwt.com/ramitlive", "transcript": "", "brk": "", "my": "", "tags": "", "bait": true, "type": "Video", "likes": 504, "comments": 179, "er": 0.07, "followers": 987182, "date": "2026-11-17", "url": "https://www.instagram.com/p/Df2vUJUh_u6/", "video": true, "ratio": 0, "score": 0.11, "status": "未处理", "x": 0.6}, {"id": "De_6lyrmPy5", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "You don’t need a budget. You need four numbers.\n\nIn my experience, fewer than 1% of people stick to a budget for more than two months, because tracking every coffee and every Target run is exhausting. \n\nA Conscious Spending Plan works differently. Instead of looking back at every purchase, you decide ahead of time where your money goes:\n\n- FIXED COSTS: 50–60% of take-home pay\n- INVESTMENTS: 5–10%+\n- SAVINGS: 5–10%\n- GUILT-FREE SPENDING: 20–35%\n\nHit those four numbers each month a <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const SUPA = 'https://emkjnvjjopzgadfbtlai.supabase.co';
const ANON = 'sb_publishable_SrZ2H85bOFaIotf8a-1GFA_oRalf7qq';
const STATUSES = ["未处理", "拍摄中", "已处理", "跳过"];
document.getElementById('updated').textContent = '更新于 2026-11-19 12:38 (GMT+8)';
const PAGE = 48;
let shown = PAGE;
let videoOnly = false;
let curTab = '全部';

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const getKey = () => ANON;  // anon key is baked in — safe, can only change status
const I = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [["jackyhooi", 4], ["honglisharing", 3], ["malaysia", 2], ["investing", 2], ["medicalcard", 2], ["insurance", 2], ["financialliteracy", 2]];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: '真爆款 ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: '近7天', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: '黑马', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: '引流帖', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
