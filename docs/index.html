inal design intent. For this project, the rooftop experience felt off because the team didn’t install glass handrails since the view was the main selling point. First reaction would be : ‘Developer wanna cut cost lah!!’\n.\nBut as we travel around the facilities deck on a lower floor, the treatments were luxurious. Therefore the roof deck treatment was a result of bursting the initial construction budget, and this is common for projects construction within the lockdown period. Construction materials cost went up 25-32% within that period😱 \n.\nWell I think it’s already a major achievement that the project is completed rather than many others that were abandoned:/\n#property #investment #realestate", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 发现设计缺陷 → 误解开发商省钱 → 揭秘建筑成本暴涨真相\n为什么火: 用建筑行业的专业内幕打破大众对无良开发商的刻板印象\n改编角度: 戳破大马30-45岁打工族和老板买房迷思，解析为何疫情后建材飙升导致屋子设计缩水却还要硬着头皮买", "my": "【封面：屋子变缩水？】\n你以为开发商省钱？\n你去看示范屋，最容易骂的一句，就是“怎么跟图不一样”。\n\n楼顶没做玻璃扶手，泳池边的质感也不对。\n很多人第一反应，是不是 developer 偷工减料。\n\n但有时候，不是他们不想做。\n是建材、人工、运输，整套成本都涨了。\n疫情后开工的项目，很多都卡在这个点上。\n\n前面预算已经吃紧，后面就只能在某些地方做取舍。\n你看到的是“缩水”。\n他们面对的是 cashflow 和成本压力。\n\n所以买房前，不只是看风景美不美。\n你要问自己，这个供期、这个 commitment，出粮后扛不扛得住。\n\n你遇过这种看图很美，实物差很多的屋子吗？留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 674, "comments": 15, "er": 0.43, "followers": 160588, "date": "2026-10-24", "url": "https://www.instagram.com/p/De3Iwhsz-3u/", "video": true, "ratio": 0, "score": 0.45, "status": "未处理", "x": 0.6}, {"id": "DfKOP5uIKeQ", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Happy Halloween. Are you the house handing out full-size candy bars?\n\nA Rich Life doesn’t have to mean private jets. Sometimes it’s the small things that make you smile every time: popcorn at the movies, groceries without checking every price, one more day of vacation because you’re having too much fun to leave.\n\nNotice what none of these come from: cutting back. They come from having more coming in, so you can say yes without doing the math first.\n\nA side business is one of the fastest ways to get there, and the ideas can be more specific than you’d think. There’s an entire online business built on teaching people how to train their parrots.\n\nComment LAUNCH and I’ll send you 30 real online businesses to help you find yours.", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 重新定义有钱生活 → 否定节流指向开源 → 举例副业引导留言\n为什么火: 打破传统省钱理财迷思，把财富自由具象化为日常小确幸。\n改编角度: 针对大马30-45岁月光族，强调买Mamak不用算钱和搞副业增加收入。", "my": "【封面：月光族的有钱感】\n你有想过吗？\n有钱，不是买豪车。\n是去 mamak 点单时，\n不用先看价格。\n\n是买菜的时候，\n不用每一样都算到完。\n是出粮后，\n还能多撑几天，\n不用一到月尾就开始心慌。\n\n你看，\n这些感觉，\n不是靠省到很苦来的。\n而是手头有多一点现金流，\n你才敢买，才敢吃，才敢松一口气。\n\n所以问题不是你不够会省。\n很多时候，\n是你收入太紧，\n一省就更辛苦。\n\n如果你想要的，\n是这种更舒服的现金流，\n先看看你现在的收入，\n到底卡在哪里。留言讲讲，\n你最常在哪一笔开销上最有压力。", "tags": "", "bait": true, "type": "Carousel", "likes": 4104, "comments": 120, "er": 0.43, "followers": 987182, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfKOP5uIKeQ/", "video": false, "ratio": 0, "score": 0.45, "status": "未处理", "x": 2.6}, {"id": "DfJdxNnk8Ea", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“A rare property deal found…!!”\n.\n#property #investment #realestate", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 发现稀缺好盘 → 拆解投资回报 → 呼吁立即行动\n为什么火: 戳中了本地人对房产增值和财富机会的强烈渴望\n改编角度: 针对30-45岁月光族或小老板，结合大马房产或EPF第二户头买房实操，教他们如何摆脱卡债并开始资产配置。", "my": "【封面：买房前先看现金流】\n你以为买到好盘就赢了？\n很多大马人看房，只看价钱。\n其实更该先看 cashflow。\n月供一加，保险一加，维修一加，\n你每个月还剩多少，才是重点。\n\n尤其是出粮就月光的人，\n还有小生意老板，\n最怕不是买不起，\n是买了以后手头更紧。\n\n房子不是不能买，\n但先算 commitment。\n如果这个月供会压到你连卡都要靠 min pay，\n那不是资产，\n是把压力搬进家里。\n\n我看过很多人，\n不是输在买贵，\n是输在没先算清楚。\n\n你如果也在想买房，\n先问自己一句：\n这个供期，真的配得上你的 cashflow 吗？\n留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Carousel", "likes": 673, "comments": 16, "er": 0.43, "followers": 160588, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfJdxNnk8Ea/", "video": false, "ratio": 0, "score": 0.45, "status": "未处理", "x": 0.6}, {"id": "Dflrt_xy52W", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "马来西亚其实很幸福\n#jackyhooi #马来西亚 #马来西亚人 #生活很幸福", "transcript": "他妈妈还想很幸福才需要多好显示他过生活你今天你实际导你随便找一个地方推销一下你实际过得很好如果你结婚有孩子准备找一份工我相信肯定可以找到工以你现在的认识你的特别的认识现在有个有用AI你更容易找到工因为很多员工都不懂AI的很多老板想要做AI的员工不一定做你懂你去找工你一定找到工你做得起一定比你失败的实际还要懂可能不敢讲懂但是一定足够人生活然后就做生活平衡跟老婆天天去散步爬山打比克波玩Pokémon Guard收藏品牌的兵买鞋子旅行所以有什么好风险的所以我一个时刻就去打工", "brk": "Hook类型: 反常识\n结构: 现实残酷 → AI机遇 → 幸福生活\n为什么火: 逆向思维打破普遍焦虑，引发关于生活方式与职场机会的讨论。\n改编角度: 35岁大马打工族善用AI技能轻松找工，摆脱月光与卡债，实现生活与工作的平衡。", "my": "【封面：会AI更好找工？】\n你会AI，不只找工。\n现在很多老板要的，不是最会讲的人。\n是能帮他省时间的人。\n\n你去看那些公司。\n很多事其实很乱。\n表格要整理，回信要快，\nreport 要整齐，客户要跟进。\n\n以前这些靠人慢慢做。\n现在会用 AI 的人，\n做得更快，错得更少。\n\n对打工族来说，\n这不只是技能。\n这是你跟别人拉开差距的地方。\n\n你如果本来就有稳定收入，\n再多一个能帮你提升价值的能力，\n你的选择就会多一点。\n\n不是说会 AI 就发财，\n是你在找工、转工、谈加薪时，\n更容易让人看到你的用处。\n\n你现在会用 AI 到什么程度？\n留言讲讲你的想法。", "tags": "jackyhooi, 马来西亚, 马来西亚人, 生活很幸福", "bait": false, "type": "Video", "likes": 171, "comments": 1, "er": 0.43, "followers": 39669, "date": "2026-11-11", "url": "https://www.instagram.com/p/Dflrt_xy52W/", "video": true, "ratio": 0, "score": 0.44, "status": "未处理", "x": 1.0}, {"id": "Dfr8N8VmdHR", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "How my wife and I's budgeting conversations go... 😂", "transcript": "How much are you spending, would you say, over the next few years? Oh gosh, I mean I think it's probably going to be something like, I don't know, at least $600 billion.", "brk": "Hook类型: 痛点直击\n结构: 夫妻预算对话 → 夸张消费预估 → 幽默反讽\n为什么火: 用极度夸张的数字调侃日常消费痛点，引发夫妻共鸣。\n改编角度: 吐槽KL打工仔每次过年回乡或做生意进货的预算膨胀，戳中月光族痛点。", "my": "【封面：预算总是爆】  \n每次预算都超？\n\n一讲到回乡，  \n一讲到进货，  \n很多人嘴上说省一点。\n\n结果一算，  \n车油、过路费、红包、吃喝、杂费，  \n再加一点点心软，  \n预算就开始膨胀。\n\n本来只是想花 RM500，  \n讲着讲着变 RM800。  \n本来只是补一点货，  \n最后像在帮钱包做压力测试。\n\n最扎心的是，  \n你不是不懂 budget。  \n你是每次都把现实，  \n算得太乐观。\n\n钱不是一下子不见。  \n是每个小开销，  \n都在跟你的现金流借位。\n\n如果你也常常这样，  \n留言讲讲你最容易超的那一笔。", "tags": "", "bait": false, "type": "Video", "likes": 1672, "comments": 61, "er": 0.4, "followers": 428642, "date": "2026-11-13", "url": "https://www.instagram.com/p/Dfr8N8VmdHR/", "video": true, "ratio": 0, "score": 0.43, "status": "未处理", "x": 0.6}, {"id": "DfpAdiRD0GW", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "做生意最怕的，可能不是亏钱。\n而是你自己先顶不住了。\n\n我接触过很多做生意的人，\n发现有些生意之所以走不下去。\n\n不一定是因为没有资金、没有业绩、\n产品不好，或者员工不够好。\n而是老板太急了。\n\n他希望今年就成功，今年就赚100万，\n今年就财富自由，今年就赚到1000万。\n\n可是，你有没有想过？\n如果你把目标放在10年后呢？\n\n10年后实现财富自由，\n10年后拥有1000万。\n\n当你把时间拉长，\n你会发现，很多事情其实可以慢慢累积。\n\n你不需要每个月都看到巨大的成果，\n也不需要今年就证明自己成功。\n\n但真正困难的是：\n\n你能不能接受努力了几年，\n还是没有达到自己想要的成绩？\n\n你看看今天那些非常成功的企业。\nNVIDIA、Apple、Amazon、Tesla、SpaceX。\n\n它们从创立到发展成为今天的规模，\n都经历过不同阶段的挑战、\n长期投入和不确定性。\n\n就连Steve Jobs也经历过Apple的低谷，\n甚至曾经离开自己参与创立的公司。\n\n所以，成功真的不是一开始就看得到的。\n\n有时候，你可能需要投入很多年，\n才慢慢看到自己当初做的事情开始产生价值。\n\n现在我想问你一个问题：\n\n如果你的生意连续几年都没有达到预期的利润，\n你顶得住吗？\n\n你能不能继续学习、调整、改善，\n然后继续走下去？\n\n当然，我不是说亏钱也要一直坚持，\n更不是说所有生意都值得熬10年。\n\n方向错了，需要调整。\n商业模式有问题，需要改善。\n现金流撑不住，也必须认真处理。\n\n但如果你已经找到一个值得长期发展的方向，\n却因为短期没有看到成果，\n就一直急着换方向。\n\n那你可能永远都无法累积出真正的成果。\n\n有些事情，\n真的需要时间。\n\n#jackyhooi #生意倒闭 #钱的问题 #创业必看 #老板必看", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 提出做生意老板太急的现象 → 给出拉长到十年时间的解法 → 引导反思现金流与方向\n为什么火: 精准戳中创业者急功近利却遭遇瓶颈的焦虑心理，引发深度共鸣\n改编角度: 针对大马35岁小生意老板，直面吉隆坡生意难做、现金流卡债压力，劝导放平心态长期布局", "my": "【封面：月光不是你懒】\n生意难的，常常不是没钱。\n\n而是你自己先顶不住。\n\n我看过很多本地老板，\n生意卡住的时候，\n不一定是没顾客，\n也不一定是产品不好。\n\n很多时候，\n是 cashflow 先断了。\n\n你今天想快点翻身，\n明天又想快点回本，\n后天看到账单，\n整个人就开始急。\n\n可是你有没有想过？\n如果你把眼光放远一点，\n不是看这个月，\n而是看接下来 12 个月呢？\n\n当你把时间拉长，\n很多压力就没那么集中。\n\n你不会每个月都逼自己看见大结果，\n也不用一直用短期输赢，\n去判断自己有没有用。\n\n真正难的，是这个。\n\n你能不能接受，\n努力了几个月，\n收入还是起伏很大。\n\n你能不能继续调 budget，\n继续管住出粮后的花费，\n继续把 min pay 和真正要还的先分清楚。\n\n你看今天很多生意会倒，\n不只是因为没生意，\n而是老板被现金流逼到乱了节奏。\n\n方向错了要调，\n开销太重要砍，\n债务结构太乱也要处理。\n\n但如果你明明有稳定收入，\n只是因为短期看不到结果，\n就一直换做法，\n那你很难把钱慢慢养起来。\n\n有时候，\n不是你不行。\n\n是你太急着证明自己。\n\n你觉得呢？\n你有没有试过一急，钱就更乱？\n留言讲讲你的想法。", "tags": "jackyhooi, 生意倒闭, 钱的问题, 创业必看, 老板必看", "bait": false, "type": "Carousel", "likes": 165, "comments": 0, "er": 0.42, "followers": 39669, "date": "2026-11-12", "url": "https://www.instagram.com/p/DfpAdiRD0GW/", "video": false, "ratio": 0, "score": 0.42, "status": "未处理", "x": 1.0}, {"id": "DfaoUGxip9d", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "Strong relationships are based on trust and communication. But if there is no communication, there can be no trust. \n\nVideo from Autodesk One Team Conference, March 2026, in conversation with CRO Andy Elder", "transcript": "I worked with somebody, I needed to give her some feedback, and it went horribly wrong. The mistake I was making is I gave feedback the way I like to receive it. I like to receive it blunt to the point, don't give me a freaking feedback sandwich. And so what the mistake I made is I gave feedback the way I like to receive it, turns out she doesn't like to get feedback the way I like to get it. And this happened a couple times and it ended up being a fight. And at some point I said to her, this can't continue. Like I have to be able to give you feedback. I can't go through this every time and you don't want to go through this every time. And she said to me, all you need to do is ask me, can I give you some feedback or schedule it with me? That's all I need. I need to like prepare. And I went, I can do that. So I had to give her some feedback and I said, I have to give you some, I have to have a tough conversation with you is now a good time. And it turned out she could actually take more brutal feedback than almost anybody in the team, as long as I scheduled it and prepared her for it. And so one of the things that we have to do as leaders or as colleagues is to learn how somebody wants their feedback. Some people really like feedback sandwiches. And some people say, I just need to prepare or I need the good news first or, and just do that. Give people the feedback the way they want to receive it.", "brk": "Hook类型: 痛点直击\n结构: 错误示范 → 冲突爆发 → 调整沟通方式 → 达成高效结果\n为什么火: 用真实的职场沟通碰撞揭示了“同理心”盲区，引发强烈共鸣\n改编角度: 针对月光族打工仔，吐槽用错理财方法导致越存越穷，必须找到适合本地人省钱的节奏", "my": "【封面：月光不是懒】  \n我以前也以为，省钱要硬来。\n\n结果很多人一领薪水，\n就照自己的习惯处理钱。\n\n先还最急的，\n先刷卡顶住，\n再想办法搬来搬去。\n\n表面看起来很勤劳，\npayment record 也好看。\n\n可是手头现金越来越少，\n月底还是一样紧。\n\n问题不是你不会省，\n是你用错了方法。\n\n每个人的 cashflow 不一样，\ndue date 不一样，\n家用、卡债、供期也不一样。\n\n你要先知道，\n你适合先 cut 开销，\n还是先排还款顺序，\n还是先设自动扣账。\n\n有时候，\n不是钱不够，\n是节奏不对。\n\n你最近最卡的是花太快，\n还是还债顺序乱？留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 21002, "comments": 202, "er": 0.41, "followers": 5226621, "date": "2026-11-06", "url": "https://www.instagram.com/p/DfaoUGxip9d/", "video": true, "ratio": 0, "score": 0.41, "status": "未处理", "x": 0.9}, {"id": "DeRs6VMCoSb", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "It doesn't happen often, but I am right sometimes", "transcript": "구독과 좋아요는 필수!", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 1595, "comments": 41, "er": 0.38, "followers": 428642, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeRs6VMCoSb/", "video": true, "ratio": 0, "score": 0.4, "status": "未处理", "x": 0.6}, {"id": "DegNc-uk9nI", "tracker": "FINANCE 竞对", "competitor": "spark_liang", "caption": "我经常看到很多人在内耗。\n\n朋友一句话，想了三天。员工一个决定，难过一个礼拜。别人一个眼神，自己先在心里演完一整场戏。\n\n我觉得，本质上不是那件事有多大，是心里面有太多的「应该」和期待。别人应该懂我、应该认同我、应该留下来。期待越多，落差越大，每一次落差都是一次内耗。\n\n而这些东西，其实都不在我们手上。\n\n我自己的做法很简单：不开心的时候，先看看心里是不是藏了一个「应该」。找到它，把它换成「可以」。别人可以不喜欢我，可以不认同我，可以走。事情还是那件事情，但人轻松很多。\n\n要求，留给自己。期待，别放在别人身上。\n\n这篇是我跟朋友在机场的一段对话，讲的就是这个。如果你最近也在纠结什么，希望对你有一点用。\n\n#不内耗 #情绪管理 #SparkLiang #创业 #自我成长 #心态", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 指出内耗现象 → 分析核心原因 → 给出心态转换方法\n为什么火: 精准戳中现代人过度思考和情绪内耗的心理痛点，引发强烈共鸣\n改编角度: 针对大马30-45岁打工族与小生意老板，把职场内耗转化为对薪水、通胀和生意利润的无谓焦虑", "my": "【封面：薪水一到就没了】\n我常看到很多人。\n出粮那天还很安心。\n两三天后就开始焦虑。\n卡先还，车先供，家用先给。\n剩下那一点，连买饭都要算。\n\n问题不是你不会赚钱。\n是你心里有太多「应该」。\n应该有存款。\n应该生活轻松。\n应该这个月还能剩。\n期待越大，cashflow 越容易失控。\n\n但钱这件事，很多时候不在情绪。\n在安排。\n\n我自己的看法很简单。\n先把「应该」换成「可以」。\n这个月可以先活下来。\n这个月可以先把 due date 顾好。\n这个月可以先留一点 emergency fund。\n不要拿今天的收入，去赌明天的轻松。\n\n要求，先放回自己身上。\n别把压力，全放在薪水上。\n你最近是不是也有这种感觉？留言讲讲。", "tags": "不内耗, 情绪管理, SparkLiang, 创业, 自我成长, 心态", "bait": false, "type": "Carousel", "likes": 139, "comments": 0, "er": 0.38, "followers": 36126, "date": "2026-10-15", "url": "https://www.instagram.com/p/DegNc-uk9nI/", "video": false, "ratio": 0, "score": 0.38, "status": "未处理", "x": 1.0}, {"id": "Dfwu2WOjzDB", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "你想改变人生，\n可能真的只能靠努力。\n\n这个世界上不是每个人都有惊人的天赋。\n\n也不是每个人一出生，\n就拥有很好的背景、资源和家庭条件。\n\n有些人，父母很成功，\n家庭很有钱，从小就有人帮他铺好道路。\n\n但也有很多人，什么都没有。\n\n没有很成功的父母，没有经济支持，\n没有人脉，也没有人可以替自己安排未来。\n\n那普通人还能靠什么？\n\n努力，\n可能就是我们手上最重要的筹码。\n\n你没有天赋，可以花更多时间练习。\n你没有经验，可以从最基础的事情开始学习。\n你没有资源，可以一点一点累积。\n\n你没有好的起点，\n就更需要为自己创造机会。\n\n当然，努力不代表你一定会成功。\n\n有时候你很努力，还是会遇到失败；\n有时候你付出了很多，结果却没有马上出现。\n\n但至少，你没有放弃自己改变的可能。\n\n我一直觉得最可怕的不是一个人起点很低，\n而是他明明还有机会改变，\n却已经不愿意再付出努力。\n\n你可能没有办法选择自己的出生背景，也\n不能决定别人给不给你机会。\n\n但你至少可以决定，\n今天的自己要不要比昨天进步一点。\n\n努力可能不是成功的保证，\n但对于很多普通人来说，\n它是改变人生时最不能轻易放弃的筹码。\n\n不要小看自己还能做的事情。\n因为你现在所累积的每一点努力，\n都可能成为未来改变人生的基础。\n\n#jackyhooi #改变人生 #努力 #普通人", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 承认起点差距 → 强调努力筹码 → 给出行动建议\n为什么火: 击中普通人出身平凡却渴望改变的奋斗心理，引发强烈情感共鸣。\n改编角度: 针对大马30-45岁月光族与小生意老板，讲没父荫没资本，靠理财与攒钱逆袭。", "my": "【封面：月光族靠什么】\n你不是没机会。\n只是现金流太紧。\n\n有些人一出手，\n就有人帮他垫底。\n\n有些人做生意，\n手上本来就有资本。\n\n但很多大马打工族，\n出粮前就已经开始算。\n\n卡要还，家用要给，\n车供、房供、孩子开销，\n每一笔都在追着你跑。\n\n那普通人还能靠什么？\n\n不是靠运气，\n是靠把钱管清楚。\n\n你没有多余现金，\n就先学会分。\n你没有大笔积蓄，\n就先守住每个月的 budget。\n你没有资源，\n就先别让 min pay 变成习惯。\n\n我不是讲你要一夜翻身。\n我只是想讲，\n你今天有没有比上个月，\n少一个乱花的决定。\n\n因为真正可怕的，\n不是起点低，\n而是明明还能调整，\n却一直让 cashflow 继续漏。\n\n你不能选出生，\n但你可以选今天怎么用钱。\n\n你觉得呢？留言讲讲你的想法。", "tags": "jackyhooi, 改变人生, 努力, 普通人", "bait": false, "type": "Carousel", "likes": 145, "comments": 0, "er": 0.37, "followers": 39669, "date": "2026-11-15", "url": "https://www.instagram.com/p/Dfwu2WOjzDB/", "video": false, "ratio": 0, "score": 0.37, "status": "未处理", "x": 0.9}, {"id": "Dfx6PejGEWq", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Fun in LA & NYC over the last couple months with @nextlevelwardrobe", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 痛点引入 → 解决方案 → 行动呼吁\n为什么火: 结合高压生活与渴望改善财务的普遍心理，引发强烈共鸣\n改编角度: 针对月光族打工族和小生意老板，揭露日常盲目消费导致存不到钱的残酷真相", "my": "【封面：月光不是没赚】\n你以为你穷吗？\n\n很多人不是收入太低，\n是钱一进来就被花光。\n\n出粮那天，\n看起来很有钱。\n两天后，\n户口又回到原点。\n\n问题不在你不会赚，\n是在你的 cashflow 没有顺序。\n\n先还最急的，\n先留生活费，\n再安排债务，\n最后才是享受。\n\n不然你每个月都在忙，\n却一直存不到。\n\n如果你也常常出粮就月光，\n留言讲讲你卡在哪里。", "tags": "", "bait": false, "type": "Carousel", "likes": 3466, "comments": 31, "er": 0.35, "followers": 987182, "date": "2026-11-15", "url": "https://www.instagram.com/p/Dfx6PejGEWq/", "video": false, "ratio": 0, "score": 0.36, "status": "未处理", "x": 2.1}, {"id": "DeR5GUWjsvN", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "If a leader gives people something to belong to and provides a clear direction, then those who believe will find amazing ways to get there.\n\nVideo from LeanScaper Revenue Intensive, January 2026, in conversation with founder Mark Bradley", "transcript": "One of the biggest blind spots of founders is they think that because it's clear to them, it's clear to everybody. You have staff on the front lines who are disconnected from corporate. Do they know why they go to work every day? Or is it just to like do the job, get a paycheck? Just remind people, little reminders of why we do what we do. I have the color orange. It's not there for fashion, it's there for me. It's a reminder that my job every single day is to do everything I can to inspire people to do what inspires them. It's the color of optimism. It's why I have it. I have little flashes of orange everywhere. I had my ring with the inside is orange. It's not there for you, it's there for me. Right? It's there as a reminder. My team knows why I have orange and we put little splashes of orange on everything as a reminder. The point is whatever your cause is, whatever it is that the culture you're trying to build, put it everywhere so everybody can see it. And when your clients see that, guess what it makes them? It makes them feel pride that they hired a company that even believes that.", "brk": "Hook类型: 痛点直击\n结构: 戳中盲点 → 举例说明 → 升华价值\n为什么火: 用具象化的小物件把抽象的使命落地，引发强烈共鸣。\n改编角度: 戳中本地小老板常陷入“只给薪水不谈愿景”导致员工和自己都心累、月月辛苦却存不到钱的盲点。", "my": "【封面：月光不是偶然】\n你以为钱够清楚？\n\n很多人出粮后，\n只想着先把账单还掉。\n\n员工看不懂方向，\n老板自己也只是在赶。\n\n结果呢？\n每天都很忙，\n但现金流还是很紧。\n\n我见过最常见的盲点，\n不是不会赚，\n是每一笔钱都没有提醒作用。\n\n你可以在手机首页，\n放一个固定的预算表。\n也可以在 bank app，\n把还款日和 due date 设好。\n\n不是为了好看，\n是为了提醒自己，\n这笔钱要先顾哪一块。\n\n不然你会发现，\n表面上 payment record 美美的，\n手头上的现金却越来越少。\n\n钱这件事，\n最怕的不是不够，\n是你每天都看见，\n却没有人提醒你它在往哪里去。\n\n你觉得呢？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 16903, "comments": 169, "er": 0.33, "followers": 5226621, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeR5GUWjsvN/", "video": true, "ratio": 0, "score": 0.33, "status": "未处理", "x": 0.7}, {"id": "Df4dXrciF78", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 16904, "comments": 112, "er": 0.33, "followers": 5226621, "date": "2026-11-18", "url": "https://www.instagram.com/p/Df4dXrciF78/", "video": false, "ratio": 0, "score": 0.33, "status": "未处理", "x": 0.7}, {"id": "DfVKVymiJIb", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 16342, "comments": 136, "er": 0.32, "followers": 5226621, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVKVymiJIb/", "video": false, "ratio": 0, "score": 0.32, "status": "未处理", "x": 0.7}, {"id": "DeeqeVxlGMh", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 16194, "comments": 145, "er": 0.31, "followers": 5226621, "date": "2026-10-14", "url": "https://www.instagram.com/p/DeeqeVxlGMh/", "video": false, "ratio": 0, "score": 0.32, "status": "未处理", "x": 0.7}, {"id": "DfKN9H1ihaY", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "Swipe for more optimism. 💡", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 15664, "comments": 101, "er": 0.3, "followers": 52266  if buying is right for you.", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 揭示买房隐形成本 → 打破租房等于亏钱迷思 → 引导评论索取计算指南\n为什么火: 用真实数据反驳传统观念，戳中想买房又怕背上沉重负担的焦虑心理\n改编角度: 盘点大马买房除了供期还有Cukai Celaka、维修等隐形开销，点醒月光族别盲目背房贷", "my": "【封面：买房不只供期】\n你以为只看供期？\n在大马，买房不是只看月供。\n\n除了房贷，\n还有地税，\n保险，\n维修，\n管理费，\n水电网，\n这些才是很多人没算进的 cashflow。\n\n很多人一听到租房，\n就说是丢钱。\n但对月光族来说，\n真正可怕的，\n是买了房以后，\n每个月手头更紧。\n\n房子不是不能买。\n重点是你买之前，\n有没有把 commitment 算清楚。\n\n如果你现在也在看房，\n先别急着签。\n先把每个月会出的钱列出来，\n再看自己扛不扛得住。\n\n你觉得买房最容易漏算的是哪一项？\n留言讲讲你的想法。", "tags": "", "bait": true, "type": "Carousel", "likes": 2274, "comments": 219, "er": 0.25, "followers": 987182, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVQ_9UFHKJ/", "video": false, "ratio": 0, "score": 0.3, "status": "未处理", "x": 1.8}, {"id": "DfH94Msj3XE", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "As leaders, we are not responsible for the results. As leaders, we are responsible for the people who are responsible for the results. \n\nVideo from Globo (November 2025) in conversation with journalist Rodrigo Carvalho", "transcript": "where your job is to now look after the people who do the job you used to do, we don't teach them that skill set. So you get a good journalist because somebody learned journalism. So to be a good leader, you have to learn leadership. Every single great leader I've ever met does not think of themselves as an expert leader. They all think of themselves as students. They all think they have something more to learn. They talk about it. They watch talks about it like this. They read books. They read magazines. They go out with their friends. I go out with them when we talk about leadership. It's an obsession. Like anybody who's good at anything is obsessed with learning that thing. If you want to get really good at making ceramics, you have to obsess about practicing and practicing and learning. Leadership is the same. And so I guess the final take away is be the leader you wish you had.", "brk": "Hook类型: 身份共鸣\n结构: 指出管理盲区 lan where you spend extravagantly on the things you love and cut back mercilessly on the things you don’t, without feeling guilty about either.\n\nIf you want to set that up with your own numbers, comment CSP and I’ll send you my Conscious Spending Plan template.", "transcript": "", "brk": "Hook类型: 反常识直击\n结构: 否定传统建议 → 揭示核心痛点 → 给出全新方案 → 引导评论获取工具\n为什么火: 打碎主流理财焦虑，用“放纵喜爱、无情砍掉”的新观点提供情绪价值。\n改编角度: 戳破大马中年打工族戒咖啡却仍卡债滚滚的迷思，教小老板做不牺牲生活品质的财富规划。", "my": "【封面：咖啡省了也没用】\n如果省咖啡有用，\n更多人早没卡债了。\n\n但现实是，\n很多人一边省着每一块，\n一边继续刷卡、继续分期，\n真正出血的地方，\n却没人去看。\n\n问题不是你不够节俭。\n问题是你把力气，\n花在最小的开销上。\n\n你省掉 RM15 的 kopi，\n却没处理掉\n每个月最重的 commitment。\n\n我见过太多人，\nbudget 做得很细，\n但 cashflow 还是很紧。\n因为他们在管零碎，\n不是在管大头。\n\n真正该看的，\n是你的出粮怎么分，\n哪些支出要砍，\n哪些习惯可以保留，\n让你不会因为理财，\n把自己活得太辛苦。\n\n如果你也想把自己的钱，\n排得更清楚，\n留言讲讲你最想先改哪一块。", "tags": "", "bait": true, "type": "Carousel", "likes": 1019, "comments": 22, "er": 0.11, "followers": 987182, "date": "2026-11-01", "url": "https://www.instagram.com/p/DfM-PkOlEVV/", "video": false, "ratio": 0, "score": 0.11, "status": "未处理", "x": 0.6}, {"id": "De_6lyrmPy5", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "You don’t need a budget. You need four numbers.\n\nIn my experience, fewer than 1% of people stick to a budget for more than two months, because tracking every coffee and every Target run is exhausting. \n\nA Conscious Spending Plan works differently. Instead of looking back at every purchase, you decide ahead of time where your money goes:\n\n- FIXED COSTS: 50–60% of take-home pay\n- INVESTMENTS: 5–10%+\n- SAVINGS: 5–10%\n- GUILT-FREE SPENDING: 20–35%\n\nHit those four numbers each month and you can stop stressing about the small stuff. And yes, the guilt-free spending is money you’re supposed to enjoy.\n\nIf you’re not sure how close you are, the fastest way to find out is to look at what you actually spent last month. Comment AUDIT and I’ll send you my free Spending Audit Guide to do it.", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 否定传统记账 → 给出四大黄金数字比例 → 呼吁评论领取工具\n为什么火: 直击记账反人类的痛点，给出了简单易执行的傻瓜式理财比例。\n改编角度: 针对马来西亚30-45岁月光族，用薪水比例规划日常开销与卡债，摆脱记咖啡钱的痛苦。", "my": "【封面：薪水四份法】\n你不用记账本。\n你要的是四个比例。\n\n很多人一出粮，\n就开始乱掉。\n不是因为不会赚，\n是因为钱没先分好。\n\n我会先看这四块：\n\n固定开销，\n像房租、车贷、家用，\n先占一大块。\n\n还债，\n信用卡、personal loan，\n先放进固定预算。\n\n备用金，\n每个月先存一点，\n不要等有剩才存。\n\n最后才是你自己的花费，\nmamak、吃饭、娱乐，\n这笔钱可以花，\n但要先设好上限。\n\n你不是不能花钱，\n你是不能乱花到月底。\n\n如果你想知道，\n你现在的薪水有没有分对，\n先看你上个月到底花去哪里。留言讲讲你的想法。", "tags": "", "bait": true, "type": "Carousel", "likes": 641, "comments": 129, "er": 0.08, "followers": 987134, "date": "2026-10-27", "url": "https://www.instagram.com/p/De_6lyrmPy5/", "video": false, "ratio": 0, "score": 0.1, "status": "未处理", "x": 0.6}]</script>

}

    if (name !== '全部') {

      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);

  entries.forEach(e => {

        el.appendChild(f);

      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 Instagram 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
