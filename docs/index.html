<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FINANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>FINANCE<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

是哪个最伤你的 cashflow。\n\n你觉得最难砍的是哪一个？\n留言讲讲你的想法。", "tags": "personalfinance, financialliteracy, malaysia, costofliving", "bait": false, "type": "Video", "likes": 3062, "comments": 40, "er": 15.6, "followers": 19890, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeQ9auaBUMJ/", "video": true, "ratio": 0, "score": 16.0, "status": "未处理", "x": 2.1}, {"id": "DelG-2KBkJq", "tracker": "FINANCE 竞对", "competitor": "bobngoh", "caption": "Only 45 days old to be exact. Becoming millionaires one day might be easier than they think. Because they have so much time for their money to grow. 🤍\n\n#financialliteracy #investing", "transcript": "Our twins are only 2 months old and their net worth is 10,000 each. They haven't worked a day, their only job is keeping daddy awake. Friends and relatives bless them with 7,000 ringgit each in Ang Pao. I give them 2,000 ringgit at birth and 500 ringgit every month. Here is how I'm putting that money to work. First, SSPM Prime. 4,000 ringgit each goes here and I will add another 4,000 ringgit each yearly, on top of their monthly investment. Under current rules, there's up to 8,000 ringgit in tax relief. I could save approximately 2,000 ringgit in tax and I will give it back to them as their birthday investment. 1,000 ringgit each. Second, an S&P 500 index fund. Hell in my name for them. I will invest their remaining 6,000 ringgit each and add 500s monthly and their birthday money of 1,000 ringgit yearly. Assuming annual compounded returns of 3.56% for SSPM and 10% for equities, they could each have around 620,000 ringgit by 21 years old. If nothing is withdrawn, these are projections, not guaranteed returns. If they don't need the money for college, move the SSPM balance into equities and leave everything invested at that assumed 10% until 40? Potentially 4 million ringgit each without adding another ringgit after 21. I know, being able to do this is a privilege. Start with what you can afford and I will teach them how to manage it too. B enti-hentikan Singapore pada 1 ringgit dan 44 ringgit semenilai. Tapi beberapa kebanyakan adalah di sebuah tinggi. Somalia adalah 4 ringgit semenilai. Newway adalah 15 ringgit dan 40 ringgit. Dan Diego Garcia adalah 26 ringgit semenilai. Yang sejujurnya sangat kecewa. Sekarang, di mana ia dapat menarik. Ada sebuah industri yang sebenarnya menerima kamu sebuah panggilan di satu dari tempat yang terlalu tepat. Kemudian, bayar kamu berhenti-hentikan untuk semua orang yang menyebabkan. Setiap kebanyakan ini dapat kamu sebenarnya menerima di online dan menerima panggilan ini dalam 15 minit. Dan beberapa mereka pun memberikan diri untuk kamu untuk panggilan auto untuk bernasib. Jadi panggilan tidak menghukum apa-apa saja. Dia hanya menangis sebuah nombor, mencari robot untuk menghukumkan jenis panggilan jenis panggilan sepanjang-jenis dan menunggu untuk panggilan yang menyebabkan. Sebenarnya, itu adalah sebuah 11 juta US dollar semasa. Dan ini adalah satu lagi nasti. Apabila kamu menghukumkan, panggilan yang kamu dengar mungkin hanya menjadi rekod. Kamu mungkin sudah menjawab dan kamu sudah menjadi reka. Ia pun ada nama. Ia disebut sebagai keputusan kekansi. Jadi sebenarnya, ia bukan bukan kamu yang bergalliba. Tidak ada polis yang tak berat, tak ada OTP, tiada apa-apa untuk dikeluarkan. Tidak pernah dihukumkan. Jika ia seorang benar, mereka akan menyebabkan kamu. Mereka perlu kamu percaya sesuatu. Yang ini hanya perlu kamu menyebabkan. Selamat tinggal.", "brk": "Hook类型: 痛点直击\n结构: 陌生来电现象 → 揭秘跨国电话诈骗机制 → 给出防范建议\n为什么火: 戳中大众频繁接到海外诈骗电话的日常困扰，揭秘冷门骗局满足好奇心。\n改编角度: 针对本地30-45岁常接境外诈骗电话的打工族，揭秘打回去即中招的高额国际漫游陷阱。", "my": "【封面：陌生来电别回】\n你接过这种电话吗？\n\n来电一响就断。\n号码还很陌生。\n\n很多人第一反应是回拨。\n以为是客户，家人，或者银行。\n\n但有些电话，不是找你。\n它只是在等你回。\n\n你一按回拨，\n对方那边就开始计费。\n你以为只是打一通电话，\n其实是在帮它完成一笔账。\n\n最危险的不是接到。\n是你想知道是谁，\n然后自己追过去。\n\n这种时候，别急着回。\n先看号码来源，\n再决定要不要理。\n\n很多骗局不是靠吓你。\n是靠你一时好奇。\n\n下次再看到这种陌生来电，\n先停一下，别让好奇心先出手。", "tags": "scamcall, scamawareness, phonescam, malaysia, fyp", "bait": false, "type": "Video", "likes": iliun ringit. Itu sebab 84.4% alat perjalanan anda dan sebagai alat perjalanan, ia sedia untuk sebenarnya mengalihkan sebuah alat. Tapi anda harus mempunyai pelan strategis untuk sebenarnya melayani. Melayani alat perjalanan anda yang paling tinggi itu dulu, lalu berjalan dengan ke jalan ke kecil. Pertama, anda ada pelajaran yang telah dibuat. Pada alat perjalanan yang sama, survey yang telah dikenali bahawa 61% alat perjalanan akan mempercaya untuk memasukkan bahkan 1000 ringit untuk kejalanan. Itu 6 dari 10 melayani. Jadi jika anda mempunyai 3-6 bulan alat pengguna, anda pasti akan berada di atas lebih banyak orang. Pertama, jika anda mempunyai pelajaran ini di tempat yang menerima lebih banyak perang yang anda beri. Pertama, anda sebenarnya berhenti mencari dengan orang yang berada di luar. Perjalanan adalah alat perjalanan yang teruk. Mereka akan selalu menjadi seseorang dengan kerja baru, rumah yang lebih besar, sebuah holiday yang lebih baik. Tapi semasa itu berhenti menghubungi anda, anda berhenti membeli hal untuk membentuk sesuatu dan anda boleh sebenarnya mulai mempercaya alat pengguna. Dan jika anda suka lebih banyak video seperti ini, anda boleh menikmati saya lebih banyak. Selamat tinggal.", "brk": "Hook类型: 身份共鸣\n结构: 抛出反常识现象 → 列举5个财务健康指标 → 评论区留关键词送表格\n为什么火: 用安慰焦虑的视角打破多数人觉得自己很穷的错觉，提供低门槛的对标数据\n改编角度: 针对35岁月光打工族，对比BNM数据证明其实你没那么差，教你用资产净值表摆脱卡债", "my": "【封面：5个月光信号】\n你可能没你想的差。\n\n第一个信号，出粮后还能剩钱。\n不是很多也没关系。\n至少你不是每个月都清零。\n\n第二个信号，你知道自己的 cashflow 去哪了。\n很多人不是赚太少。\n是钱一直漏掉，自己都不知道。\n\n第三个信号，你有一个小小的 emergency fund。\n不用大到吓人。\n先有一笔，遇到车坏、家里急事，不用马上刷卡。\n\n第四个信号，你有看自己的债务顺序。\n先还高利息的卡，再看 personal loan。\n不是乱还一通，越还越乱。\n\n第五个信号，你开始不再跟别人比。\n别人换车、出国、买新屋。\n不代表你的路就比较差。\n你先把自己的账站稳，已经赢过很多人了。\n\n如果你中了两三个，不用嫌自己差。\n你现在最该做的，是把钱流向看清楚。你觉得你中了几个？留言讲讲。", "tags": "personalfinance, moneytips, financialliteracy, malaysia", "bait": true, "type": "Video", "likes": 567, "comments": 408, "er": 4.9, "followers": 19890, "date": "2026-10-13", "url": "https://www.instagram.com/p/Dec9K8jT5SX/", "video": tr erves love. \nEvery parent deserves an informed choice. 🤍\n\n#ivf #ivfjourney", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 引入家人经历 → 引发深度反思 → 给出理性建议\n为什么火: 用亲身痛点故事引发情感共鸣，提供高价值的决策参考\n改编角度: 讲大马30-45岁打工族因盲目跟风借贷或过度消费导致月光，如何通过记账与理性规划扭转财务困境", "my": "【封面：月光不是命】  \n我姐那句提醒，救了我一次。  \n她不是叫我省到很苦。  \n她是提醒我，别乱借。  \n\n很多人月光，  \n不是薪水太少，  \n是出粮后根本没先看账。  \n卡一刷，installment 一开，  \n心里就觉得还早。  \n结果每个月都在追账单。  \n\n我见过太多人，  \n一边讲压力大，  \n一边继续用 credit card 过日子。  \n表面看起来 payment record 美美的，  \n手头上的现金越来越少。  \n\n你要先问自己三件事。  \n这个开销是需要，还是想要。  \n这个分期，会不会压到 cashflow。  \n我下个月出粮后，  \n还有没有钱留给真正重要的账。  \n\n其实欠卡一点都不可耻，  \n好在我们还有解决事情的能力。  \n先把钱的顺序排对，  \n你才不会一直被情绪带着走。  \n\n只有在承担责任中，我们才能真正掌握理财的智慧。  \n你也有这种月光循环吗，留言讲讲你的想法。", "tags": "ivf, ivfjourney", "bait": false, "type": "Carousel", "likes": 6638, "comments": 41, "er": 7.06, "followers": 94544, "date": "2026-10-24", "url": "https://www.instagram.com/p/De3M5GiGh-7/", "video": false, "ratio": 0, "score": 7.15, "status": "未处理", "x": 1.3}, {"id": "Dd1MLRMNWtY", "tracker": "FINANCE 竞对", "competitor": "bobngoh", "caption": "I’ve wanted to do this since the day they were born. 😂\n\nLike finally. 😍🥺\n\n#mylove #newborn #twins", "transcript": "çours çours y cosmos ç rural yusuf", "brk": "Hook类型: 情感共鸣\n结构: 情感铺垫 → 愿望达成 → 结果展示\n为什么火: 双胞胎出生的罕见喜悦与多年心愿达成的真实情绪极具感染力\n改编角度: 晒出30-45岁本地华人拼搏多年终于全额清还车贷房贷的解脱感与喜悦", "my": "【封面：终于清完了】\n我一直想等这天。\n\n不是买新车，\n不是换大房子。\n\n是每个月还款后，\n户口还能留下钱。\n\n很多本地人拼命工作，\n不是不会赚，\n是钱都卡在 commitment。\n\n你以为自己在撑，\n其实是 cashflow 被压住了。\n\n当 loan 真的清掉那一刻，\n人会很静，\n但心里会很松。\n\n那种感觉，\n像终于可以正常呼吸。\n\n如果你现在也在扛着供期，\n你觉得最压的是哪一笔？留言讲讲你的想法。", "tags": "mylove, newborn, twins", "bait": false, "type": "Video", "likes": 5942, "comments": 148, "er": 6.44, "followers": 94544, "date": "2026-09-28", "url": "https://www.instagram.com/p/Dd1MLRMNWtY/", "video": true, "ratio": 0, "score": 6.75, "status": "未处理", "x": 1.2}, {"id": "De1IHF7IPvf", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "If you’re travelling overseas soon, don’t use just any debit card 💳\n\nThe 身边有没有这种情况？\n留言讲讲你的想法。", "tags": "HomemadeBaking, DadLife, HealthyRecipes", "bait": false, "type": "Video", "likes": 4964, "comments": 58, "er": 5.31, "followers": 94544, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfUWVH2BJm5/", "video": true, "ratio": 0, "score": 5.43, "status": "未处理", "x": 1.0}, {"id": "DeiRDxSk9Xe", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Don’t let one bad day make you forget about everything that’s still good 🤍\n\n1 bad hour doesn’t erase the other 23. 1 bad week doesn’t cancel out the other 3. 1 bad year doesn’t define your whole life. Perspective is everything.\n\nSave this for the day you need the reminder 🔖\n\n#mindset #motivation #lifelessons #malaysia #fyp", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 情感共鸣 → 视角切换 → 收藏提醒\n为什么火: 用时间对比法化解焦虑，击中现代人精神内耗的痛点。\n改编角度: 针对30-45岁月光族和店主，用“一年生意不好或一次冲动消费不代表全盘皆输”重塑理财心态。", "my": "【封面：1次失手不等于完蛋】\n一次失手，不等于完蛋。\n\n一个月花超了，不代表你整年都乱掉。\n一次刷卡冲动，也不等于你整个人不会管钱。\n\n我看过很多人，最怕的不是那一笔钱。\n是那种想法。\n觉得自己一失手，整盘都坏了。\n然后干脆放弃。\n\n其实不是。\n钱这件事，最怕你用一时的状态，去定义全部。\n今天月光，不代表你明天也会月光。\n这个月生意差，不代表你一直都差。\n\n你要看的，不是那一刻的情绪。\n是你接下来怎么调整。\n\n先把眼前的开销看清楚。\n再把出粮后的分配排好。\n能补的洞，就一个一个补。\n\n如果你也常常因为一时花超，就整个人很灰，留言讲讲你的想法。", "tags": "mindset, motivation, lifelessons, malaysia, fyp", "bait": false, "type": "Carousel", "likes": 1045, "comments": 12, "er": 5.31, "followers": 19890, "date": "2026-10-16", "url": "https://www.instagram.com/p/DeiRDxSk9Xe/", "video": false, "ratio": 0, "score": 5.43, "status": "未处理", "x": 0.7}, {"id": "DdlahXwhwj1", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Did you know the company called Perodua doesn’t actually build a single Perodua? 🤯\n\nWe drove almost 360,000 of them off the lot last year, yet the story of who really owns what behind the scenes is way more complicated than most Malaysians realise.\n\n#perodua #malaysia #fyp", "transcript": "Lain tahun, Malaysia membuangkan sekitar 360,000 produk. Itu seharusnya 44% dari semua kawasan baru di sini. Dan ini adalah perkara yang saya hanya menemukan kelebihan yang terkenal yang disebut produk tidak sebenarnya membuangkan satu-satunya. Biar saya jelaskan kerana mereka sebuah produk. Sekarang, yang paling terkenal untuk saya adalah pembina Perusahan Automobil Kedua, yang adalah kedua kawasan kawasan tersebut. Itu adalah kawasan yang dikatakan di dalam kawasan, bilik syurga dan kawasan di dalam kawasan yang anda bawa kepada MIV2. Malaysia mempunyai sekitar 68% dari itu, dengan UMW, MBM, dan juga PNB. Jadi di kawasan itu, ya, ia adalah kekakangan yang sangat baik. Tapi kawasan mereka menghubungi pembinaan di Sungai Chuo Rawang. Dan pembina itu berada di dalam pembina yang berbeda yang berbeda disebut Perusahan Automobil Kedua. Perusahan pembinaan hanya mempunyai sekitar 49%. Pembuangan yang lainnya adalah untuk Dahetsu dan juga Mitsui Jepang. Seperti sebuah restoran. Kita mempunyai pembinaan, kawasan dan pembina, tapi kawasan kita mempunyai kawasan. Dan kawasan itu adalah keadaan yang sebenarnya membuat makanan. Sekarang, ini adalah kawasan yang terjadi. Selama 2008, apabila pembinaan ini masih di luar, kawasan kawasan kawasan membuat sekitar 219 milion ringgit di profit. Semasa kawasan kawasan Malaysia membuat kawasan kawasan kawasan hanya 179 milion ringgit, walaupun dengan lebih banyak rehat. Jadi kawasan itu membuat kawasan lebih banyak daripada restoran. Ada juga kawasan yang diperlukan. Perodua hanya memperoleh untuk mengeluarkan keadaan di mana Dahetsu belum membeli. Sebab itulah kita mempunyai Punggung, Fiji, Sri Lanka dan juga Malaysia. Dan di Indonesia, Mabis itu di luar sekarang sebagai Dahetsu Syrion. Sama kerja, sama pembinaan Rawa, hanya satu beda. Sekarang, saya tidak mengatakan perodua yang terlalu teruk. Ia menyebabkan kawasan yang benar, kawasan yang berlainan dan lebih dari 30 tahun kekakutangan yang kita belum ada sebelumnya. Tapi ia benar-benar mengenai apa yang kita sebenarnya memakai. Kadang-kadang, memakai nama bukan sama seperti memakai hal. Jobis!", "brk": "Hook类型: 痛点直击\n结构: 认知反差 → 揭秘真相 → 利益重组\n为什么火: 用国民神车Perodua的代工真相打破大众盲目消费认知。\n改编角度: 揭秘大马人常买的Myvi背后的车贷真相，警示30-45岁打工族别为面子买车导致常年月光负债。", "my": "【封面：Myvi 不等于轻松】\n你以为买车只是供车？\n很多人一拿到车，才发现真正吃钱的，不是车价，是每个月的commitment。\n\n车贷只是开始。\n保险、road tax、停车费、tol、service，再加上油钱。\n你算的是 monthly installment，银行算的是你的cashflow。\n\n所以有些人不是买不起车。\n是买了车以后，出粮那天更紧。\n表面看起来很风光，手头上的钱却越来越少。\n\n我不是说车不能买。\n我是说，买之前先问自己一句。\n这笔供期，会不会把你的生活压到很 kaw？\n\n很多时候，真正压垮你的，不是车。\n是你为了面子，把未来几年的现金流先锁死了。\n\n你买车前，有认真算过这些吗？留言讲讲你的想法。", "tags": "perodua, malaysia, fyp", "bait": false, "type": "Video", "likes": 916, "comments": 27, "er": 4.74, "followers": 19890, "date": "2026-09-22", "url": "https://www.instagram.com/p/DdlahXwhwj1/", "video": true, "ratio": 0, "score": 5.01, "status": "未处理", "x": 0.7}, {"id": "DfVrJ6TTI53", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Salary going up but still broke? It might be your lifestyle, not your income. \n\nMy parents taught me: if you want to live happily, live below your means.\n\nWhen your expenses stay the same as your income grows, every extra ringgit goes to savings and investments. That’s how real financial freedom is built.\n\n💬 How much of your salary do you save each month? Comment below 👇\n\n#personalfinance #livebelowyourmeans #financialfreedom #savingmoney #malaysia", "transcript": "Music", "brk": "Hook类型: 痛点直击\n结构: 薪水增加却月光 → 点破消费陷阱 → 量入为出实现财务自由\n为什么火: 直击现代人“越赚越多却越穷”的普遍焦虑，引发强烈共鸣\n改编角度: 针对大马30-45岁打工族薪水涨却卡债还完又欠，教你用量入为出法存下第一桶金", "my": "【封面：加薪还月光？】\n薪水涨了，还月光？\n\n问题通常不是收入。\n是你的开销，也跟着涨。\n\n很多人一加薪，\n第一件事不是存钱，\n是先升级生活。\n\n换车。\n换更贵的餐。\n刷卡分期，\n再加一点点小确幸。\n\n结果呢？\n每个月看起来有进步，\n户口其实没多半块。\n\n我一直觉得，\n真正有钱感的人，\n不是赚最多那个，\n是花得最稳那个。\n\n薪水涨的时候，\n先别急着把生活一起抬高。\n把原本的开销守住，\n多出来的钱先留给自己。\n\n你现在每个月，\n能留下多少 RM？\n留言讲讲你的情况。", "tags": "personalfinance, livebelowyourmeans, financialfreedom, savingmoney, malaysia", "bait": false, "type": "Video", "likes": 893, "comments": 21, "er": 4.6, "followers": 19890, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVrJ6TTI53/", "video": true, "ratio": 0, "score": 4.81, "status": "未处理", "x": 0.6}, {"id": "Dd2YQDWT2dY", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "For years I saved the way most Malaysians do. Spend first then save whatever is left. But that method depends way too much on self control, which nobody has every single month 🫠\n\nOne small tweak that’s helped is using MAE Tabung on the MAE app. It automates the boring parts of saving so I don’t have to think about it. Sometimes the simplest solution is just taking your own willpower out of the equation.\n\n#MAETabung #ItsGottaBeMAE", "transcript": "Did you know that a survey found that 61% of Malaysians have difficulty raising 1000 ringgit for an emergency? And honestly, I can see how that happens because I used to save the way a lot of people do. Spend first and then at the end of the month, save whatever that is left. But a problem with that is sometimes nothing is left. That is why now I'm exploring ways to keep me saving either way, when I'm disciplined and when I overspend. And lucky enough, I found this. Let me show you how it works. Because I make sure the saving process happens before I get the chance to spend the money. Let's say I'm traveling to Japan and instead of waiting until the end of every month and deciding how much I can afford to save, I decide the amount upfront and make the saving happen automatically with Mei Tabong. Just simply turn on auto reduction when creating a new tabong and you're good to go. And you don't need to think about it anymore after that. It just happens. But what if I decided to travel together with my friends instead? Friends trying to get everyone to pay for their portion is always a headache. So to avoid everyone saying, later, closer to the trip only I will transfer and start preparing, I can just create a group tabong, invite up to 4 friends and get them to contribute. No more excuses and now everyone can slowly put up their own portion towards that goal. Now I'm not going to pretend I never overspend. I collect TCG cards so shopping is my weak spot lah. But that's where Guilty Pleasure Booster comes in. You choose a spending category where you know you tend to overspend, set a daily spending limit and decide an amount to go into your tabong if you cross that limit. For example, I can set a daily limit of 500 ringgit and if I spend beyond that limit, 50 ringgit will automatically be transferred for my account into an active tabong. So at least when I do spend a little bit more than I should, I don't feel as guilty lah. Because I'm still putting something towards my savings at the same time. So my savings works both ways lah. Good month I save, bad month I also save. Which is way more realistic than expecting perfect self-control every single month. Because the goal isn't to be perfect with money. It's to build a system that saves for you on the months you don't. So when you create your next tabong, remember to switch on auto deduction and turn on your tabong booster. Set it once and let it do the rest. Ciao peace.", "brk": "Hook类型: 痛点直击\n结构: 亮出61%大马人难拿出千吉应急存款 → 揭秘先花后存必月光死局 → 引入MAE自动存款系统与惩罚机制\n为什么火: 用大马人共鸣的存款难痛点切入，结合Maybank功能给出反人类自律的自动化解法\n改编角度: 针对35岁月光打工族，拆解如何用MAE自动化扣款对付周末喝Kopi和Shopee网购的坏习惯", "my": "【封面：月光不是懒】  \n出粮就没钱？  \n很多人不是不会存，  \n是把存钱放在最后。  \n\n一刷卡、  \n一买东西、  \n一帮家用，  \n钱就散掉了。  \n\n你以为自己是自律差，  \n其实是顺序错了。  \n\n我看过太多人，  \n每个月都说这次要存一点。  \n结果一到周末kopi，  \nShopee一开，  \nbudget 又破掉。  \n\n所以重点不是逼自己更狠，  \n而是先设规则。  \n\n你可以先定一个每月金额，  \n工资一进来先拨走。  \n再设 auto debit，  \n放在 due date 前，  \n最好是出粮后那个星期。  \n\n这样不是靠意志力，  \n是靠系统先帮你挡住。  \n\n如果你连卡费、生活费、  \n家用都在抢现金流，  \n那更不能等到月底才想存。  \n\n存钱这件事，  \n不是看你今天多有纪律，  \n而是看你有没有一个  \n适合月光人的方法。  \n\n你觉得先存后花，  \n对你有用吗？留言讲讲你的想法。", "tags": "MAETabung, ItsGottaBeMAE", "bait": false, "type": "Video", "likes": 892, "comments": 4, "er": 4.5, "followers": 19890, "date": "2026-09-28", "url": "https://www.instagram.com/p/Dd2YQDWT2dY/", "video": true, "ratio": 0, "score": 4.54, "status": "未处理", "x": 0.6}, {"i 千万不要为了省Text去买一些我们原本不需要的东西记得先检查看看自己的财务情况看一下有什么东西是值得扣的如果你觉得今天的分享有帮到你记得分享想去区给更多人看到我们下期见", "brk": "Hook类型: 痛点直击\n结构: 亮明省税金额 → 逐一拆解扣税项目 → 提醒量力而行\n为什么火: 直击中高收入人群怕交冤枉税的痛点，用具体数字给出了省钱方案。\n改编角度: 针对月薪过万却常月光的本地打工族，教他们善用LHDN扣税额减轻负担。", "my": "【封面：月光也要会分】\n月薪过万还月光？\n\n很多人不是赚太少，\n是钱一进来就乱跑。\n\n先看第一个，\n你的必要开销。\n\n房租，车贷，家用，\n这些先摆前面。\n\n第二个，\n是你的债务。\n\n信用卡，personal loan，\n先算清楚每个月要供多少。\n\n第三个，\n才是你自己的钱。\n\n不是等剩下才算，\n是先预留，\n不然你每个月都在救火。\n\n我见过很多人，\n出粮那天看起来很有钱，\n两周后就开始等下个月。\n\n表面看起来 cashflow 很顺，\n其实是每一笔都在偷走你的自由。\n\n你不用一下子变很会理财，\n先做一件事就够了，\n把你下个月的出粮，\n先分成三份。\n\n你会发现，\n钱不是不够，\n是你还没分好。\n\n你现在最难分的，\n是生活费还是债务？留言讲讲。", "tags": "TaxRelief, IncomeTax, HongLiSharing, Finance", "bait": false, "type": "Video", "likes": 251, "comments": 73, "er": 2.69, "followers": 12055, "date": "2026-11-10", "url": "https://www.instagram.com/p/DfjkGPwxowF/", "video": true, "ratio": 0, "score": 3.9, "status": "未处理", "x": 0.7}, {"id": "DfZjoALDyEW", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "真正有钱的人，\n有时候看起来真的很普通。\n\n你可能会遇到一些人：\n\n平时只是穿着简单的T-shirt，\n开着一辆普通的车，\n生活上也没有刻意表现得很特别。\n\n可是当你真正了解他们的时候，\n你可能会发现：\n\n他们住的是Bungalow，\n拥有好几间Landed Property。\n\n甚至还有大片土地、Farm Land、\n游艇和其他投资资产。\n\n只是这些东西，他们不一定会拿出来展示。\n\n反而有些人，\n会比较喜欢让别人看到自己的生活。\n\n开什么车、戴什么手表、\n住什么房子，都希望别人知道。\n\n当然这没有什么对错。\n\n有人喜欢分享自己的生活，\n有人喜欢低调，\n这只是不同的生活方式。\n\n但我觉得，这里面有一个很重要的道理：\n\n「我们看到的外表，不一定代表一个人真正拥有的财富」\n\n一个人穿得普通，\n不代表他没有钱。\n\n一个人开着豪车，\n也不代表他一定拥有很庞大的资产。\n\n因为真正的财务状况，\n可能藏在你看不到的地方。\n\n可能是房产、土地、\n企业股权、投资，\n或者长期累积下来的资产。\n\n所以不要太快根据一个人的穿着、\n开什么车、住什么地方，\n就判断他的经济实力。\n\n有时候，\n你看到的只是他愿意展示给你的那一面。\n\n人不可貌相，财富也一样。\n\n#jackyhooi #有钱人 #富人思维 #装穷", "transcript": "", "brk": "Hook类型: 反常识\n结构: 现象对比 → 核心观点 → 总结升华\n为什么火: 打破大众对有钱人外表的刻板印象，引发强烈共鸣与反思\n改编角度: 拆穿大马30-45岁打工族爱慕虚荣租豪车撑面子，其实背着卡债的真相", "my": "【封面：车靓不代表有钱】\n真正有钱的人，\n有时候看起来很普通。\n\n但在大马，\n有些人看起来很风光，\n其实 cashflow 很紧。\n\n你可能看过这种人：\n车是租的，\n表面很有面子，\n吃饭买单也很会演。\n\n可是你不知道的是，\n他可能卡债已经在 roll，\n每个月先还 min pay，\n手头现金越来越少。\n\n更扎心的是，\n外面看到的，\n只是他愿意让你看到的那一面。\n\n真正决定一个人稳不稳的，\n不是车标，\n不是手表，\n是出粮后，\n还剩多少钱可以呼吸。\n\n所以不要太快羡慕，\n别人看起来过得 ou, then you can't carry that.", "brk": "Hook类型: 痛点直击\n结构: 坦白没钱送礼 → 提出抽签送礼解法 → 众人附和释放压力\n为什么火: 直面人情消费的社会压力，说出了大众不敢说的心声\n改编角度: 针对新年过节送礼压力，教35岁打工族如何拒绝亲戚红包和昂贵送礼", "my": "【封面：红包礼物很烧钱】\n过年送礼，真的累。\n\n很多人不是不想给，\n是钱包先顶不住。\n\n尤其是马来西亚打工族，\n一到新年，\n红包、礼物、聚餐，\n全部一起来。\n\n你会很纠结，\n不给，好像失礼。\n给了，自己又月光。\n\n我觉得最累的，\n不是送礼本身，\n是那种被迫要体面。\n\n如果一桌人都在比，\n谁给得多，\n谁包得厚，\n那已经不是心意，\n是压力了。\n\n我反而觉得，\n可以直接讲清楚。\n\n例如，大家约好，\n大人抽签送，\n小孩子照顾到就好。\n不是冷漠，\n是不要让大家都硬撑。\n\n因为讲白一点，\n真正的关系，\n不是靠礼物撑出来的。\n\n你有遇过这种过节压力吗？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 4333, "comments": 98, "er": 1.09, "followers": 407114, "date": "2026-11-16", "url": "https://www.instagram.com/p/Df0VstwEmQf/", "video": true, "ratio": 0, "score": 1.14, "status": "未处理", "x": 1.6}, {"id": "Ddoy-5zjIi0", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "I feel guilty cutting off my ex.", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 3513, "comments": 270, "er": 0.93, "followers": 407114, "date": "2026-09-23", "url": "https://www.instagram.com/p/Ddoy-5zjIi0/", "video": true, "ratio": 0, "score": 1.06, "status": "未处理", "x": 1.5}, {"id": "DfCpuf4l7Uj", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Even better, if you have dry beans and rice, you scoop it into their bags! Think smarter not harder people.", "transcript": "Love's talking to the moon", "brk": "Hook类型: 身份共鸣\n结构: 提出搞钱荒谬招数 → 引发观众吐槽 → 给出真正理财建议\n为什么火: 利用荒诞幽默反讽日常省钱困境，引发打工人强烈共鸣与互动。\n改编角度: 针对月光族打工仔，吐槽大马百物涨价却靠吃快熟面省钱的荒谬，带出记账还债法。", "my": "【封面：月光族别乱省】\n你省错地方了。\n\n有人省钱省到只吃快熟面，\n结果卡还在滚，心更累。\n\n百物涨价的时候，\n你如果只会砍饭钱，\n其实不是在理财，\n是在拿身体去补现金流。\n\n真正该看的，\n是你每个月的钱，\n到底先去哪里。\n\n先把出粮后的 budget 排好，\n固定还债，\n固定留一点生活费，\n剩下的才谈别的。\n\n如果你现在也是这样过月，\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 3558, "comments": 155, "er": 0.87, "followers": 428642, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfCpuf4l7Uj/", "video": true, "ratio": 0, "score": 0.94, "status": "未处理", "x": 1.4}, n\n买房不是不能想，\n是先算自己扛不扛得住。\ncommitment 太满，\n生活就会很紧。\n\n我看钱，先看这件事。\n不是你能不能供，\n是你供了以后，\n还有没有呼吸空间。\n\n只有在承担责任中，我们才能真正掌握理财的智慧。", "tags": "property, investment, realestate", "bait": false, "type": "Carousel", "likes": 1387, "comments": 5, "er": 0.87, "followers": 160588, "date": "2026-11-14", "url": "https://www.instagram.com/p/DfuNcRpEwoj/", "video": false, "ratio": 0, "score": 0.87, "status": "未处理", "x": 1.2}, {"id": "DfetW2eiqhC", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "越成功的人，越愿意去帮助别人\n#jackyhooi #成功的人 #愿意帮助人", "transcript": "成功的人都很愿意绑人成功的人都不会看不起刚开始的人为什么这样讲呢因为所有成功的人他曾经都是那个刚开始的人他们通常不会看不起那刚开始的人就好像如果今天我不是一个很能运动的人如果你的朋友当中有一个很能运动的人而你没有你还没有开始运动对不对你讲你说我是要开始运动那个人会支持你还是那个人会打压你通常那个人就会支持你为什么因为他在他的领域运动已经有一定的成绩已经很在上面那谁会取消你呢谁会讲你不能坚持谁讲你做不到什么就是那些没有坚持的人就是那些没有开始运动的人所以刚好想法你看会支持你的人往往都是很厉害的人很成功的为什么因为他们是一个很积虑我说那个领域他肯定会支持你", "brk": "Hook类型: 反常识\n结构: 抛出观点（成功者更愿帮人） → 举例对比（运动支持vs打击） → 总结升华（强者才懂扶持）\n为什么火: 打破阶层敌意认知，用“强者更宽容”给底层迷茫者提供心理按摩\n改编角度: 戳中35岁月光族身边的冷嘲热讽，对比理财成功者与穷朋友的态度，激发逆袭共鸣", "my": "【封面：月光时谁帮你】\n出粮后最怕什么？\n不是没钱。\n是身边那句风凉话。\n\n你说你想开始存钱，开始还债，开始管 cashflow，\n有些人第一反应不是支持，\n是笑你两句。\n\n但你想一下，\n真正在钱上走过来的人，\n反而比较懂你卡在哪。\n\n因为他知道，\n月光不是你懒，\n欠卡也不代表你废。\n\n很多人嘴巴很会讲，\n轮到自己出粮，\n照样先刷卡、先还 min pay、先拖到 due date。\n\n所以会打压你的人，\n很多时候不是他比较懂，\n是他自己也没走出去。\n\n真正有经历的人，\n通常不会看不起刚开始整理钱的人。\n他只会提醒你，\n先把现金流稳住，\n再谈下一步。\n\n你身边如果有那种真的愿意讲真话的人，\n要珍惜。\n你觉得呢？留言讲讲你的想法。", "tags": "jackyhooi, 成功的人, 愿意帮助人", "bait": false, "type": "Video", "likes": 331, "comments": 3, "er": 0.84, "followers": 39669, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfetW2eiqhC/", "video": true, "ratio": 0, "score": 0.86, "status": "未处理", "x": 2.0}, {"id": "De4WaqQI5WK", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I asked people in Nashville how much debt they have.", "transcript": "Tell me ma'am, how much debt do you have? Zero. I have no debt. What about a mortgage? No mortgage. When did you become debt-free? November 2023. Congratulations! Thank you! What got you on this journey? To get out of debt and stay out of debt? Following Dave Ramsey. So how much debt did you have? Including the mortgage, I started with $450,000. How long was the total journey? About 11 years. So you cleaned up almost half a million bucks in 11 years? When you say it like that, I feel pretty good. You should! What would you tell all these other people that are in crippling debt out here? Live on lesson you make. Follow a budget. Make it. Follow it. And be consistent and stick with it. Learn to say no to yourself and to others who are asking you to do things that are not in the plan. So much wisdom and so much joy. This is what debt freedom can be for you.", "brk": "Hook类型: 街头采访痛点直击\n结构: 街头问负债 → 揭晓无债一身轻 → 分享还清巨债秘诀 → 总结理财心态\n为什么火: 用真实巨额债务数字的反差，激发观众对无债一身轻的强烈向往\n改编角度: 采访吉隆坡30-45岁打工族或小生意老板，揭露他们背负车贷卡债的月光生活", "my": "【封面：月光还是有出路】\n你欠多少？\n我没有欠。\n那车贷呢？房贷呢？\n都没有。\n\n你几时清掉的？\n去年尾。\n恭喜你。\n谢谢。\n\n是什么让你走到这一步？\n先看清自己的 cashflow。\n然后照 budget 过日子。\n出粮先分配。\n先供最急的债。\n不要一时爽就刷回去。\n也要学会对自己说不。\n别人临时开口要你帮忙。\n如果不在计划里。\n就先缓一缓。\n\n很多人不是不会赚。\n是钱一进来，就被生活吃完。\n其实欠债一点都不可耻。\n可怕的是一直装没看到。\n\n你现在最卡的是哪一块？\n留言讲讲你的情况。", "tags": "", "bait": false, "type": "Video", "likes": 3442, "comments": 66, "er": 0.82, "followers": 428642, "date": "2026-10-24", "url": "https://www.instagram.com/p/De4WaqQI5WK/", "video": true, "ratio": 0, "score": 0.85, "status": "未处理", "x": 1.2}, {"id": "DfhR_TED4SV", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "做老板的代价，就是失去自由。\n\n当初为什么想创业？\n我相信很多人跟我一样。\n\n其中一个最想要的东西，就是自由。\n\n可以安排自己的时间，\n不需要一直听别人的安排，\n想做什么就做什么。\n\n可是真正创业以后，\n你会发现事情好像完全不是这样。\n\n顾客遇到问题，找老板。\n员工遇到问题，找老板。\n\nSupplier找老板，\n银行找老板，\nTax也找老板。\n\n然后我想问一个问题：\n\n到底谁才是老板？\n明明公司是自己的，\n为什么好像所有人都可以安排我的时间？\n\n而且，做老板还有很多开销需要负责。\n\n员工薪水、花红、员工旅行、\n供应商货款、银行贷款和利息、\n税务、办公室租金，还有各种维修费用。\n\n你辛辛苦苦赚回来的钱，\n好像还没来得及享受，\n就已经有很多地方等着你支付。\n\n我接触过很多做生意的人。\n\n有些人经营了十年生意看起来不错，\n但真正留在自己手上的钱，\n却没有想象中那么多。\n\n因为赚到的钱，\n不代表最后能够留下来。\n\n更重要的是，他们投入了十年的时间，\n每天处理公司里面大大小小的问题，\n却没有真正换来自己想要的自由。\n\n所以，我觉得每个老板都应该问自己一个问题：\n\n「我辛辛苦苦做了十年生意，到底是为了谁而赚钱？」\n\n当然，做生意本来就有责任和成本。\n\n但如果一家公司永远都需要，\n老板亲自处理每一件事。\n\n那老板可能不是在经营一家公司，\n而是在为公司打工。\n\n真正值得追求的，不只是把生意做大。\n而是建立一个能够持续运作的生意。\n\n让团队可以承担责任，\n让系统可以解决问题，\n同时也让自己有时间、有利润、有选择。\n\n创业的目的，不应该只是拥有一家公司，\n而是通过这家公司，换来自己真正想要的生活。\n\n#jackyhooi #老板不好当 #失去自由 #创业真相", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 创业追求自由 → 现实沦为奴隶 → 建立系统解脱\n为什么出发: 精准戳中马币贬值下大马小生意老板既缺钱又没时间的极端焦虑。\n改编角度: 针对30-45岁大马小生意老板，揭露赚马币却被租金和员工薪水掏空、没有自由的盲点。", "my": "【封面：老板没自由？】\n做老板，真有自由吗？\n\n很多人创业，\n是为了自己安排时间。\n\n不用看人脸色，\n想做什么就做什么。\n\n可是你真的做下去才会发现，\n时间不一定是你的。\n\n顾客有问题找你，\n员工有问题找你。\n\nSupplier找你，\n银行找你，\n租金、工资、供期，\n也都在找你。\n\n你以为你是在做老板，\n其实很多时候，\n你是在替生意扛现金流。\n\n最扎心的是，\n钱有进来，不代表你有留下来。\n\n这个月看起来有赚，\n下个月一到 due date，\ncashflow 又被拉紧。\n\n你忙了一整天，\n最后不是在想怎么扩大，\n而是在想这个月怎么先顶过去。\n\n我看过不少小生意老板，\n最累的不是生意本身，\n是每一笔开销都要你自己扛。\n\n所以我常问一个问题：\n\n你是想做生意，\n还是想被生意追着跑？\n\n生意本来就有责任，\n但如果什么事都要你亲自下场，\n那你不是在经营，\n你是在为生意打工。\n\n真正重要的，\n不是把生意做大而已，\n而是先让 cashflow 稳下来，\n让团队能接手，\n让你不是每天都被钱追。\n\n你现在最卡的，\n是钱，还是时间？留言讲讲你的想法。", "tags": "jackyhooi, 老板不好当, 失去自由, 创业真相", "bait": false, "type": "Carousel", "likes": 324, "comments": 1, "er": 0.82, "followers": 39669, "date": "2026-11-09", "url": "https://www.instagram.com/p/DfhR_TED4SV/", "video": false, "ratio": 0, "score": 0.82, "status": "未处理", "x": 2.0}, {"id": "DeMhoKflqL7", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 40869, "comments": 233, "er": 0.79, "followers": 5226621, "date": "2026-10-07", "url": "https://www.instagram.com/p/DeMhoKflqL7/", "video": false, "ratio": 0, "score": 0.8, "status": "未处理", "x": 1.8}, {"id": "DecWXH6AbQQ", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Can I Use Child Support To Pay Off My Debt?", "transcript": "I am a single mom of three, ages 13, 11 and 8. I have my children 100% of the time and their dad passed away last year. So I started receiving death funds for them from their dad's social security. And so I changed jobs and careers last year as well. So I doubled my income, making around 40, $45,000 a year to bringing home close to $90,000 a year. I received close to $4,000 a month in security benefits for them. And I don't know exactly what I should do with this money if it's... It should be in your budget. It costs more than four grand a month to raise three kids. So it's your money to use for your children and you're a good mom and you're going to use it for your kids. And it's not of the good of the children's future. It's the good of the children. And so as long as you are spending the equivalent of your child support or the equivalent of your social security payments from your ex-husband's death on your children, then you are morally and ethically just fine. And I would just put the $4,000 in your budget.", "brk": "Hook类型: 痛点直击\n结构: 交代单亲负担与抚恤金 → 纠结资金用途 → 专家给出合情合理建议\n为什么火: 击中单亲家庭如何平衡债务与育儿金的道德焦虑与现实压力\n改编角度: 针对大马30-45岁丧偶或单亲打工族，探讨如何合法利用SOCSO或保险金规划家用与还清卡债", "my": "【封面：抚恤金能还债吗】\n很多人拿到钱就乱了。\n\n如果你在大马，\n突然拿到 SOCSO 或保险金，\n第一反应不是冲动还卡，\n而是先问自己一句，\n这笔钱原本是要补哪里。\n\n我讲白一点，\n这种钱，应该先放进 budget 里看。\n\n因为家里真正的压力，\n不只是卡债，\n还有孩子的奶粉，\nschool fee，\n房租，\n车贷，\n水电，\n这些都是 cashflow。\n\n你如果把这笔钱，\n一下子全丢去还一张卡，\n结果下个月家用断掉，\n那只是把问题换地方。\n\n对单亲的人来说，\n最难的不是算钱，\n是心里会内疚。\n会觉得，\n我是不是不该碰这笔钱。\n\n其实不是。\n重点不是你有没有动这笔钱，\n重点是你有没有把它用在该补的位置。\n\n如果你每月还债的压力很大，\n就先把这笔钱放进整体 budget，\n再看哪一边最卡，\n哪一边最需要先稳住。\n\n钱不是拿来吓自己的。\n钱是拿来安排生活的。\n\n如果你也在想，\n家用和债务到底该怎么分，\n留言讲讲你的情况。", "tags": "", "bait": false, "type": "Video", "likes": 3023, "comments": 67, "er": 0.76, "followers": 407114, "date": "2026-10-13", "url": "https://www.instagram.com/p/DecWXH6AbQQ/", "video": true, "ratio": 0, "score": 0.79, "status": "未处理", "x": 1.1}, {"id": "DeuCb6vmwyK", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Let's breakdown the difference between some of the different investment accounts.", "transcript": "Put your money into a high-yield savings account for any short-term savings goals that are going to happen in the next three to five years. Think emergency funds, a car fund to pay cash, or even a down payment fund. Put your money into a Roth IRA if you have earned income and you want to pay taxes now, but then never again. Tax-free growth into retirement. Put your money in a 401K if you have an employer retirement plan with a match. That is free money. Take it every time. And put your money into a brokerage account if you want to invest outside of retirement and not have to wait till 59 and a half to access that money. That could be a great bridge account or investing for the long term for anything else.", "brk": "Hook类型: 痛点直击\n结构: 短期储蓄目标 → 退休账户解析 → 长期投资账户\n为什么火: 清晰分类不同资金用途，帮观众理清复杂的理财账户选择\n改编角度: 针对马来西亚30-45岁常月光族，拆解EPF Account 1/2、ASB与私人信托基金的区别与用法", "my": "【封面：3种钱别放错】\n你把钱放错地方了。\n\n出粮后，我先看三种钱。\n\n第一种，是三到六个月会用到的。\n比如 emergency fund。\n或者你要留给车修理，孩子开学，家里突然有事。\n这笔钱，重点不是赚多少。\n是要放得稳，随时拿得到。\n\n第二种，是长期不会动的。\n像 EPF。\n这类钱是拿来慢慢长大的。\n你今天动它，短期好像松一口气，\n但你未来的压力，可能会更大。\n\n第三种，是你想放长一点的钱。\n比如 ASB，或者你自己做的长期安排。\n这种钱不是拿来救急的。\n也不是今天没现金，就先抓来用。\n\n很多人不是不会理财。\n是把救命钱，拿去做长期。\n又把长期钱，拿去顶日常开销。\n\n结果就是，户口看起来有钱，\n手头却一直紧。\n\n如果你现在也是这样，\n先把钱分清楚。\n出粮那天，先分用途，再决定放哪里。\n\n你觉得你最常把哪一种钱搞混？留言讲讲。", "tags": "", "bait": false, "type": "Video", "likes": 3196, "comments": 52, "er": 0.76, "followers": 428642, "date": "2026-10-20", "url": "https://www.instagram.com/p/DeuCb6vmwyK/", "video": true, "ratio": 0, "score": 0.78, "status": "未处理", "x": 1.1}, {"id": "DfFjHNokhd2", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"My kid is making me pay her loan\"", "transcript": "She's never showing up for Thanksgiving ever again. You won't have a relationship with your grandkids. When my husband and I cosigned our daughter's student loans, she promised us she would make the payments. The loan is due now and she refuses to pay anything on it. We recently started saving for retirement, which will be in 10 years. We've already paid 60 grand on her loans and the balance is 75 grand. We know that we should never have signed for her, but they would not allow her to sign because she had no payment history. What can my husband and I do? We've always had a wonderful relationship, but this has caused a huge wedge between us. Oh, this is brutal. And it's the number one reason I hate parent plus loans is because of the relationship killer. It's not even the financial aspect. I love my daughter too much for this to cause a wedge. Chances of her paying slim to none at this point. And if she does, she's gonna resent you forever. So this is sort of a $75,000 remaining stupid tax. It might mean you retire in 10.5 or 11 years instead of 10. And that's a hard pill to swallow, but that's what I would personally do as a parent if I was in the situation. And that's why I'm gonna take a hard stance and this is a hot take, but this is the parent's fault. Even though she's not doing something, you had a deal with a 17 year old about thousands and thousands of dollars. I find that to be a parenting issue more so than it is the 17 year old's issue who is now probably in her 20s. But it's up to them. Here's the two paths. They can pursue her and go, no, you said you would. It's only gonna hurt things. And she's never showing up for Thanksgiving ever again. You won't have a relationship with your grandkids. Is that worth $75,000 more to you? That's really what's on the line here. And for me and my house, my daughter's three. I cannot imagine losing that relationship over a mistake that I made. Yeah, you gotta preserve the relationship. But you guys will be okay. You will live to tell the tale. I hope so. Hopefully it's a warning sign for any other parent who's in that situation.", "brk": "Hook类型: 痛点直击\n结构: 倾诉困境 → 专家犀利分析 → 给出取舍方案\n为什么火: 戳中父母为子女担保背债导致家庭关系破裂的普遍痛点\n改编角度: 针对帮成年孩子做担保买车买房或借Personal Loan导致自己卡债爆雷的本地大马父母。", "my": "【封面：担保爆雷谁扛】\n你帮人担保了吗？\n\n很多大马人以为，签名只是帮一下。  \n结果一出事，变成你自己扛。\n\n我看过最常见的状况是，  \n帮孩子、帮家人、帮朋友做担保。  \n当下觉得是情分，  \n后面却变成 cashflow 的洞。\n\n表面看，payment record 可能还美美的。  \n实际上，你的户口越来越紧。  \n你想供房，想留退休钱，  \n都被这笔 commitment 卡住。\n\n你有两个选择。  \n第一，继续替别人扛，  \n你自己就得一直出血。  \n第二，认清楚这笔债，  \n把自己的现金流先救回来。\n\n我不是在怪谁。  \n我只是想讲，  \n担保之前，先问自己一句，  \n这笔钱如果回不来，  \n你扛不扛得住？\n\n如果你身边也有这种状况，留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2563, "comments": 194, "er": 0.68, "followers": 407114, "date": "2026-10-29", "url": "https://www.instagram.com/p/DfFjHNokhd2/", "video": true, "ratio": 0, "score": 0.77, "status": "未处理", "x": 1.1}, {"id": "DeCTf7ZicgZ", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Elena called into The Ramsey Show becuase her father-in-law set up a trust for their son, and they have no clue how much money is in it.", "transcript": "My father-in-law established a trust for a son when he was young, and we know very little about it, except that it's for his college education. My father-in-law is very private with his money, and he hasn't given us any details on it. My son is in 11th grade now, and he does not know about the trust, and we don't know when we should tell him about it, and also we don't know what or we should know about the trust at this point. Why did he set it up in the first place? Did he talk to you and say, hey, I'm going to set this up for college, and this was back when he was a baby? Yeah, he was two years old. He just basically told us that's what he was going to do, and we know that he did set it up, and that's all we know. So no clue how much is in it, what's even in there. Is it cash? Is it investments? We have no idea. Exactly. And if you talk to him and just said, hey, Dad, he's a junior now. We're looking at colleges. We want to make a game plan to make sure that he goes debt-free. Can you let us know what's in the trust and how we access it? He would say none of your business. I don't know if he would say that. I think it would be a very awkward conversation just because he's so private. He doesn't like to share. But he made the trust for your son. The part that worries me is that you're scared to even ask him about this. Just say, hey, we're starting to look at colleges. We know you set up a trust for his education. Can you get us a copy of the trust document? Can you tell us who the trustee is? Can you tell us if there's distribution triggers, anything we need to know as we make plans? Because if there's $10 in it, well, we got to make a plan for ourselves. And if there's a million dollars in it, that changes the type of schools we look at.", "brk": "Hook类型: 痛点直击\n结构: 交代长辈隐瞒信托基金 → 夫妻不敢询问的尴尬 → 专家建议直接沟通以规划未来\n为什么火: 戳中普通人面对长辈资产时的信息盲区与沟通焦虑，引发对子女教育金的深度担忧。\n改编角度: 针对35岁本地打工族，剖析长辈留下的教育基金或产业不敢问、不知情，导致自己月光负债却无法规划孩子升学的尴尬。", "my": "【封面：孩子升学你敢问吗】\n\n长辈的钱，你不敢问？\n很多人不是不想问。\n是怕一开口就尴尬。\n\n我看过太多本地父母。\n明明知道家里可能有教育金，\n却没人讲清楚里面有什么，\n是 cash，还是定期，还是别的安排。\n\n问题不是问不问。\n问题是你不问，\n你就没办法为孩子做 plan。\n\n尤其你自己现在还在月光，\n卡债还在滚，\n出粮后先顾生活和供期，\n最后才想到孩子明年要不要升学。\n\n如果你连这笔钱都不清楚，\n那你不是在安排未来，\n你是在靠猜。\n\n你可以很直接，\n但语气要稳。\n比如问：\n这笔教育金的 document 可以给我看吗？\n谁是 trustee？\n什么时候可以动用？\n要是现在开始准备，\n我们要怎么配合？\n\n不是要翻旧账，\n是要把孩子的路看清楚。\n\n因为如果里面只有一点点，\n你就要自己补上。\n如果里面够用，\n你们的学校选择和现金流安排，\n就会完全不一样。\n\n你觉得，家里的钱该不该讲清楚？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2633, "comments": 222, "er": 0.67, "followers": 428642, "date": "2026-10-03", "url": "https://www.instagram.com/p/DeCTf7ZicgZ/", "video": true, "ratio": 0, "score": 0.77, "status": "未处理", "x": 1.1}, {"id": "DfdeXmUzQr9", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Door to door experience will be the main difference…”\n.\nThe main experience of living in a landed home will be parking the car at the car porch and immediately getting into the house. Although we have some high rise apartments trying hard to mimic that experience but it’s just different. \n.\nThen for the other elements such as views, security, facilities, size… all are pretty much similar since we have stratafied landed homes already. But I do think it’s not really whether we prefer one over another but it depends highly on the stage of life we are in. \n.\nIf we are starting off after graduation, it’s ideal to be as close to actions and opportunities as possible. But if we start having control over our schedule, we can start moving away from the city and prioritise our family… and we of course, our financial capabilities will be a BIG factor too😅 \n.\nI can have ultra privacy and still be in the city… If I can afford Bukit Tunku or bungalows in Mont’Kiara it wouldn’t be an issue mah😂😂😂\n#p", "transcript": "Saya rasa ini dah melendak ketika dah duduk di kondor. Jadi ini adalah berkongsi apabila mereka bergerak dari Rumah Lendak di Kalklante ke Rumah Kondor. Dia berkata 3 bulan lagi. Tak tahu siapa-siapa juga. Jadi pertanyaan terakhir adalah anda suka Rumah Tinggi ke? atau Rumah Lendak? Apabila orang fikir tentang Rumah Lendak dan Hain Rai, jika ia di lokasi yang sama, tentu-tentu orang akan melendak terutamanya apabila anda ada 5 bilik. Tetapi setelah membuat dokumen ini untuk berjaya sejauh lama, perbezaan main-main di antara hidup di Kalklante akan menjadi beberapa perkara. Pertama, adalah pengalaman ke-keluarannya. Dari bilik ke-keluarannya ke bilik ke-keluarannya. Itu perbezaan main-main. Seperti sekarang, apabila anda keluar dari bilik ke-keluarannya, anda mahu pergi ke bilik ke-keluarannya. Anda perlu pergi ke bilik ke-keluarannya. Beri tinggi. Pergi ke bilik ke-keluarannya. Kemudian ke bilik ke-keluarannya. Kemudian ke bilik ke-keluarannya. Jadi banyak perhatian. Tetapi apabila anda masuk ke bilik ke-keluarannya, buka pintu, tutup pintu, buka dan lain pintu, itu rumah anda. Jadi itu pengalaman yang anda berlalu. Sudah tentu sekarang anda ada kondos yang akan membuat ke-keluarannya dengan membuat kerja di sebelah kota. Tetapi ia tetap tidak sama. Kemudian, perkara kedua akan adalah pengalaman atau bagaimana anda balik ke rumah. Dalam rumah ke-keluarannya, ke mana anda berbual, dan keadaan itu juga berlaku apabila anda ada anak atau tidak. Apabila anda ada penjara, anda perlu ambil laptop perusahaan. Anda perlu ambil lebih keras. Kemudian anda perlu mempunyai anak anda. Kemudian anda boleh mempunyai sebuah penjara yang lebih teruk. Mungkin, tapi untuk sebuah penjara, ia sangat mudah. Tetapi ultimulah, ia semua tentang kualitas hidup. Yang penting adalah kualitas hidup. Seperti ini, Kakak di sini, jika anda akan masuk ke dalam kota, pasti ada sebabnya. Lebih terutamanya, ia untuk kemungkinan kerja. Jika anda tidak perlu betul-betul mempunyai keadaan untuk membuat duit, saya akan selalu mempunyai keadaan yang sangat tinggi. Jangan membuat keadaan yang teruk, hanya untuk membuat keadaan, semua begini. Di kampung ke, di sub-urbs ke, tidak ada masalah. Dan kualitas hidup anda akan lebih baik. Itu akan berkawasan yang penting. Tetapi, ia juga sebuah keadaan hidup. Maksudnya, apabila anda mulakan selepas keadaan, anda perlu berada di kota, pertama keadaan kerja anda. Tetapi apabila anda dapat keadaan, anda akan membuat duit anda. Kemudian anda akan memulai hidup. Kemudian hanya anda boleh balik. Tetapi, saya tidak fikir banyak orang boleh menghidupkan keadaan yang teruk. Setiap hari, anda akan melalui hidup yang teruk. Sudah sebabnya, saya akan meminta anda bergerak. Sangat marah. Selama pagi, minum kopi, dengar keadaan. Tiga hari, okeylah. Tapi sepanjang tahun, tidak ada masalah yang lebih baik untuk dibuat. Ya.", "brk": "", "my": "【封面：月光还是有钱】\n很多人不是没钱，是现金流卡死了。\n\n你以为最贵的是供车、供房。\n其实最贵的是，钱进来那一刻，就被分光了。\n\n我看过很多打工族。\n出粮那天，钱先去还卡。\n再去供 installment。\n再去给家用。\n最后剩下的，才是你自己的生活费。\n\n表面看起来 payment record 美美的。\n手头上的现金，却越来越少。\n\n这就像住 condo 还是住 landed。\n不是面子问题。\n是你每天进出钱的体验，差很多。\n\n有些人一出粮，户口就像过路站。\n有些人一出粮，还有 breathing room。\n可以留一点 cashflow，遇到事不会马上 kaw。\n\n所以我一直讲，先看你的人生阶段。\n如果你还在拼收入、拼工作机会，现金流比排场重要。\n如果你已经有稳定节奏，再慢慢考虑更大的 commitment。\n\n钱这东西，不是看你住哪里。\n是看你每个月还能不能呼吸。\n\n你现在最缺的是面子，还是现金流？\n留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1145, "comments": 13, "er": 0.72, "followers": 160588, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfdeXmUzQr9/", "video": true, "ratio": 0, "score": 0.74, "status": "未处理", "x": 1.0}, {"id": "De0Z654zqpz", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Out of so many location, they pick Malacca??!”\n.\nFrom a property value appreciation point of view, that state is one of the last in Malaysia. Surprisingly Perlis is doing way better at about 7.1 % yoy increase. On top of that, there has been too many abandoned seafront project that really affected the confidence of investors there. \n.\nBut not everyone choose to understand everything in detail before they buy. Mainly I think it’s because our property prices are too dirt cheap compared to theirs. Even if it’s a mistake or the wrong project, it’s not gonna hurt their finances at all. \n.\nBut in other main cities such as KL, Penang and JB, the amount of foreigners buying properties are significantly picking up. Mainly it’s because of our private education system, low living expenses, and freehold land. Malaysia is one of the rare countries that allow foreign ownership on freehold land😱\n#property #investment #realestate", "transcript": "Biar jika sekarang, Mario jenis. Kamu mahu beli 3 barang, 2 barang, 3 barang. Terdapat 2 barang. Bersihkan perang. Sekarang, hanya 600 dolar. Pertia. Okey, jadi ini adalah... ...pembuatan yang sangat terkenal. Tapi kemudian, dia telah... ...bergerakkan keadaan Malaysia. Di luar banyak tempat yang dapat gerakkan, mereka gerakkan Melaka. Saya tak tahu, man. Dia bercakap tentang... ...berapa tepat... ...pembuatan kita adalah... ...3 barang, 2 barang, 2 barang... ...dan ia seperti 6x1 Tai Pi. Jadi, ia adalah 7,000 dolar. Ini adalah projek yang saya melihat. Dan mereka bercakap tentang... ...pembuatan kapital. Bercakap tentang... ...berapa turisme akan menjadi... ...katalistik untuk api beri... ...dia ada banyak orang Cina. Makanan baik. Tidak ada Tahu. Tidak ada... ...pembuatan. Sebenarnya, ia ada. Kemudian, internasionalnya... ...dia sangat terkenal. Tapi, awak tahu Melaka adalah... ...kecuali keadaan terbaik di Malaysia. Ia sangat terkenal. Jadi, kadang-kadang saya belajar... ...berapa menikmati... ...pembuatan dari orang-orang. Macam mana mereka memakai... ...pembuatan Malaysia. Saya ingin dengar. Wah! Kemudian, kami semua bergantung. Kami semua mempunyai... ...pembuatan kapital 30%... ...dan dan dan dan... ...dan dan... ...dan MOT, dan SPA, dan... ...dan kebanyakan, dan dan pembunyi. Dan apa-apa pun. Mesti ada pembunyi sejauh ini. Sebenarnya, saya boleh fikir... ...yang itu bagus. Untuk itu, saya perlu meletakkan... ...pembuatan kapital dan mendidikan. Dan sedikit lagi. Kami sangat berat. Jadi, saya tidak tahu apa yang terjadi... ...sebaiknya mereka dapat... ...pembuatan untuk melakukan ini. Tapi, ia bagus. Jadi, sekarang, pengguna juga... ...pembuatan banyak... ...Belakar. Dan ada banyak keadaan sebenar. Beri keadaan di Melaka. Pembuatan di China yang saya tidak tahu. Ya. Jadi, keadaan saya adalah... ...pembuatan. Kita perlu... ...mencari keadaan ini. Kerana apa yang kita fikir... ...tidak bergantung... ...sebenarnya... ...menuju... ...pembuatan lain. Pembuatan kita berpura-pura... ...sebenarnya 12 kali lebih... ...sebaiknya di Taipei. Atau 15 kali lebih. Saya tidak tahu. Saya tidak tahu apa yang terjadi. Tapi kemudian, di sisi lain... ...itu... ...pengguna dari Taiwan. Jika anda mencari ini. Ada banyak tempat lain... ...yang anda dapat lihat. J.B.... ...membuat... ...sebenarnya... ...baiknya... ...Pinang... ...KK. Di KL. Di KL Clang Verde... ...ada banyak... ...pilihan. Tapi, yang anda mempunyai di Melaka... ...saya tidak teruk. Yang itu adalah... ...projek kawan saya. Berhenti. Saya tidak akan membuat nama. Sebenarnya, ia akan menjadi terlalu jelas. Tapi... ...welcome ke Malaysia. Saya rasa... ...kita perlukan lebih banyak FDI. Saya rasa...", "brk": "Hook类型: 痛点直击\n结构: 提出现象 → 分析原因 → 给出建议\n为什么火: 戳中大众对热门投资现象的盲目跟风与信息差\n改编角度: 针对马来西亚30-45岁月光打工族，揭秘外资炒房如何推高本地房价，教你如何在KL和槟城避开烂尾楼陷阱存下第一桶金", "my": "【封面：外资炒房，关你啥事】\n你以为房价只跟房子有关？\n\n其实最先被挤压的，是本地人的 cashflow。\n\n当外国人看的是地段、学区、未来升值，\n我们很多人看的是：\n每个月供得起吗，\n三成 downpayment 凑得到吗，\n还有后面那堆 commitment。\n\n问题不是你想不想买，\n而是你一旦冲动上车，\n手头现金会不会直接变薄。\n\n我看得最多的，不是买错房，\n而是明明已经月光，\n还硬要把自己绑进长期供期。\n\n先看自己的 budget，\n再看你的 due date，\n最后才决定要不要签。\n\n因为房子不会先救你的生活，\n它只会放大你本来就有的现金流问题。\n\n你身边有这种压力吗？留言讲讲你的想法。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 1085, "comments": 33, "er": 0.7, "followers": 160588, "date": "2026-10-23", "url": "https://www.instagram.com/p/De0Z654zqpz/", "video": true, "ratio": 0, "score": 0.74, "status": "未处理", "x": 1.0}, {"id": "DekExOqmnY9", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "I Stole From My Employer And Got Arrested.", "transcript": "I am about $70,000 in debt and I just don't know how to get out of it. What kind of debt is it? Credit card debt and medical debt. How much is credit card? AMEX is $4,300 and Capital One is $6,800 and then I owe on my car $25,000. How much do you make a year? How much do you make a year? I make about $2,200 a month. I lost my job in January of 2024. I stole from my employer. I was fired, I was arrested and everything's just gone downhill since then. I was making about $53,000. What are you doing now for work? I work for a grocery store. How many hours a week are you working? It's 40 hours. Okay. Were you convicted of a felony? It was dismissed. I have a license to Silver Hill estate but I'm a new agent. I can't make any money in it so that's why I'm still at the grocery store. What is your car worth? Probably worth $37,000 or $38,000. And you owe $25,000? I owe $25,000. How are you paying that bill with all this other stuff going on? I make it work. Yeah. That car needs to be sold. Yeah, sell that car. I work by a car for cash with a difference. For sure. The rest of your situation is all career oriented and so it's a matter of lining yourself up with some kind of a career whether it's real estate or whether it's something else. I don't care where your income goes up because you're worth twice what you're being paid in the marketplace. You have proven that in the past. You made a mistake, you paid for it, you went through all the hell associated with it. You lost your job. And now you get a restart. As a pastor friend of mine says you're not defined by the worst thing you ever did. Thank goodness none of us are. It's a part of my story. I have a scar. I have a mark. I feel some shame from it, but it's not who I am. You don't have to live in the prison of working for half of what you're worth in the marketplace because of a past mistake. So we're going to send you a copy of Finding the Work You're Wired to Do. It's got an assessment in it. I want you to take that. I want you to sit and do some time in prayer about what you're supposed to be 10 years from now and get the car sold.", "brk": "Hook类型: 痛点直击与身份共鸣\n结构: 交代负债与犯罪黑历史 → 专家指出资产过重核心问题 → 给出卖车与重启职业建议\n为什么火: 真实的高额负债与戏剧性人生低谷极具猎奇感，且触及绝望中的救赎心理\n改编角度: 针对35岁月光打工族负债卡债压顶，剖析大马车贷负担与转型副业自救方案", "my": "【封面：车供压垮现金流】\n你车供太重了。\n\n我见过很多人，\n表面上有车开，\n其实每个月都在帮车打工。\n\n问题不是你懒，\n是你的 cashflow 被锁死了。\n\n车还在供，\n卡还在滚，\n出粮一到，\n钱就先流走。\n\n有些人以为，\n车是资产。\n但如果它每个月，\n吞掉你太多现金，\n它就变成负担。\n\n重点不是你有没有车，\n是你供得起吗，\n供完还剩多少生活费。\n\n如果你现在也是这样，\n先算清楚你的 commitment，\n再看要不要继续扛。\n\n有时候，\n真正该处理的，\n不是你的人生，\n是那台一直吃现金的车。\n\n如果你想我帮你看，\n你现在的 cashflow 到底卡在哪里，\n可以私讯我讲讲你的情况。", "tags": "", "bait": false, "type": "Video", "likes": 2868, "comments": 26, "er": 0.71, "followers": 407114, "date": "2026-10-16", "url": "https://www.instagram.com/p/DekExOqmnY9/", "video": true, "ratio": 0, "score": 0.72, "status": "未处理", "x": 1.0}, {"id": "DeyVQ2mTpqL", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Wah… collect rent is tiring ya know?!”\n.\nHahahahahahahaha. I think this unker kena flex pun tak tau😬\n.\nBut imagine investing 20-30 years ago, cashing out today when we are older would actually be the actual strategy. The loans most likely would be settled. And just assuming each property is RM300k, there will be RM3 mil in cash!! \n.\nIn this extremely fast pace world, the idea of being wealth 20-30 years later is just ridiculous. But I think it’s still the most direct, the easiest method in my opinion. I’m not good with charts, trends, volume transition from alternative securities… As long as rent can cover installment, I invest😬\n.\n#property #investment #realestate", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 吐槽收租累 → 分享20年房产布局 → 总结以租养贷逻辑\n为什么火: 用反向炫耀引发职场人对长期资产配置的憧憬\n改编角度: 针对大马30-45岁打工族，算一笔20年EPF加房产养老账，戳破月光族焦虑", "my": "【封面：月光族别想远】\n现在还讲养老？\n你看别人讲 20 年后的房产，听起来很威风。\n但对很多打工族来说，问题根本不是 20 年后。\n是这个月出粮后，钱先去哪里。\n\n你每天供房、供车、给家用，\n再加卡债、生活费，\ncashflow 一紧，\n连 EPF 多少都不敢认真看。\n\n我不是叫你不要想长远。\n我是说，先把今天的现金流顾好。\n不然你一边想未来，\n一边每个月都在靠 min pay 顶着，\n表面 payment record 美美的，\n手头上的现金却越来越少。\n\n长期规划当然重要，\n但前提是你现在没有被供期压到喘不过气。\n\n只有在承担责任中，我们才能真正掌握理财的智慧。", "tags": "property, investment, realestate", "bait": false, "type": "Image", "likes": 1015, "comments": 35, "er": 0.65, "followers": 160588, "date": "2026-10-22", "url": "https://www.instagram.com/p/DeyVQ2mTpqL/", "video": false, "ratio": 0, "score": 0.7, "status": "未处理", "x": 0.9}, {"id": "De90ucnkkST", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"My husband wants me to cancel my life insurance policy on my ex\"", "transcript": "We have a situation, my husband and I need some guidance on. I was married before. I've been divorced for about eight years now. In my first marriage, I took out a life insurance policy on me and one on my ex-husband. After the divorce, I kept the life insurance policy on both me and him because he was paying child support. My new husband, he says it feels weird to pay life insurance on my ex-husband, but then on the other hand, I wanna make sure my kids are taken care of because we have a set of 14-year-old twin boys who are about to go into high school. We're staring down college. There's just so much going on at this stage in life. I wanna make sure something more to happen that they're taking care of. I can see two sides of it. Obviously the purpose of insurance is to replace income that's necessity. So before you were married, he was part of the income situation. And then even as an ex, maybe he was paying child support or alimony, that sort of thing. At this point, now you're married to somebody else. There's kind of a new situation going on financially. The only piece of this that I could see a connection to is the kids. If your ex-husband was saying, hey, this is kind of an inheritance thing. When something happens to me, I want the kids to have this money. That piece I can totally understand and them being the beneficiary of that makes sense to me if that's something that he wants to do from a legacy perspective. Well, the main distinction is you are not hanging onto this policy to hang onto the past. You're hanging onto it to protect your kids' futures. So until they are independent on their own, they're through college, they're working. Okay, now they're fine. But right now the truth is, you might not be able to afford college and support them. And so part of having kids is, it's your obligation to support them. I would keep it for that reason and it really has nothing to do with the new husband.", "brk": "Hook类型: 痛点直击\n结构: 抛出家庭矛盾 → 分析两难困境 → 给出专家裁决\n为什么夫: 切中重组家庭的敏感利益与子女保障冲突，引发强烈讨论\n改编角度: 针对马来西亚30-45岁月光族成家后，面对父母赡养与孩子教育费的钱不够用矛盾，给出财务规划建议。", "my": "【封面：养家后更缺钱？】\n你不是一个人卡住。\n很多人结了婚，\n钱反而更难分。\n\n一边是孩子学费，\n一边是父母家用，\n另一边还有房租、车供、卡债。\n每一笔都像在抢你的现金流。\n\n问题不是你不够努力，\n是你开始背的 commitment 太多了。\n\n很多人最常见的错，\n就是出粮那天先顾面子，\n先给家里，\n先还最急的卡，\n最后自己的 budget 一点都没留。\n\n这样看起来很负责，\n其实很容易把自己逼到月光。\n\n我看钱时，\n我只看一件事。\n你现在每个月的现金流，\n够不够撑住你真正要负责的人。\n\n如果不够，\n先排顺序，\n先保住必要开销，\n再看哪些债可以慢慢整理。\n\n因为钱一乱，\n不是你一个人累，\n是整個家都跟着紧。\n\n你觉得成家后最难分的是哪一笔？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 2505, "comments": 114, "er": 0.64, "followers": 407114, "date": "2026-10-26", "url": "https://www.instagram.com/p/De90ucnkkST/", "video": true, "ratio": 0, "score": 0.7, "status": "未处理", "x": 1.0}, {"id": "DfIIKuiADAd", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "I'll be in the pantry looking for something until further notice.", "transcript": "You should take 4B and think before your people will escape or pee When the pimps in the crib, don't drop it like it's hot, drop it", "brk": "Hook类型: 痛点直击\n结构: 办公室崩溃情境 → 幽默夸张逃避 → 引发共鸣吐槽\n为什么火: 用幽默解构职场压力，精准触达打工人的精神崩溃瞬间\n改编角度: 针对马来西亚30-45岁月光族打工人，吐槽百物涨价、卡债还清遥遥无期的办公室绝望瞬间", "my": "【封面：月光族的办公室崩溃】\n你有没有在办公室，突然想躲起来？\n\n不是因为偷懒。\n是因为你打开 bank app 那一刻，\n看到工资进来，\n又像消失一样快。\n\n账单、卡数、家用，\n每一样都在等你。\n人还坐在 office，\n心已经跑去 pantry 了。\n\n很多打工族不是不会赚，\n是每个月都被 cashflow 卡住。\n表面看起来还在上班，\n其实脑子一直在算，\n这次出粮，够不够顶到下次。\n\n我见过最常见的情况就是，\n薪水一进来，\n先被 commitment 吃掉一大截，\n剩下的，\n才轮到生活。\n\n如果你也是这种感觉，\n你不是一个人。\n你觉得你是没钱，\n很多时候其实是钱的流向，\n你从来没有真正看清楚。\n\n你身边有没有这种时刻？\n留言讲讲。", "tags": "", "bait": false, "type": "Video", "likes": 2717, "comments": 93, "er": 0.66, "followers": 428642, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfIIKuiADAd/", "video": true, "ratio": 0, "score": 0.7, "status": "未处理", "x": 1.0}, {"id": "DfKbcxiDDJn", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "By far the spookiest thing you'll see today 🎃", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 2598, "comments": 117, "er": 0.63, "followers": 428642, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfKbcxiDDJn/", "video": false, "ratio": 0, "score": 0.69, "status": "未处理", "x": 1.0}, {"id": "DfR1Pwujyib", "tracker": "FINANCE 竞对", "competitor": "jackyhooi", "caption": "有钱人和普通人，\n对钱的看法有一个很明显的差别，\n就是他们看待回报的时间长度。\n\n有钱人并不是对钱没有兴趣。\n相反，他们同样很在意钱。\n\n只是他们可能愿意用更长远的眼光，\n去思考赚钱这件事。\n\n有时候短期内，可以少赚一点甚至亏一点。\n\n但如果这个决定能够帮助他：\n建立品牌、扩大市场、培养团队、在未来赚到更多钱，\n他愿意考虑牺牲眼前的利益。\n\n因为他看的不只是今天能赚多少，\n而是这件事未来能够带来什么。\n\n可是对于经济压力比较大的人来说，\n情况可能完全不一样。\n\n他今天需要赚钱，这个星期需要赚钱，\n这个月需要收入，甚至今年就必须看到成果。\n\n因为生活开销不会等你，\n账单也不会因为你有一个很好的长期计划就暂停。\n\n有时候他不是不想看长远，\n而是现实不允许他等待那么久。\n\n这也是为什么同样一个赚钱机会，\n不同的人可能会做出完全不一样的决定。\n\n一个人可能会考虑三年后的回报，\n另一个人可能必须先考虑下个月的现金流。\n\n但我觉得，这两种思考都不是绝对错误的。\n\n短期收入可以让你维持生活，\n长期布局则有机会让你创造更大的价值。\n\n长期思考不代表所有短期亏损都是值得的。\n你还是需要评估风险，\n以及自己有没有能力承担。\n\n下次当你做一个赚钱的决定时，除了问自己：\n\n「这件事现在可以赚多少钱？」\n\n也可以多问一句：\n\n「如果我持续做这件事，三年、五年后，它又能为我带来什么？」\n\n因为有时候真正影响一个人赚钱方式的，\n不只是他想赚多少钱。\n\n而是他能够看多远，以及他有没有条件等待那个回报。\n\n#jackyhooi #有钱人 #普通人 #富人思维 #差别在哪里", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 贫富思维差异 → 现实无奈解释 → 辩证看待两者 → 长期视角引导\n为什么火: 精准指出穷人不是不想看长远而是被现实所迫，引发强烈共鸣\n改编角度: 结合大马30-45岁打工族卡债与小生意老板现金流压力，谈如何打破月光困局并布局未来", "my": "【封面：月光不是你懒】\n有钱人跟月光族，\n看钱的时间不一样。\n\n不是谁不想看远，\n是现金流不允许。\n\n有些人做决定，\n先看三年后值不值。\n因为他今天没那么缺钱，\n也不怕这个月卡住。\n\n但很多本地打工族，\n这个星期要付卡，\n这个月要还供，\n还要留给家用和杂费。\n\n你不是不想规划，\n是账单不会等你想好。\n\n所以同一个机会，\n有人敢慢慢布局，\n有人只能先顾眼前。\n\n我觉得这两种想法，\n都不是错。\n\n短期 cashflow 很重要，\n长期规划也重要。\n\n问题不是你只看今天，\n而是你有没有空间，\n去想明年的自己。\n\n下次你做钱的决定，\n先问自己一句：\n\n这件事只是今天好过，\n还是三年后也有帮助？\n\n你现在最常卡住的，\n是月光，还是卡债？", "tags": "jackyhooi, 有钱人, 普通人, 富人思维, 差别在哪里", "bait": false, "type": "Carousel", "likes": 270, "comments": 0, "er": 0.68, "followers": 39669, "date": "2026-11-03", "url": "https://www.instagram.com/p/DfR1Pwujyib/", "video": false, "ratio": 0, "score": 0.68, "status": "未处理", "x": 1.6}, {"id": "Dee7LMciK0R", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "Dave and George on The Ramsey Show talk about what insutries are keeping you broke.", "transcript": "If you find yourself with a low income and no money, the way out of the situation is not borrowing money to buy things. That will nail your feet to the floor and you will not be able to move. And that's why payday lenders, pawn shops, rent to own, and tote the note lots are in the poor end of town. They're not in the rich end of town because they oppress, they take advantage of people with low incomes who feel trapped and desperate. I have been broke, I've never been poor, poor as a state of mind. Poor as I'm trapped and there's no way out, so I'm forced to rent my washer and dryer at the rent all place. Or I'm going to borrow money at 800% interest at a payday lender because it feels like I'm trapped and I'm grabbing for anything that I can get a hold of to  number🤯 \n#property #investment #realestate", "transcript": "liers of his beautiful journey the darkness of hell", "brk": "Hook类型: 痛点直击\n结构: 震撼见闻 → 行业对比 → 认知升级\n为什么火: 利用跨境差异制造视觉与认知冲击，激发观众对专业度的向往。\n改编角度: 结合大马30-45岁打工族常月光、欠卡债现状，揭秘新加坡高薪背后或本地人如何靠房产理财翻盘。", "my": "【封面：高薪不等于有钱】\n你以为高薪就有钱？\n我见过不少本地打工族，薪水不低，月底还是空。\n不是他们不会赚，是钱一进来就被供期、卡债、家用切碎。\n最可怕的不是月光，\n是你看起来很忙，\n其实 cashflow 一直在漏。\n很多人只看工资单，\n不看每个月真正剩多少。\n薪水高，\n不代表财务状态健康。\n真正要看的，是你出粮后，\n还能不能留住现金。\n如果你也想知道自己的钱漏在哪里，留言讲讲你的情况。", "tags": "property, investment, realestate", "bait": false, "type": "Video", "likes": 727, "comments": 24, "er": 0.47, "followers": 160588, "date": "2026-11-08", "url": "https://www.instagram.com/p/DfeTEDFT4l9/", "video": true, "ratio": 0, "score": 0.5, "status": "未处理", "x": 0.7}, {"id": "DfPoh9yFT9q", "tracker": "FINANCE 竞对", "competitor": "ramit", "caption": "Almost everyone thinks they’re middle class. Even a family earning $500,000–$750,000 a year.\n\nThat’s because class isn’t just about income. It shows up in how we plan ahead, how we feel about debt, how often we eat out, and what we think counts as “splurging.”\n\nMost of those habits aren’t choices we made. We picked them up growing up, and they keep making money decisions for us until we notice them.\n\nThat’s why money is never just about a budget.\n\nWhat would you add to my list? Tell me in the comments.\n\nIf you want more of the money conversations nobody else is having, comment INSIDERS and I’ll send you my free Rich Life Insiders newsletter.", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 抛出阶层错觉 → 揭示消费习惯根源 → 总结理财不仅是预算\n为什么火: 精准戳中大众对阶层与消费观的认知盲区引发强烈共鸣\n改编角度: 戳破大马30-45岁打工族月光和店面老板陷入债务循环的童年金钱观盲点", "my": "【封面：月光不是收入低】\n很多人月光，不是没钱。\n\n是你以为自己在控制钱，\n其实是钱在控制你。\n\n你花钱的方式，\n很多不是现在学的，\n是小时候看大人怎么用钱，\n你就这样照着来。\n\n有些人一出粮先吃，\n先买，先刷卡，\n先觉得自己 deserve 一点奖励。\n\n有些小老板也是这样，\n生意一有进账，\n先补洞，先周转，\n最后自己口袋空空。\n\n所以问题从来不只是 budget。\n\n更深的是，\n你怎么定义“可以花”。\n你怎么面对 debt。\n你会不会先想 cashflow，\n还是先看爽不爽。\n\n你身边有没有这种情况？\n留言讲讲你的想法。", "tags": "", "bait": true, "type": "Carousel", "likes": 4438, "comments": 163, "er": 0.47, "followers": 987182, "date": "2026-11-02", "url": "https://www.instagram.com/p/DfPoh9yFT9q/", "video": false, "ratio": 0, "score": 0.5, "status": "未处理", "x": 2.9}, {"id": "DfnJA-0Ifvc", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "\"Am I enabling my mom?\"", "transcript": "just cut to the chase. My wife and I, we bought a home down here in Florida. My mom basically has joked around and been like, well, I'm just going to die with that. I'm not really worried about paying off my debt. I'll just come down there and live with you guys. And at first I was like, oh, that's really funny. But now she's like being kind of serious about it. And my wife, we've talked about it a lot. And she's been like, I think maybe you should be a little more understanding. And it's not going to be that bad if she did want to end up living with us. We have a two and a half year old little girl at home. And I guess I'm trying to figure out my question is, am I being not understanding enough? Am I being too stubborn or hard headed by not being open to this sort of thing? Not at all. I want you to be honest with yourself. And here's what I mean by that. There's the money part and there's the debt part, right? But you know, this is your mom. You've been with her longer than your wife has. You know what her moving in would mean for the temperature and the electricity and the angst and the whatever else in your household. Some people let their mom move in and it would be the greatest thing ever because they would do on your two year old, you and your wife would have date nights whenever you're home. It would be awesome. And also there's mothers and fathers who would move in and they would think that you're seven again and they're going to tell you what you're going to do and when you're going to do it and why aren't you doing it like this? Well, your job is to take care of them and cook for them and provide for every one of their needs. While they continue to be irresponsible with any number of things. So you know the true total costs. Financially, yes. Relationally, the impact on your marriage. And so you know the full picture there. So be honest with yourself about that. The other thing I think that's kind of haunting you that you can just cut to the chase. I would, next time your mom's in town, I would take her out for coffee and say, mom are you officially asking to move in with us? Because right now there's a lot of ambiguity and you're starting to create stories about what she means and what she says and how she's saying it.", "brk": "Hook类型: 痛点直击\n结构: 抛出父母打算靠儿女养老的困扰 → 专家分析情感与现实成本 → 给出主动沟通打破暧昧的解法\n为什么火: 直面长辈把退休理财压力转嫁给子女的敏感家庭矛盾，引发强烈共鸣\n改编角度: 针对月光族打工仔，谈父母退休没钱要跟你住、加重你房贷和卡债负担时如何划清界限", "my": "【封面：爸妈搬来住？】\n先别急着答应。\n你以为是亲情。\n其实是现金流。\n\n很多人一听父母要来住，\n第一反应是孝顺。\n但你要算的，\n不只是房租。\n\n还有水电，\n还有伙食，\n还有你家里那点本来就紧的 budget。\n如果你自己已经有房贷，\n还有卡债，\n再多一个人住进来，\n你的压力不是多一点，\n是整盘都变了。\n\n更现实的是，\n有些长辈不是来“住一下”。\n是住进来之后，\n你的生活节奏、\n你跟另一半的空间、\n你每天的情绪，\n全部一起被影响。\n\n所以这题不要靠感觉。\n你要先问清楚。\n是短住？\n还是长期？\n会不会一起分担开销？\n会不会影响你现在的 commitment？\n\n讲白一点，\n这不是你不孝。\n是你要先看清 total cost。\n钱的成本，\n关系的成本，\n还有你自己的 mental load。\n\n如果你现在也卡在这种家庭和钱的拉扯，\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 1906, "comments": 45, "er": 0.48, "followers": 407114, "date": "2026-11-11", "url": "https://www.instagram.com/p/DfnJA-0Ifvc/", "video": true, "ratio": 0, "score": 0.5, "status": "未处理", "x": 0.7}, {"id": "Ddt3A4pkRhQ", "tracker": "FINANCE 竞对", "competitor": "the.ramseyshow", "caption": "My parents fell for a ponzi scheme and lost $200,000.", "transcript": "Recently, my parents got scammed out of a lot of money, a couple hundred thousand dollars of their savings. No way to get it back. My wife and I, we've been extremely blessed. We make about $55,000 a month. We have a home in Arizona that we owe $180,000 on. We've been paying it off quickly. And we have offered to let my parents stay at that home in Arizona. My parents are currently livi
