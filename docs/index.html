<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FINANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>FINANCE<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

ything invested at that assumed 10% until 40? Potentially 4 million ringgit each without adding another ringgit after 21. I know, being able to do this is a privilege. Start with what you can afford and I will teach them how to manage it too. Because I want to give them more than money. I want them to grow up with choices. Cheers, bye bye. Bye bye.", "brk": "Hook类型: 身份共鸣\n结构: 晒双胞胎资产 → 拆解理财组合 → 给出复利愿景\n为什么火: 晒出婴儿巨款与精细化财商规划形成降维反差\n改编角度: 针对马来西亚30-45岁月光打工族，晒出帮孩子或自己买SSPN和美股的方案，强调避税与摆脱中年月光。", "my": "【封面：孩子钱怎么放】\n你连自己都月光，\n还在想孩子教育金？\n\n我先讲真话。\n很多人一听到教育金，\n脑海里就只剩一个字，\n贵。\n\n但真正的问题不是贵，\n是你有没有先把现金流理顺。\n\n如果你每个月都在还卡，\n出粮就见底，\n那你不是不会存，\n是根本没有空间存。\n\n我会先做两件事。\n\n第一，\n先把每月预算切出来。\n哪怕只是 RM100，\n也先固定放一边，\n不要等有剩才存。\n\n第二，\n如果是给孩子准备，\n我会先看风险低、纪律强的方式。\n不是追求快，\n是先求你供得住，\n不会一紧张就停掉。\n\n很多人以为，\n给孩子留最多钱，\n就是负责。\n其实更重要的，\n是你自己先别把现金流弄到很紧。\n\n不然孩子还没长大，\n你先被账单追到喘不过气。\n\n我常讲，\n钱不是只看数字，\n是看你能不能长期扛得住。\n\n你现在是想存教育金，\n还是先把自己的 cashflow 整好？\n留言讲讲你的想法。", "tags": "financialliteracy, investing", "bait": false, "type": "Video", "likes": 10431, "comments": 110, "er": 11.15, "followers": 94544, "date": "2026-10-17", "url": "https://www.instagram.com/p/DelG-2KBkJq/", "video": true, "ratio": 0, "score": 11.38, "status": "未处理", "x": 2.1}, {"id": "DdqavNhhETj", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Ever gotten a missed call from a country code you’ve never seen before? 🚨\n\nThat one ring that suddenly cuts off isn’t after your bank details. It’s after something way more clever, and the entire scam is designed to work on curiosity alone. It costs Malaysians and people worldwide billions every year.\n\n#scamcall #scamawareness #phonescam #malaysia #fyp", "transcript": "Kamu pernah melihat kota misk dari kota negara yang kamu tak pernah lihat sebelumnya? Kamu akan memikirkan dan kemudian ia berhenti-hentikan. Sekarang, orang lain tak mahu bercakap dengan kamu. Dia hanya mahu kamu bawa balik. Itu adalah kebanyakan yang tersebut. Jadi biar saya jelaskan kepada kamu bagaimana ia berlaku. Sekarang, setiap kali kamu bawa ke negara lain, Yourtelko mempunyai perusahaan telefon di sisi lain untuk setiap minit kamu berhenti-hentikan. Dan itu adalah apa yang kamu bawa sebagai termination rate. Untuk tempat normal, ia selalu sangat berharga. Selkom's DJs sendiri berhenti-hentikan Singapore pada 1 ringgit dan 44 ringgit semenilai. Tapi beberapa kebanyakan adalah di sebuah tinggi. Somalia adalah 4 ringgit semenilai. Newway adalah 15 ringgit dan 40 ringgit. Dan Diego Garcia adalah 26 ringgit semenilai. Yang sejujurnya sangat kecewa. Sekarang, di mana ia dapat menarik. Ada sebuah industri yang sebenarnya menerima kamu sebuah panggilan di satu dari tempat yang terlalu tepat. Kemudian, bayar kamu berhenti-hentikan untuk semua orang yang menyebabkan. Setiap kebanyakan ini dapat kamu sebenarnya menerima di online dan menerima panggilan ini dalam 15 minit. Dan beberapa mereka pun memberikan diri untuk kamu untuk panggilan auto untuk bernasib. Jadi panggilan tidak menghukum apa-apa saja. Dia hanya menangis sebuah nombor, mencari robot untuk menghukumkan jenis panggilan jenis panggilan sepanjang-jenis dan menunggu untuk panggilan yang menyebabkan. Sebenarnya, itu adalah sebuah 11 juta US dollar semasa. Dan ini adalah satu lagi nasti. Apabila kamu menghukumkan, panggilan yang kamu dengar mungkin hanya menjadi rekod. Kamu mungkin sudah menjawab dan kamu sudah menjadi reka. Ia pun ada nama. Ia disebut sebagai keputusan kekansi. Jadi sebenarnya, ia bukan bukan kamu yang bergalliba. Tidak ada polis yang tak berat, tak ada OTP, tiada apa-apa untuk dikeluarkan. Tidak pernah dihukumkan. Jika ia seorang benar, mereka akan menyebabkan kamu. Mereka perlu kamu percaya sesuatu. Yang ini hanya perlu kamu menyebabkan. Selamat tinggal.", "brk": "Hook类型: 痛点直击\n结构: 陌生来电现象 → 揭秘跨国电话诈骗机制 → 给出防范建议\n为什么火: 戳中大众频繁接到海外诈骗电话的日常困扰，揭秘冷门骗局满足好奇心。\n改编角度: 针对本地30-45岁常接境外诈骗电话的打工族，揭秘打回去即中招的高额国际漫游陷阱。", "my": "【封面：陌生来电别回】\n你有接过这种电话吗？\n\n一响就挂，\n号码还很陌生。\n\n很多人第一反应，\n就是回拨过去，\n或者看一下是谁。\n\n问题就在这里，\n对方要的不是你接 mily", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 家庭温情开头 → 引出家人感悟 → 升华生活哲理\n为什么火: 利用素食家庭的温情话题引发情感共鸣与点赞\n改编角度: 结合30-45岁大马华人上有老下有小的经济压力，从家人付出引出中年理财规划。", "my": "【封面：家人省钱的狠招】\n有人越省越有钱。\n我不知道是不是每个家人都这样。\n但我知道，最会管钱的人，\n通常不是最会赚的那一个。\n而是那个真的会看 cashflow 的人。\n\n很多打工族出粮那天，\n钱像过路一样。\n薪水一进来，\n卡、供期、家用、饭钱，\n一下就散了。\n\n你以为是赚太少，\n很多时候是花得太快。\n不是你不努力，\n是你没有先分好钱的去处。\n\n我看过最实在的理财智慧，\n不是讲什么高深投资。\n是先把 min pay、生活费、储蓄，\n分清楚先后。\n\n因为钱一乱，\n人就会一直觉得紧，\n越紧越想刷，\n越刷越没有余地。\n\n其实欠卡一点都不可耻，\n可怕的是明明已经很吃紧，\n还继续用旧习惯过日子。\n\n只有在承担责任中，\n我们才能真正掌握理财的智慧。\n\n你家里有没有那种很会算账的人？", "tags": "family", "bait": false, "type": "Carousel", "likes": 8352, "comments": 100, "er": 8.94, "followers": 94544, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfJMgWxmvuO/", "video": false, "ratio": 0, "score": 9.15, "status": "未处理", "x": 1.7}, {"id": "Dec9K8jT5SX", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "5 signs you’re actually doing better than most Malaysians financially, even if it doesn’t feel like it 💰\n\nIf you can tick off even a few of these, trust me, you’re way ahead of the curve. Most Malaysians are quietly struggling with the exact opposite.\n\nComment “roti” and I’ll send you my net worth tracker spreadsheet 📊\n\n#personalfinance #moneytips #financialliteracy #malaysia", "transcript": "Ini adalah 5 perjalanan yang anda sebenarnya melakukan lebih baik daripada terdapat mulai yang lebih banyak, walaupun jika ia tidak berlaku begitu. Pertama, anda mempunyai lebih kurang daripada yang anda membuat. Seluruh Bank Negara, kemahiran pengalaman dan perjalanan hanya 37% dari mulai dapat menyelamatkan lebih daripada 3 bulan tanpa income mereka. Jadi jika ada perjalanan antara apa yang anda menerima dan apa yang anda mempunyai setiap bulan, anda sudah melakukan lebih baik daripada lebih banyak. Pertama, anda boleh beritahu saya berapa banyak yang anda beri. Sekarang, alat perjalanan tidak berapa banyak yang anda membuat atau apa yang anda ada. Itu sebenarnya semua perkara yang anda mempunyai tanpa semua perkara yang anda menghubungi. Itu alat perjalanan anda. Dan saya menghubungi alat perjalanan saya setiap bulan dalam perjalanan dan jika alat perjalanan anda bergurung setiap bulan, maksudnya anda berada di atas alat. Jika anda ingin mempunyai alat perjalanan alat saya, hanya menghubungi alat yang ditutupi dan saya akan memberikan kepada anda secara jenis. Pertama, anda tahu apa yang anda ada dan anda harus mempunyai pelan strategis untuk sebenarnya melayani. Alat perjalanan alat perjalanan melayani berada di atas 1.73 triliun ringit. Itu sebab 84.4% alat perjalanan anda dan sebagai alat perjalanan, ia sedia untuk sebenarnya mengalihkan sebuah alat. Tapi anda harus mempunyai pelan strategis untuk sebenarnya melayani. Melayani alat perjalanan anda yang paling tinggi itu dulu, lalu berjalan dengan ke jalan ke kecil. Pertama, anda ada pelajaran yang telah dibuat. Pada alat perjalanan yang sama, survey yang telah dikenali bahawa 61% alat perjalanan akan mempercaya untuk memasukkan bahkan 1000 ringit untuk kejalanan. Itu 6 dari 10 melayani. Jadi jika anda mempunyai 3-6 bulan alat pengguna, anda pasti akan berada di atas lebih banyak orang. Pertama, jika anda mempunyai pelajaran ini di tempat yang menerima lebih banyak perang yang anda beri. Pertama, anda sebenarnya berhenti mencari dengan orang yang berada di luar. Perjalanan adalah alat perjalanan yang teruk. Mereka akan selalu menjadi seseorang dengan kerja baru, rumah yang lebih besar, sebuah holiday yang lebih baik. Tapi semasa itu berhenti menghubungi anda, anda berhenti membeli hal untuk membentuk sesuatu dan anda boleh sebenarnya mulai mempercaya alat pengguna. Dan jika anda suka lebih banyak video seperti ini, anda boleh menikmati saya lebih banyak. Selamat tinggal.", "brk": "Hook类型: 身份共鸣\n结构: 抛出反常识现象 → 列举5个财务健康指标 → 评论区留关键词送表格\n为什么火: 用安慰焦虑的视角打破多数人觉得自己很穷的错觉，提供低门槛的对标数据\n改编角度: 针对35岁月光打工族，对比BNM数据证明其实你没那么差，教你用资产净值表摆脱卡债", "my": "【封面：5个信号你不差】\n你其实没那么差。\n\n第一，你每月收入，没有全飞掉。\n很多人一出粮，钱就不见。\n如果你还能留下一点点，\n哪怕只是几百块，\n你就已经比月光还稳。\n\n第二，你知道自己的 cashflow。\n不是看 bank balance 开心一下，\n而是知道钱去哪里了。\n这点很关键，\n因为不看账的人，\n通常不是没钱，\n是钱一直在漏。\n\n第三，你有 emergency fund。\n不用多，\n先有 1 个月的缓冲，\n你面对突发开销时，\n心不会那么慌。\n没有备用金的人，\n很容易一张卡顶一张卡。\n\n第四，你的 debt 有在动。\n不是只还 min pay，\n也不是每个月一直 roll。\n你有在看利息，\n有在想先还哪一笔，\n这就代表你不是放弃了。\n\n第五，你愿意面对钱。\n很多人最怕的，\n不是欠多少，\n是连打开 app 看都不敢。\n你一旦开始正视它，\n事情就已经开始变了。\n\n如果这几个里面，\n你有中两三个，\n真的不用先否定自己。\n你只是需要一个更清楚的顺序。\n\n你觉得你中了几个？留言讲讲你的想法。", "tags": "personalfinance, moneytips, financialliteracy, malaysia", "bait": true, "type": "Video", "likes": 567, "comments": 408, "er": 4.9, "followers": 19890, "date": "2026-10-13", "url": "https://www.instagram.com/p/Dec9K8jT5SX/", "video": true, "ratio": 0, "score": 9.0, "status": "未处理", "x": 1.2}, {"id": "Dfn8wuLH8l0", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "130,000 fans saw The Weeknd in KL. But where did all that money actually go? 🤔\n\nMost of your RM500 ticket didn’t even stay in Malaysia. I broke down where every ringgit really goes, who earns locally on concert night, and the 3 catches behind that “RM1.72 billion” headline everyone keeps throwing around.\n\n#theweeknd #concertmalaysia #malaysiaeconomy #kualalumpur", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 演唱会盛况引出消费现象 → 拆解门票资金流向与经济真相 → 警示本地人盲目消费的隐患\n为什么火: 借势顶级演唱会热点，把大众娱乐消费与宏观经济挂钩，引发强烈好奇\n改编角度: 戳中30-45岁月光族看演唱会花掉半个月薪水，卡债未还却盲目消费的面子心理与财务危机", "my": "【封面：RM500 门票值吗】\n130,000 人去看演唱会，爽的是一晚。  \n可是很多人刷卡那一刻，痛的是接下来三个月。\n\n你以为你买的是票。  \n其实你买的是一笔 cashflow 压力。\n\nRM500 看起来只是一次消费，  \n但如果你本来就月光，  \n这张票后面跟着的，可能是 dinner、parking、grab、甚至分期。\n\n最扎心的不是票贵。  \n是你出粮后，钱已经被生活和卡债吃掉了，  \n还要再给自己加一个 commitment。\n\n很多人不是不能娱乐。  \n是没先算 budget。  \n表面看是开心，  \n实际是下个月的 min pay 更难顶。\n\n如果你每次都靠信用卡撑生活，  \n先问自己一句：  \n这一次消费，是真的享受，还是在借未来的钱买今天的爽？\n\n你身边有没有这种情况？留言讲讲你的想法。", "tags": "theweeknd, concertmalaysia, malaysiaeconomy, kualalumpur", "bait": false, "type": "Carousel", "likes": 1530, "comments": 15, "er": 7.77, "followers": 19890, "date": "2026-11-12", "url": "https://www.instagram.com/p/Dfn8wuLH8l0/", "video": false, "ratio": 0, "score": 7.92, "status": "未处理", "x": 1.0}, {"id": "DeRSIffIAl9", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Budget 2027 is finally here, and there’s a lot to unpack 📊\n\nFrom tax cuts and higher personal relief, to a new RM2,000 minimum wage, housing stamp duty exemptions, and even auto EPF registration when you turn 18. Here’s everything you need to know in one place.\n\nSave this so you don’t miss anything that affects you 🤝\n\n#budget2027 #belanjawan2027 #malaysianfinance #personalfinancemalaysia #malaysia", "transcript": "", "brk": "Hook类型: 政策红利与痛点直击\n结构: 政策亮点盘点 → 重点影响解读 → 行动呼吁保存\n为什么火: 紧扣国家预算案，用极低门槛的干货帮粉丝快速抓取利益点\n改编角度: 盘点大马最新预算案对35岁月光族及小生意的税务与补贴影响，教你合法省钱避债", "my": "【封面：预算案跟你有关吗】\n生活费又要涨？\n\n预算案一出来，\n很多人先看涨薪，\n但我更想看，\n你每个月的 cashflow。\n\n如果你的薪水没变，\n可是家用、车贷、卡账，\n每一项都在吃钱，\n那你最先感受到的，\n不是新闻，\n是户口余额。\n\n还有一个很多人忽略的点，\n不是收入高不高，\n而是你的 money flow 顺不顺。\n\n你可以先做一件事，\n把这个月的固定开销列出来，\n再看哪些是必要，\n哪些是其实可以先缓一缓。\n\n看政策，不是为了兴奋，\n是为了知道自己要怎样调整。\n\n你觉得这类预算案，\n对你的生活费影响大不大？\n留言讲讲你的想法。", "tags": "budget2027, belanjawan2027, malaysianfinance, personalfinancemalaysia, malaysia", "bait": false, "type": "Carousel", "likes": 1472, "comments": 13, "er": 7.47, "followers": 19890, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeRSIffIAl9/", "video": false, "ratio": 0, "score": 7.6, "status": "未处理", "x": 1.0}, {"id": "DdvN243GoHx", "tracker": "FINANCE 竞对", "competitor": "bobngoh", "caption": "Watching my mum raise eight children alone shaped the way I wanted to care for my own family.\n\nI can’t promise I’ll always be here. \nBut while I am, I’ll do what I can to prepare for them.\n\nGiselle, Lexi & Lexa — I was thinking about you before I knew you. 🤍\n\n#lifelessons", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 母亲含辛茹苦养家 → 激发父爱责任感 → 提前规划家庭保障\n为什么火: 以真挚父爱和守护家庭的情感共鸣打动人心，引发强烈的情感共鸣。\n改编角度: 针对35岁本地打工族，以“不想让孩子重复自己月光、为家人留足保障”切入规划理财。", "my": "【封面：月光爸妈的盲点】\n看到家里缺钱，最怕什么？\n\n我看过太多大马家庭，\n不是不爱家人，\n是钱一到手，\n先被房租、车贷、卡债吃掉。\n\n很多人以为，\n自己只要继续拼，\n家人就会慢慢好过。\n\n但现实是，\n如果每个月 cashflow 都卡住，\n你对家人的责任，\n最后会变成压力。\n\n我不是叫你别顾家。\n我是说，\n顾家之前，\n先把出粮后的钱分清楚。\n\n先留生活费，\n再留还债的钱，\n最后才是给家里的钱。\n不然你会发现，\n人很累，\n心也很乱。\n\n其实欠卡一点都不可耻，\n好在我们还有解决事情的能力。\n\n你有没有试过，\n出粮没几天就没钱了？\n留言讲讲你的想法。", "tags": "lifelessons", "bait": false, "type": "Carousel", "likes": 6826, "comments": 57, "er": 7.28, "followers": 94544, "date": "2026-09-26", "url": "https://www.instagram.com/p/DdvN243GoHx/", "video": false, "ratio": 0, "score": 7.4, "status": "未处理", "x": 1.4}, {"id": "De3M5GiGh-7", "tracker": "FINANCE 竞对", "competitor": "bobngoh", "caption": "My sister encouraged me to share this. \nHer story shaped our IVF decisions and may help you ask questions before making yours.\n\nEvery child deserves love. \nEvery parent deserves an informed choice. 🤍\n\n#ivf #ivfjourney", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 引入家人经历 → 引发深度反思 → 给出理性建议\n为什么火: 用亲身痛点故事引发情感共鸣，提供高价值的决策参考\n改编角度: 讲大马30-45岁打工族因盲目跟风借贷或过度消费导致月光，如何通过记账与理性规划扭转财务困境", "my": "【封面：结婚前先算钱】\n结婚前先算钱。\n\n很多人以为，结婚是两个人的事。\n其实在马来西亚，结婚后最先撞到的，常常是 cashflow。\n\n你不是不想给家人更好的生活。\n你只是每个月出粮，薪水一进来。\n房租，家用，车供，信用卡，样样都在等你。\n\n如果连自己现在的 commitment 都没算清楚。\n婚礼预算，孩子，父母的医药费，后面每一项都会压上来。\n\n我不是叫你不要结婚。\n我是叫你先问自己一个问题。\n如果今天多一笔开销来了，你的预算顶得住吗。\n\n很多压力，不是因为你不够努力。\n是因为你太晚才面对钱的逻辑。\n\n你怎么看？\n留言讲讲你的想法。", "tags": "ivf, ivfjourney", "bait": false, "type": "Carousel", "likes": 6638, "comments": 41, "er": 7.06, "followers": 94544, "date": "2026-10-24", "url": "https://www.instagram.com/p/De3M5GiGh-7/", "video": false, "ratio": 0, "score": 7.15, "status": "未处理", "x": 1.3}, {"id": "Dd1MLRMNWtY", "tracker": "FINANCE 竞对", "competitor": "bobngoh", "caption": "I’ve wanted to do this since the day they were born. 😂\n\nLike finally. 😍🥺\n\n#mylove #newborn #twins", "transcript": "çours çours y cosmos ç rural yusuf", "brk": "Hook类型: 情感共鸣\n结构: 情感铺垫 → 愿望达成 → 结果展示\n为什么火: 双胞胎出生的罕见喜悦与多年心愿达成的真实情绪极具感染力\n改编角度: 晒出30-45岁本地华人拼搏多年终于全额清还车贷房贷的解脱感与喜悦", "my": "【封面：双薪也月光】\n你以为是养娃贵？\n其实最贵的是现金流断掉。\n\n很多双薪家庭，\n不是赚不够，\n是钱一到手，\n就被房贷、车贷、孩子补习，\n一点一点切掉。\n\n表面上看，\n两个薪水很体面。\n现实是，\n一出粮就像在过关卡。\n\n我见过最常见的状况，\n不是不爱孩子，\n是每个月都在硬撑，\n连 emergency fund 都没留。\n\n所以问题不是要不要养，\n是你有没有先算过 commitment。\n孩子一来，\n最先爆的常常不是爱心，\n是 budget。\n\n如果你身边也有人\n一边养家一边月光，\n你觉得问题出在哪里？留言讲讲你的想法。", "tags": "mylove, newborn, twins", "bait": false, "type": "Video", "likes": 5942, "comments": 148, "er": 6.44, "followers": 94544, "date": "2026-09-28", "url": "https://www.instagram.com/p/Dd1MLRMNWtY/", "video": true, "ratio": 0, "score": 6.75, "status": "未处理", "x": 1.2}, {"id": "De1IHF7IPvf", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "If you’re travelling overseas soon, don’t use just any debit card 💳\n\nThe wrong card can quietly cost you RM100+ in hidden FX markup fees on a single trip. The right one charges you 0% and sometimes even gives you cashback.\n\nI rounded up the best debit cards for overseas spending in Malaysia, including which ones to use for cashback, cash withdrawals, and lowest fees 🤝\n\n#travelcard #debitcard #personalfinance", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 揭露隐藏手续费 → 对比错误卡片代价 → 给出马来西亚本地最优卡片推荐\n为什么火: 切中旅游族群不想当冤大头的心理，用具体金额（RM100+）制造痛点。\n改编角度: 针对30-45岁常出国旅游的马劳与小老板，揭秘海外刷卡隐藏汇率差，教你避坑省钱。", "my": "【封面：换汇多亏RM100】\n出国别乱刷卡。\n\n你以为你刷的是消费，\n其实你刷的是 hidden fee。\n\n很多人去曼谷、台湾，\n回来看账单才发现，\nRM100 这样 quietly 不见了。\n\n问题不是你花太多，\n是你用错卡。\n\n有些卡看起来方便，\n其实 FX markup、cash withdrawal fee、\n还有汇率差，一层一层加上去。\n\n我会先看两样东西。\n第一，foreign transaction fee。\n第二，银行给你的 exchange rate。\n\n如果你是要旅游用，\n就不要只看 card 能不能刷，\n要看它收你多少隐形成本。\n\n出发前先 check 一次，\n不要等回国才对账。\n\n你最近有出国计划吗？留言讲讲你的想法。", "tags": "travelcard, debitcard, personalfinance", "bait": false, "type": "Carousel", "likes": 1299, "comments": 12, "er": 6.59, "followers": 19890, "date": "2026-10-23", "url": "https://www.instagram.com/p/De1IHF7IPvf/", "video": false, "ratio": 0, "score": 6.71, "status": "未处理", "x": 0.9}, {"id": "Dfb_gkljw0E", "tracker": "FINANCE 竞对", "competitor": "hongli_724", "caption": "15岁，\n一天站8-10个小时 赚RM80，\n我才发现 赚钱真的很不容易。\n\n17岁 中学毕业，\n我拼尽全力考到的成绩 换来了大学的敲门砖。\n\n但我真的不想要让家人辛苦，\n所以我选择走上一条完全不一样的路。\n\n26岁，我站在了超过500位观众的舞台分享。\n这7年的经历 真的让我成长很多。\n\n我也还在变得更好的路上，这条路 谢谢有你的见证✨\n\n#HongLiSharing #MyDream", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 早年辛酸打工 → 拒绝常规读书出路 → 26岁达成阶段成就\n为什么火: 真诚的个人奋斗史引发读者对青春与成长的强烈共情\n改编角度: 讲述35岁大马打工族从月光负债到学会理财的心路历程，直面本地生活压力", "my": "【封面：月光不是没救】\n你以为你是乱花钱？\n\n我见过很多大马打工族，\n不是赚太少，\n是每个月一出粮，\n钱就被卡债和生活开销分完。\n\n以前我也以为，\n只要努力工作，\n钱自然会慢慢好起来。\n\n但后来我才发现，\n真正卡住你的，\n不是薪水，\n是你不知道钱要先去哪里。\n\n有些人看起来很会还，\n每个月只还 min pay，\npayment record 也美美的，\n可是手头现金越来越少。\n\n表面上没事，\n其实是在用未来的 cashflow，\n填今天的洞。\n\n我现在更在意的，\n不是你赚多少，\n而是你出粮后，\n有没有先分好 budget，\n先保住自己的生活，\n再处理债务。\n\n因为钱一乱，\n人也会跟着乱。\n\n其实欠卡一点都不可耻，\n好在我们还有解决事情的能力。\n\n你现在最卡的是月光，还是卡债？留言讲讲你的想法。", "tags": "HongLiSharing, MyDream", "bait": false, "type": "Carousel", "likes": 695, "comments": 6, "er": 5.82, "followers": 12055, "date": "2026-11-07", "url": "https://www.instagram.com/p/Dfb_gkljw0E/", "video": false, "ratio": 0, "score": 5.91, "status": "未处理", "x": 1.0}, {"id": "Dd5-WAxsYRM", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "EPF’s Adequate Savings is a solid guideline to follow. But if you want to be ahead of most people, and actually keep up with inflation, this is the number to aim for. 👀\n\nThink about it. RM476,000 at 55 sounds like a lot today. But with prices rising every year, that same amount will buy a lot less by the time you retire. Food, healthcare, housing. Nothing is getting cheaper.\n\nThis table assumes you start at RM3,500 salary at 23, get steady raises, and never touch your EPF. Real life is messier, of course. Career breaks, job changes, withdrawals. So don’t panic if you’re below. Use it as a direction, not a verdict.\n\nThe good news? EPF compounds quietly in the background. The earlier you know where you stand, the more time you have to catch up. 💪\n\nSo be honest, where are you on this table? Below, on track or ahead? Comment down below 👇\n\nSave this post and check again next year 📌\n\n#epf #kwsp #personalfinance #malaysia #saving", "transcript": "MICHAEL", "brk": "Hook类型: 痛点直击\n结构: 提出EPF基本目标 → 揭示通货膨胀残酷现实 → 呼吁自我对照与行动\n为什么火: 紧扣马来西亚人依赖的公积金话题，用具体数字击碎退休焦虑\n改编角度: 针对35-45岁常月光或欠卡债的本地打工族，揭秘EPF够不够用并教你如何加码退休金", "my": "【封面：EPF 不够用？】\n你以为 EPF 够？\n对 35 到 45 岁的打工族来说，很多人最危险的，不是没存钱，是以为有 EPF 就安心了。\n\n问题是，退休时最贵的不是数字，是生活成本。\n今天一杯 kopi 才几块钱，过了十几年，食物、医药、房租，全部都在吃你的现金流。\n\n所以我看钱，都会先看两个东西。\n第一，出粮后你还剩多少 cashflow。\n第二，你现在的 commitment，有没有把你未来也绑住。\n\n如果你每个月月光，又背着卡债、车贷、房贷，那不是你不努力，是你的钱根本没留下空间给未来。\n\nEPF 只是底线，不是答案。\n你现在先做的，不是幻想退休那天，而是把每个月的钱流看清楚，先把会漏钱的洞补起来。\n\n你现在是 EPF 看起来有，手上却没钱的人吗？留言讲讲你的想法。", "tags": "epf, kwsp, personalfinance, malaysia, saving", "bait": true, "type": "Video", "likes": 1019, "comments": 36, "er": 5.3, "followers": 19890, "date": "2026-09-30", "url": "https://www.instagram.com/p/Dd5-WAxsYRM/", "video": true, "ratio": 0, "score": 5.67, "status": "未处理", "x": 0.7}, {"id": "DfUWVH2BJm5", "tracker": "FINANCE 竞对", "competitor": "bobngoh", "caption": "The easiest banana cake you’ll ever make! 🍌🍫\n\nWho says you can’t bake when you’re looking after a baby? 😂\n\nSimple ingredients, minimal effort, and absolutely delicious!\n\n🍌 Ingredients:\n\n* 330–360g ripe bananas (peeled)\n* 2 large eggs (room temperature)\n* 60–80g peanut butter\n* 70–90g Greek yogurt\n* 130g maple syrup\n* 200g oat flour\n* 4g baking powder\n* 2g baking soda\n* 2–4g sea salt\n* 1 tsp cinnamon powder\n* 85g dark chocolate chips\n\nOptional toppings:\n\n* 1 whole banana, sliced lengthwise\n* Extra dark chocolate chips\n\n👨🏻‍🍳 Instructions:\n\n1. Preheat oven to 180°C (top and bottom heat).\n2. Mash the ripe bananas in a large mixing bowl.\n3. Add eggs, peanut butter, Greek yogurt and maple syrup. Mix well.\n4. Add oat flour, baking powder, baking soda, sea salt and cinnamon. Mix until combined.\n5. Fold in the dark chocolate chips.\n6. Pour the batter into a loaf pan lined with parchment paper.\n7. Top with sliced banana and extra chocolate chips if desired.\n8. Cover loosely with aluminium foil a", "transcript": "Easy as banana cake. Three ripe bananas. Two larch eggs. Peanut butter. Yogurt. Vanilla extract. Baking powder. Baking soda. A little bit of maple syrup. Mash it. Go off the floor. Blend it. Cinnamon powder. Salt. Chocolate chips. Chocolate chips on top. 180 degrees for one hour. With aluminum foil for 30 minutes. Uncover it for 30 minutes. It looks amazing. Go make it. Bye bye.", "brk": "Hook类型: 痛点直击\n结构: 抛出极简做法 → 快速过原料 → 展示成品诱惑\n为什么火: 极低门槛的家庭烘焙过程治愈且具视觉诱惑力\n改编角度: 针对30-45岁月光打工族或小生意老板，痛陈“看似简单省钱却因记错账或盲目消费，导致每月薪水或营业额一到月底就见底”的财务漏洞。", "my": "【封面：3招存到钱】\n月光也能存钱。\n第一招，发薪先切。\n先把预算分开，生活费、还债、备用金。\n第二招，自动转账。\n把该存的，先转去另一个户口。\n第三招，卡住开销。\n看到想买的，先放 24 小时。\n你会发现，钱不是不够。\n是太快流走。\n如果你也常常出粮就空，留言讲讲你的情况。", "tags": "HomemadeBaking, DadLife, HealthyRecipes", "bait": false, "type": "Video", "likes": 4964, "comments": 58, "er": 5.31, "followers": 94544, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfUWVH2BJm5/", "video": true, "ratio": 0, "score": 5.43, "status": "未处理", "x": 1.0}, {"id": "DeiRDxSk9Xe", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Don’t let one bad day make you forget about everything that’s still good 🤍\n\n1 bad hour doesn’t erase the other 23. 1 bad week doesn’t cancel out the other 3. 1 bad year doesn’t define your whole life. Perspective is everything.\n\nSave this for the day you need the reminder 🔖\n\n#mindset #motivation #lifelessons #malaysia #fyp", "transcript": "", "brk": "Hook类型: 痛点直击\n结构: 情感共鸣 → 视角切换 → 收藏提醒\n为什么火: 用时间对比法化解焦虑，击中现代人精神内耗的痛点。\n改编角度: 针对30-45岁月光族和店主，用“一年生意不好或一次冲动消费不代表全盘皆输”重塑理财心态。", "my": "【封面：1次花光全年】\n一次年花光积蓄。\n不代表你这一年都失败。\n\n一笔过年开销。\n不等于你整年现金流都没救。\n\n很多人一到过年。\n红包、吃喝、回乡、聚会。\n一轮下来，户口直接见底。\n\n但你要看的不是那一晚。\n是你平常有没有 budget。\n有没有先把出粮分好。\n有没有留一点 cashflow 缓冲。\n\n真正把人压垮的。\n不是某一次花太多。\n是每个月都没留余地。\n一出事，就只能刷卡顶。\n\n所以别被某一天吓到。\n你先看整年的钱流向。\n再决定下个月要怎么分。\n\n你今年有没有这种感觉？\n留言讲讲你的想法。", "tags": "mindset, motivation, lifelessons, malaysia, fyp", "bait": false, "type": "Carousel", "likes": 1045, "comments": 12, "er": 5.31, "followers": 19890, "date": "2026-10-16", "url": "https://www.instagram.com/p/DeiRDxSk9Xe/", "video": false, "ratio": 0, "score": 5.43, "status": "未处理", "x": 0.7}, {"id": "DdlahXwhwj1", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Did you know the company called Perodua doesn’t actually build a single Perodua? 🤯\n\nWe drove almost 360,000 of them off the lot last year, yet the story of who really owns what behind the scenes is way more complicated than most Malaysians realise.\n\n#perodua #malaysia #fyp", "transcript": "Lain tahun, Malaysia membuangkan sekitar 360,000 produk. Itu seharusnya 44% dari semua kawasan baru di sini. Dan ini adalah perkara yang saya hanya menemukan kelebihan yang terkenal yang disebut produk tidak sebenarnya membuangkan satu-satunya. Biar saya jelaskan kerana mereka sebuah produk. Sekarang, yang paling terkenal untuk saya adalah pembina Perusahan Automobil Kedua, yang adalah kedua kawasan kawasan tersebut. Itu adalah kawasan yang dikatakan di dalam kawasan, bilik syurga dan kawasan di dalam kawasan yang anda bawa kepada MIV2. Malaysia mempunyai sekitar 68% dari itu, dengan UMW, MBM, dan juga PNB. Jadi di kawasan itu, ya, ia adalah kekakangan yang sangat baik. Tapi kawasan mereka menghubungi pembinaan di Sungai Chuo Rawang. Dan pembina itu berada di dalam pembina yang berbeda yang berbeda disebut Perusahan Automobil Kedua. Perusahan pembinaan hanya mempunyai sekitar 49%. Pembuangan yang lainnya adalah untuk Dahetsu dan juga Mitsui Jepang. Seperti sebuah restoran. Kita mempunyai pembinaan, kawasan dan pembina, tapi kawasan kita mempunyai kawasan. Dan kawasan itu adalah keadaan yang sebenarnya membuat makanan. Sekarang, ini adalah kawasan yang terjadi. Selama 2008, apabila pembinaan ini masih di luar, kawasan kawasan kawasan membuat sekitar 219 milion ringgit di profit. Semasa kawasan kawasan Malaysia membuat kawasan kawasan kawasan hanya 179 milion ringgit, walaupun dengan lebih banyak rehat. Jadi kawasan itu membuat kawasan lebih banyak daripada restoran. Ada juga kawasan yang diperlukan. Perodua hanya memperoleh untuk mengeluarkan keadaan di mana Dahetsu belum membeli. Sebab itulah kita mempunyai Punggung, Fiji, Sri Lanka dan juga Malaysia. Dan di Indonesia, Mabis itu di luar sekarang sebagai Dahetsu Syrion. Sama kerja, sama pembinaan Rawa, hanya satu beda. Sekarang, saya tidak mengatakan perodua yang terlalu teruk. Ia menyebabkan kawasan yang benar, kawasan yang berlainan dan lebih dari 30 tahun kekakutangan yang kita belum ada sebelumnya. Tapi ia benar-benar mengenai apa yang kita sebenarnya memakai. Kadang-kadang, memakai nama bukan sama seperti memakai hal. Jobis!", "brk": "Hook类型: 痛点直击\n结构: 认知反差 → 揭秘真相 → 利益重组\n为什么火: 用国民神车Perodua的代工真相打破大众盲目消费认知。\n改编角度: 揭秘大马人常买的Myvi背后的车贷真相，警示30-45岁打工族别为面子买车导致常年月光负债。", "my": "【封面：Myvi 也会吃钱】\n你以为买车就结束？\n\n很多人供车的时候，\n只看到月供 RM几百，\n没看到它每个月一起带走的，\n是你的 cashflow。\n\n车贷只是第一关。\n保险、路税、维修、油钱、\nparking、toll，\n这些才是长期的 commitment。\n\n最可怕的是，\n你会以为自己“有车了”。\n其实只是多了一笔固定开销。\n\n尤其是月光的人，\n车不是不能买，\n是你要先算清楚：\n供完之后，\n你还有没有钱过生活。\n\n我不是叫你不要买车。\n我是叫你先看懂，\n这笔钱会不会压到你的每个月。\n\n你有没有试过，\n车还没坏，\n钱先坏了？\n留言讲讲你的想法。", "tags": "perodua, malaysia, fyp", "bait": false, "type": "Video", "likes": 916, "comments": 27, "er": 4.74, "followers": 19890, "date": "2026-09-22", "url": "https://www.instagram.com/p/DdlahXwhwj1/", "video": true, "ratio": 0, "score": 5.01, "status": "未处理", "x": 0.7}, {"id": "DfVrJ6TTI53", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "Salary going up but still broke? It might be your lifestyle, not your income. \n\nMy parents taught me: if you want to live happily, live below your means.\n\nWhen your expenses stay the same as your income grows, every extra ringgit goes to savings and investments. That’s how real financial freedom is built.\n\n💬 How much of your salary do you save each month? Comment below 👇\n\n#personalfinance #livebelowyourmeans #financialfreedom #savingmoney #malaysia", "transcript": "Music", "brk": "Hook类型: 痛点直击\n结构: 薪水增加却月光 → 点破消费陷阱 → 量入为出实现财务自由\n为什么火: 直击现代人“越赚越多却越穷”的普遍焦虑，引发强烈共鸣\n改编角度: 针对大马30-45岁打工族薪水涨却卡债还完又欠，教你用量入为出法存下第一桶金", "my": "【封面：加薪还月光？】\n加薪了还月光？\n问题通常不是薪水。\n\n很多人一加薪，\n生活就跟着升级。\n车换新一点，\n吃贵一点，\n孩子补习多一点，\n卡也刷得更顺手。\n\n结果呢？\n每个月进来的 RM，\n还是一出粮就飞走。\n\n我一直觉得，\n最难管的不是收入，\n是欲望跟着收入一起长大。\n\n你薪水多了，\n如果开销也一起长大，\n那你只是换个更贵的月光方式。\n\n真正有空间的人，\n不是赚得最多那个，\n是能把生活维持在预算内那个。\n\n你现在是薪水在涨，\n还是开销在涨？\n留言讲讲你的想法。", "tags": "personalfinance, livebelowyourmeans, financialfreedom, savingmoney, malaysia", "bait": false, "type": "Video", "likes": 893, "comments": 21, "er": 4.6, "followers": 19890, "date": "2026-11-04", "url": "https://www.instagram.com/p/DfVrJ6TTI53/", "video": true, "ratio": 0, "score": 4.81, "status": "未处理", "x": 0.6}, {"id": "Dd2YQDWT2dY", "tracker": "FINANCE 竞对", "competitor": "rotitelurfinance", "caption": "For years I saved the way most Malaysians do. Spend first then save whatever is left. But that method depends way too much on self control, which nobody has every single month 🫠\n\nOne small tweak that’s helped is using MAE Tabung on the MAE app. It automates the boring parts of saving so I don’t have to think about it. Sometimes the simplest solution is just taking your own willpower out of the equation.\n\n#MAETabung #ItsGottaBeMAE", "transcript": "Did you know that a survey found that 61% of Malaysians have difficulty raising 1000 ringgit for an emergency? And honestly, I can see how that happens because I used to save the way a lot of people do. Spend first and then at the end of the month, save whatever that is left. But a problem with that is sometimes nothing is left. That is why now I'm exploring ways to keep me saving either way, when I'm disciplined and when I overspend. And lucky enough, I found this. Let me show you how it works. Because I make sure the saving process happens before I get the chance to spend the money. Let's say I'm traveling to Japan and instead of waiting until the end of every month and deciding how much I can afford to save, I decide the amount upfront and make the saving happen automatically with Mei Tabong. Just simply turn on auto reduction when creating a new tabong and you're good to go. And you don't need to think about it anymore after that. It just happens. But what if I decided to travel together with my friends instead? Friends trying to get everyone to pay for their portion is always a headache. So to avoid everyone saying, later, closer to the trip only I will transfer and start preparing, I can just create a group tabong, invite up to 4 friends and get them to contribute. No more excuses and now everyone can slowly put up their own portion towards that goal. Now I'm not going to pretend I never overspend. I collect TCG cards so shopping is my weak spot lah. But that's where Guilty Pleasure Booster comes in. You choose a spending category where you know you tend to overspend, set a daily spending limit and decide an amount to go into your tabong if you cross that limit. For example, I can set a daily limit of 500 ringgit and if I spend beyond that limit, 50 ringgit will automatically be transferred for my account into an active tabong. So at least when I do spend a little bit more than I should, I don't feel as guilty lah. Because I'm still putting something towards my savings at the same time. So my savings works both ways lah. Good month I save, bad month I also save. Which is way more realistic than expecting perfect self-control every single month. Because the goal isn't to be perfect with money. It's to build a system that saves for you on the months you don't. So when you create your next tabong, remember to switch on auto deduction and turn on your tabong booster. Set it once and let it do the rest. Ciao peace.", "brk": "Hook类型: 痛点直击\n结构: 亮出61%大马人难拿出千吉应急存款 → 揭秘先花后存必月光死局 → 引入MAE自动存款系统与惩罚机制\n为什么火: 用大马人共鸣的存款难痛点切入，结合Maybank功能给出反人类自律的自动化解法\n改编角度: 针对35岁月光打工族，拆解如何用MAE自动化扣款对付周末喝Kopi和Shopee网购的坏习惯", "my": "【封面：月光不是懒】\n你不是不会存钱。\n你是每次都先花。\n\n很多马来西亚打工族，\n都是这个顺序。\n\n出粮先吃先买，\n剩下多少才想存。\n\n问题是，\n有些月根本剩不到。\n\n所以我现在看钱，\n第一件事不是问，\n这个月还能存多少。\n\n我先问，\n钱会不会先被花掉。\n\n因为如果你靠意志力，\n很容易一忙就忘，\n一冲动就 ortant. So start practicing that and start that being the pattern within your marriage because you are two adults and one of you does not need to be carrying the whole thing.", "brk": "Hook类型: 身份共鸣\n结构: 夫妻金钱观差异 → 避免一方像父母管束另一方 → 共同制定家庭预算\n为什么火: 直击夫妻因金钱观不同导致的情感与财务压力痛点\n改编角度: 针对大马30-45岁常月光的中产夫妻，揭露一人管钱另一人摆烂致卡债滚雪球的盲点，教夫妻俩如何坐下来一起搞定家庭财务。", "my": "结婚之后你会发现，一个很爱存钱的人，通常都会娶到或者嫁给一个很会花钱的人。\n\n两个完全不同性格的人走在一起，一个负责省，一个负责买。\n\n本来这是互补，但是日子久了，往往变成一个在后面拼命追，一个在前面乱花。\n\n最怕的是什么？\n\n管钱的那个人，突然觉得自己好像变成了对方的老爸老妈。\n\n每天在后面盯着、碎碎念、还要发脾气。\n\n被管的那个人呢，觉得好像在学校被老师罚站，讲到钱就想逃。\n\n其实，做 budget 不是一个人单方面去审判另一个人。\n\n不是你拿出一张纸，指着对方说，从今天开始你不准这样花。\n\n那个不叫沟通，那个叫制造压力。\n\n真正要做的是坐下来，坦白讲出心里的话。\n\n我一个人扛着这个家的 commitment，其实很累。\n\n金钱的事情，从来都不是一个人的责任。\n\n那个比较细心、负责做 payment 的人，去执行细节。\n\n但是钱到底要流向哪里，两个成年人必须在钱离开户口之前，一起决定好。\n\n当另一半真正参与进来的时候，你会突然发现，那种一个人扛着全家 cashflow 的压力瞬间少了很多。\n\n你身边的另一半是个成年人，不是你的孩子。\n\n家里的 financial 状况，需要两个人一起面对。\n\n你和另一半平时是怎么分配家里的开销的？\n\n你觉得一个人管钱比较好，还是两个人一起做 budget？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 5846, "comments": 34, "er": 1.44, "followers": 407114, "date": "2026-10-22", "url": "https://www.instagram.com/p/Dezn-EfFBN4/", "video": true, "ratio": 0, "score": 1.46, "status": "未处理", "x": 2.0}, {"id": "DejwD9uHboy", "tracker": "FINANCE 竞对", "competitor": "georgekamel", "caption": "Just a little fridge cig to take the edge off 😮‍💨", "transcript": "Second hairuk", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 5224, "comments": 214, "er": 1.27, "followers": 428642, "date": "2026-10-16", "url": "https://www.instagram.com/p/DejwD9uHboy/", "video": true, "ratio": 0, "score": 1.37, "status": "未处理", "x": 2.0}, {"id": "DevNp4gTYGz", "tracker": "FINANCE 竞对", "competitor": "iherng", "caption": "“Without the house means no wedding?!”\n.\nAs much as we discussed about how irrelevant property ownership means, we still have people who refuse to tie the knot with their partner just because there’s no place to call home. Well in this example, it’s a RM1.5 mil house l  put like, you know, 60, 80 bucks in each card. Good God! That's weird. Thank you! Oh my gosh. And there's a birthday tomorrow. That's what I'm calling right now. Too late. You're in on that one. You can't fix that one. Well, on that one, yeah, but like how do I bring up like... You don't! How am I getting together? You don't. Your husband has to. No, okay. I would not make it about them. I would not make it. His job though is to fix his family, not yours. Really, that's bad mojo. You do not want to get in that relationally. But he should sit down and say, hey guys, we're working on some financial goals and we'll be happy to pay our part of the dinner and come to dinner with everybody and celebrate, but we're not going to give grown adults any cash anymore because we're working on some other stuff. We love y'all though. If he wanted to give some like thoughtful gift or something, you know what I mean? Like you can do something for 20 bucks of like, hey, I saw this, you know, Uncle Rick and I thought of you and that's his birthday gift versus giving a check of $75. Or 20, you know? Or three 20s or something. Let me say this, Evan. You're correct. This is absurd. But if it almost wouldn't be a hill though that I would just push and push and push and push because it happens six times a year and you got to just live with it. And it's a roll the eyes kind of thing, but he should because it is kind of. I don't disagree. It's weird. It's just a bunch of 60 year olds giving each other 80 bucks. That's just weird.", "brk": "Hook类型: 痛点直击\n结构: 提出人情消费负担 → 专家给出拒绝话术 → 总结取舍标准\n为什么火: 戳中成年人疲于应付无效社交与人情债的现实痛点\n改编角度: 针对35岁本地华人打工族，吐槽亲友满月酒、结婚喜帖等无休止人情红包，教你如何委婉拒绝", "my": "过年收红包送礼的隐形负担，真的让人喘不过气。\n\n每次新年或亲戚生日，一群成年人互相包红包送礼。\n\n表面上看起来是礼尚往来，其实大家都在硬撑。\n\n结果就是出粮没多久，手头上的现金越来越少。\n\n很多人不知道怎样拒绝，怕被讲孤寒或者不给面子。\n\n其实你可以直接跟家里人沟通。\n\n让另一半去跟自己的家人讲。\n\n告诉大家我们在做着一些理财的 budget 和 goal。\n\n吃饭庆祝我们很乐意参与，也愿意付自己的部分。\n\n但是互相给现金这种礼俗，我们今年开始就不参与了。\n\n如果真的要送，可以换成比较有心思的小礼物。\n\n而不是流于形式的钞票往来。\n\n如果长辈真的很在意，一年那几次的聚会，偶尔翻个白眼也就过了。\n\n不需要为了这种事搞到关系太僵。\n\n你身边有没有这种让人头痛的人情负担？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 4407, "comments": 253, "er": 1.14, "followers": 407114, "date": "2026-09-22", "url": "https://www.instagram.com/p/DdmHbEwDPZC/", "video": true, "ratio": 0, "score": 1.27, "status": "未处理", "x": 1.8}, {"id": "DehWAIKgfhQ", "tracker": "FINANCE 竞对", "competitor": "simonsinek", "caption": "At one point, the most important people in our lives were strangers.\n\nI asked psychotherapist Esther Perel (@estherperelofficial) for the one relationship skill we should all master, and her answer surprised me.\n\nWhen’s the last time you started a conversation with someone you didn’t know?\n\n🎧 While A Bit of Optimism is on hiatus, listen to my full conversation with Esther wherever you get your podcasts.", "transcript": "What's the number one relationship skill? Talk to strangers. Ooh, say more. When you spend all your time like this, looking down, you don't notice who's around you. You don't talk to people on a plane. You don't talk to people in a queue. You don't talk to people while you're waiting for your coffee. I mean, you don't talk to strangers. Right. And talking to strangers is improvisation, spontaneity, serendipity, surprise, novelty, an active engagement with the unknown, which is what is trust. Trust is an active engagement with the unknown. If you don't know to talk to strangers, you have less trust.", "brk": "Hook类型: 痛点直击\n结构: 抛出反常识核心观点 → 批判现代人低头生活现状 → 升华信任与未知的关系\n为什么火: 用日常小事切入反直觉观点，引发关于社交冷漠与信任缺失的深度共鸣\n改编角度: 戳中35岁本地打工族只敢刷手机不敢拓展人脉，导致薪水停滞或小生意客源窄的痛点", "my": "很多人以为理财最难的是看懂什么投资技巧。\n其实不是。\n理财最重要的一种能力，是敢跟别人聊钱。\n现代人有一个习惯。\n买什么都看电话，做工看电话，排队看电话，喝咖啡看电话。\n我们宁愿刷别人的生活，也不愿意转头跟旁边的人聊聊真实的财务压力。\n我们习惯把财务状况收得紧紧的。\n觉得欠卡债很丢脸。\n觉得cashflow不够用很丢脸。\n觉得每个月出粮就清空很丢脸。\n但你有没有发现。\n信任，其实就是一场你去面对未知的主动互动。\n如果你永远不敢跟别人谈钱的盲点。\n你就永远只能自己一个人面对那些不断滚大的commitment。\n其实欠卡一点都不可耻，好在我们还有解决事情的能力。\n你最近一次跟身边信任的人聊起真实的财务状况是什么时候？\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 60939, "comments  it cheap of us to know that we're going to be receiving gifts but not give gifts because we're focusing on ourselves? Or is this the time when we just put our financial goals aside so that we can gift people with something? Our families years ago when Sharon and I went broke, we sat down and there's 20 something people involved. And we said, guys, we're really sorry. We cannot afford to buy everybody a gift. We're begging you guys to join us in this. It's kind of gotten ridiculous anyway. Let the adults draw names and each one by one a gift. Little kids that are under whatever, 10 or something, get gifts and the rest of them are in the drawing because we don't want to come in here and feel guilty. And if y'all are all going to give each other gifts and we're going to be sitting here feeling guilty, we're not going to be able to come because we don't want to sit here in that. And you know what? They went, thank God, somebody said it out loud. We always were thinking the same thing. They weren't even broke and they were just glad to draw names. I personally don't think you're cheap. I think forced generosity where I'm giving you something and I'm expecting something in return. That is not the spirit of giving to begin with. So if you've had that conversation and they are resentful of you, then you can't carry that.", "brk": "Hook类型: 痛点直击\n结构: 坦白没钱送礼 → 提出抽签送礼解法 → 众人附和释放压力\n为什么火: 直面人情消费的社会压力，说出了大众不敢说的心声\n改编角度: 针对新年过节送礼压力，教35岁打工族如何拒绝亲戚红包和昂贵送礼", "my": "华人过年送礼和包红包，是不是让你压力很大？\n\n每年一到这个时候，家里亲戚朋友聚在一起。\n\n表面上热热闹闹，实际上大家都在比较今年送什么牌子的礼盒。\n\n红包要包多少才够大方，才不会被人在背后讲。\n\n为了这些面子消费，很多人出粮没多久，手头上的 cashflow 就直接见底。\n\n其实好几次我都想开口讲，大家可不可以不要送来送去。\n\n但又怕别人觉得自己小气，或者不够得体。\n\n这种被迫的慷慨，根本不是真正的情谊。\n\n如果你的财务状况已经在吃紧，真的不用为了别人的期待去打肿脸充胖子。\n\n真正关心你的人，看重的是你这个人，而不是你送的礼物有多贵。\n\n今年过年，试着把这些无效的人情负担放下。\n\n你身边有没有人也是这样，为了过年送礼压力很大？\n\n留言讲讲你的想法。", "tags": "", "bait": false, "type": "Video", "likes": 4333, "comments": 98, "er": 1.09, "followers": 407114, "date": "2026-11-16", "url": "https://www.instagram.com/p/Df0Vstw yle is the priority, the wealth building process will take way longer. Or we could first be discipline for the short term (5-7 years) just to get the infrastructure right, then we can just cruise easily for the future. \n.\nAs a man, I think most of us are okay to provide and sacrifice for the family. But I would strongly suggest to communicate that with our partner. At least they know what and why we are doing❤️ \n#property #investment #realestate", "transcript": "Saya hanya secara seronok dengan rindu saya. Rindu saya sangat berguna dengan keluarga. Dia minta saya beli atau rindu. Tapi kami ingin dapat tinggal di negem ayah kami. Jadi ayah kami berdua berdua berdua di Puchong. Sekarang Puchong sangat ekskensif. Jadi kami mencari perjalanan. Dan saya mencari sekitar 500k. Saya juga ingin mempunyai beberapa perjalanan untuk... ...masuk, untuk makanan dan sebagainya. Berapa banyak yang anda buat? Lain ini saya ada berapa? Sekarang saya ada sekitar 6. Jadi rindu saya sekitar 5. Jadi 5. Kita tidak mengalami perjalanan suami anda. Itu yang saya lakukan. Pembuah anda untuk perjalanan 500k... ...dan anda mempercayai 90% perjalanan. Jadi rindu anda berpunyai sekitar 2k. Jadi rindu anda berpunyai 3k. Awak ada kereta? Ya. Sekarang saya berpunyai 1.2 bulan. Jadi saya mengalami 1.5. Hal yang saya mempunyai adalah... ...dengan ayah saya. Ha! Saya juga berpunyai. Saya juga tinggal dengan ayah saya sekarang. Dalam perjalanan, makanan dan sebagainya... ...tidak begitu banyak kerja untuk risaukan. Pada jalan saya, ia adalah... ...saya ada 2 cara tentangnya. Satu adalah biarkan ayah kamu berhati-hati. Dapat rumah Chewan. Kemudian kita membangun keadaan. Pertama, jika kamu ingin pembentangan... ...masukkan rumah. Dapat pembentangan yang ada. Kerana tidak ada cara lain... ...untuk membangun. Apabila kamu membangun rumah diri... ...kamu tidak boleh membangun untuk yang lain. Sehingga kemudian... ...kamu membangun 12k tahun lalu. Tak mungkin? Sebenarnya, saya fikir... ...kalau saya memb
